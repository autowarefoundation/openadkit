# Bug Report Template
name: Bug
description: Report a bug
type: Bug
body:
  - type: textarea
    attributes:
      label: Description
      description: Write a brief description of the bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Write the steps to reproduce the bug.
      placeholder: |-
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    attributes:
      label: Deployment
      description: The deployment and its options, or your kit's deployment.
      placeholder: planning-simulation --gpu
    validations:
      required: false

  - type: dropdown
    attributes:
      label: ROS distribution
      options:
        - Humble
        - Jazzy
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Host architecture
      options:
        - amd64
        - arm64
    validations:
      required: true

  - type: textarea
    attributes:
      label: Versions
      description: >-
        Paste the output of `openadkit version --json` (run it in the kit if
        you use one), `docker version --format '{{.Server.Version}}'` and
        `docker compose version`, and name your OS.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs
      description: >-
        The relevant part of `openadkit logs`. Remove credentials and personal
        or sensitive data first.
      render: text
    validations:
      required: false

  - type: textarea
    attributes:
      label: Possible causes
      description: Write the possible causes if you have any ideas.
    validations:
      required: false
