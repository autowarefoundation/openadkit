name: build-docs
description: Build the MkDocs site (install deps, generate release notes, build)

inputs:
  github-token:
    description: GitHub token used by the release-notes generator
    required: true
  allow-stale-release-notes:
    description: Keep the existing release page when a transient GitHub API fetch fails
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: docs/requirements.txt

    - name: Install dependencies
      run: pip install -r docs/requirements.txt
      shell: bash

    - name: Generate release notes
      run: |
        args=()
        if [ "${ALLOW_STALE_RELEASE_NOTES}" = "true" ]; then
          args+=(--allow-stale-on-fetch-error)
        fi
        python docs/scripts/generate_release_notes.py "${args[@]}"
      shell: bash
      env:
        ALLOW_STALE_RELEASE_NOTES: ${{ inputs.allow-stale-release-notes }}
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Pin installer source ref
      run: printf 'OPENADKIT_INSTALL_REF=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      shell: bash

    - name: Build with MkDocs
      run: mkdocs build --clean --verbose
      shell: bash
      env:
        NO_MKDOCS_2_WARNING: 1
