name: build-docs
description: Build the MkDocs site (install deps, generate release notes, build)

inputs:
  github-token:
    description: GitHub token used by the release-notes generator
    required: true

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: docs/requirements.txt

    - name: Install dependencies
      run: pip install -r docs/requirements.txt
      shell: bash

    - name: Generate release notes
      # Tolerate failure here (offline or GitHub rate-limit); the doc page
      # falls back to a placeholder section and the rest of the build still
      # ships. Mirrors the `|| echo "WARNING..."` tolerance in the Makefile.
      # The run value is quoted because `||` at the start of a YAML scalar
      # would otherwise be parsed as a block-scalar indicator.
      run: "python docs/scripts/generate_release_notes.py || echo \"WARNING: could not refresh release notes (offline or rate-limited); continuing without them\""
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Build with MkDocs
      run: mkdocs build --clean --verbose
      shell: bash
      env:
        NO_MKDOCS_2_WARNING: 1
