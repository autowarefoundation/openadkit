# The CI fixture's services on top of what `openadkit new custom-kit` made:
# Planning Simulation and the kit's own services (extension point 4).
include:
  - ${OPENADKIT_BASE_DEPLOYMENT}/docker-compose.yaml

services:
  heartbeat:
    # A kit artifact (extension point 5), pinned in this kit's openadkit.json.
    image: ${HEARTBEAT_IMAGE:?pinned in openadkit.json artifacts}
    network_mode: none
    command: ["sleep", "infinity"]
    restart: unless-stopped

  acme-probe:
    # The kit's own C++ node from overlay_ws (extension point 3), built by
    # openadkit build. It runs in an Open AD Kit runtime image, whose
    # entrypoint hook sources the overlay workspace mounted below.
    image: ${PLANNING_CONTROL_IMAGE:?set by the openadkit CLI}
    network_mode: host
    ipc: host
    env_file:
      - ${OPENADKIT_BASE_ROOT}/deployments/shared/runtime.env
    volumes:
      - ${OPENADKIT_BASE_ROOT}/deployments/shared/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      - ${OPENADKIT_OVERLAY_WS:?set by the openadkit CLI}:/openadkit/overlay_ws:ro
      - ./checks:/openadkit/checks:ro
    command: ros2 run acme_probe probe
    # This kit's readiness, which `openadkit run` waits for (checks/custom_kit.py).
    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/${ROS_DISTRO}/setup.sh && . /opt/autoware/setup.sh && exec python3 /openadkit/checks/custom_kit.py"]
      start_period: 10m
      start_interval: 5s
      interval: 1m
      timeout: 90s
      retries: 3
    restart: on-failure
