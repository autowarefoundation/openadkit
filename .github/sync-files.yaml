- repository: autowarefoundation/sync-file-templates
  source-dir: sources
  files:
    - source: .github/ISSUE_TEMPLATE/bug.yaml
    # config.yml points at Open AD Kit discussions (not Autoware's). Do not sync
    # it from the generic template.
    - source: .github/ISSUE_TEMPLATE/task.yaml
    - source: .github/dependabot.yaml
    # pull_request_template.md carries Open AD Kit–specific Type-of-change and
    # documentation checklist sections. Do not sync it from the generic template.
    - source: .github/stale.yml
    - source: .github/workflows/comment-on-pr.yaml
    - source: .github/workflows/github-release.yaml
    - source: .github/workflows/pre-commit-optional.yaml
    - source: .github/workflows/pre-commit-optional-autoupdate.yaml
    - source: .github/workflows/pre-commit-autoupdate.yaml
    - source: .github/workflows/spell-check-differential.yaml
    - source: .github/workflows/spell-check-daily.yaml
    - source: .github/workflows/sync-files.yaml
    - source: .clang-format
    - source: .clang-tidy
    - source: .markdown-link-check.json
    - source: .markdownlint.yaml
    - source: .pre-commit-config-optional.yaml
    - source: .pre-commit-config.yaml
    - source: .prettierignore
    - source: .prettierrc.yaml
    # .yamllint.yaml is Open AD Kit–specific (long workflow expressions, GitHub's
    # `on:` key). Do not sync it from the generic Autoware template.
    - source: CODE_OF_CONDUCT.md
    # CONTRIBUTING.md is Open AD Kit–specific (deployments, bake, compose).
    # Do not sync it from the generic Autoware template.
    - source: CPPLINT.cfg
    - source: DISCLAIMER.md
    - source: LICENSE
    - source: setup.cfg
