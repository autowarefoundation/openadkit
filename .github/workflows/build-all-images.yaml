name: build-all-images

on:
  push:
    paths:
      - '.github/actions/combine-multi-arch-images/**'
      - '.github/actions/free-disk-space/**'
      - '.github/workflows/build-all-images.yaml'
      - 'components/docker-bake.hcl'
      - 'components/common/**'
      - 'components/sensing-perception/**'
      - 'components/localization-mapping/**'
      - 'components/planning-control/**'
      - 'components/vehicle-system/**'
      - 'components/api/**'
      - 'components/visualizer/**'
      - 'components/simulator/**'
      - 'components/universe/**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      autoware_ref:
        description: 'Autoware ref to build from (branch, tag, or SHA). Defaults to main.'
        required: false
        default: main
      run_scan:
        description: 'Run a full image scan after this build completes.'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-all-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX_COMMON: ghcr.io/${{ github.repository_owner }}/openadkit-common
  IMAGE_PREFIX_COMPONENT: ghcr.io/${{ github.repository_owner }}/openadkit
  BAKE_FILE: components/docker-bake.hcl

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      autoware_input_ref: ${{ steps.prepare.outputs.autoware_input_ref }}
      autoware_ref_type: ${{ steps.prepare.outputs.autoware_ref_type }}
      autoware_ref: ${{ steps.prepare.outputs.autoware_ref }}
      autoware_base_version: ${{ steps.prepare.outputs.autoware_base_version }}
      build_tag: ${{ steps.prepare.outputs.build_tag }}
      scan_requested: ${{ steps.prepare.outputs.scan_requested }}
    steps:
      - name: Resolve shared build inputs
        id: prepare
        env:
          AUTOWARE_REF_INPUT: ${{ inputs.autoware_ref || 'main' }}
          RUN_SCAN_INPUT: ${{ inputs.run_scan || false }}
        run: |
          set -euo pipefail

          autoware_input_ref="${AUTOWARE_REF_INPUT:-main}"
          build_tag="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          scan_requested=false
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            scan_requested=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${RUN_SCAN_INPUT}" = "true" ]; then
            scan_requested=true
          fi

          git init autoware-metadata
          git -C autoware-metadata remote add origin https://github.com/autowarefoundation/autoware

          fetch_ref="${autoware_input_ref}"
          autoware_ref_type="ref"
          if git -C autoware-metadata ls-remote --exit-code origin "refs/heads/${autoware_input_ref}" >/dev/null 2>&1; then
            fetch_ref="refs/heads/${autoware_input_ref}"
            autoware_ref_type="branch"
          elif git -C autoware-metadata ls-remote --exit-code origin "refs/tags/${autoware_input_ref}" >/dev/null 2>&1; then
            fetch_ref="refs/tags/${autoware_input_ref}"
            autoware_ref_type="tag"
          elif printf '%s\n' "${autoware_input_ref}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            autoware_ref_type="sha"
          fi

          git -C autoware-metadata fetch --filter=blob:none --tags --force origin "${fetch_ref}"
          git -C autoware-metadata checkout --detach FETCH_HEAD

          autoware_ref=$(git -C autoware-metadata rev-parse HEAD)
          autoware_base_version=$(
            git -C autoware-metadata describe --tags --match '[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || true
          )
          [ -n "${autoware_base_version}" ] || (echo "Could not infer Autoware base version from ${autoware_input_ref}" && exit 1)

          {
            echo "autoware_input_ref=${autoware_input_ref}"
            echo "autoware_ref_type=${autoware_ref_type}"
            echo "autoware_ref=${autoware_ref}"
            echo "autoware_base_version=${autoware_base_version}"
            echo "build_tag=${build_tag}"
            echo "scan_requested=${scan_requested}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

  # =============================================================================
  # Stage 1: Build common images
  # =============================================================================
  build-common:
    needs: prepare
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        platform: [linux/amd64, linux/arm64]
        ros-distro: [humble, jazzy]
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pipx
          pipx install vcs2l
        shell: bash

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.prepare.outputs.autoware_ref }}
          path: autoware
          fetch-depth: 1

      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware/repositories/autoware.repos
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for openadkit-common:base
        id: meta-common-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMMON }}
          bake-target: docker-metadata-action-common-base
          tags: |
            type=raw,value=base-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=base-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Extract metadata for openadkit-common:base-cuda
        id: meta-common-base-cuda
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMMON }}
          bake-target: docker-metadata-action-common-base-cuda
          tags: |
            type=raw,value=base-cuda-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=base-cuda-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Extract metadata for openadkit-common:devel
        id: meta-common-devel
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMMON }}
          bake-target: docker-metadata-action-common-devel
          tags: |
            type=raw,value=devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Extract metadata for openadkit-common:devel-cuda
        id: meta-common-devel-cuda
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMMON }}
          bake-target: docker-metadata-action-common-devel-cuda
          tags: |
            type=raw,value=devel-cuda-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=devel-cuda-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Build and push common images (non-CUDA)
        uses: docker/bake-action@v5
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta-common-base.outputs.bake-file }}
            ${{ steps.meta-common-devel.outputs.bake-file }}
          targets: |
            common-base
            common-devel
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.args.ROS_DISTRO=${{ matrix.ros-distro }}
            *.args.BASE_IMAGE=ros:${{ matrix.ros-distro }}-ros-base-${{ matrix.ros-distro == 'jazzy' && 'noble' || 'jammy' }}
            *.labels."org.opencontainers.image.build-tag"=${{ needs.prepare.outputs.build_tag }}
            *.labels."org.opencontainers.image.run-id"=${{ github.run_id }}
            *.labels."org.opencontainers.image.openadkit-sha"=${{ github.sha }}
            *.labels."org.opencontainers.image.autoware-input-ref"=${{ needs.prepare.outputs.autoware_input_ref }}
            *.labels."org.opencontainers.image.autoware-ref-type"=${{ needs.prepare.outputs.autoware_ref_type }}
            *.labels."org.opencontainers.image.autoware-ref"=${{ needs.prepare.outputs.autoware_ref }}
            *.labels."org.opencontainers.image.autoware-base-version"=${{ needs.prepare.outputs.autoware_base_version }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main,mode=max

      - name: Build and push common images (CUDA, amd64 only)
        if: matrix.platform == 'linux/amd64'
        uses: docker/bake-action@v5
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta-common-base-cuda.outputs.bake-file }}
            ${{ steps.meta-common-devel-cuda.outputs.bake-file }}
          targets: |
            common-base-cuda
            common-devel-cuda
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.args.ROS_DISTRO=${{ matrix.ros-distro }}
            *.args.BASE_IMAGE=ros:${{ matrix.ros-distro }}-ros-base-${{ matrix.ros-distro == 'jazzy' && 'noble' || 'jammy' }}
            *.labels."org.opencontainers.image.build-tag"=${{ needs.prepare.outputs.build_tag }}
            *.labels."org.opencontainers.image.run-id"=${{ github.run_id }}
            *.labels."org.opencontainers.image.openadkit-sha"=${{ github.sha }}
            *.labels."org.opencontainers.image.autoware-input-ref"=${{ needs.prepare.outputs.autoware_input_ref }}
            *.labels."org.opencontainers.image.autoware-ref-type"=${{ needs.prepare.outputs.autoware_ref_type }}
            *.labels."org.opencontainers.image.autoware-ref"=${{ needs.prepare.outputs.autoware_ref }}
            *.labels."org.opencontainers.image.autoware-base-version"=${{ needs.prepare.outputs.autoware_base_version }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:common-cuda-${{ matrix.ros-distro }}-main
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:common-cuda-${{ matrix.ros-distro }}-main,mode=max

  # =============================================================================
  # Stage 2: Build component images (parallel)
  # =============================================================================
  build-components:
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    needs: [prepare, build-common]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        platform: [linux/amd64, linux/arm64]
        ros-distro: [humble, jazzy]
        target:
          - sensing-perception
          - localization-mapping
          - planning-control
          - vehicle-system
          - api
          - visualizer
          - simulator
        include:
          # CUDA variant only on amd64
          - platform: linux/amd64
            ros-distro: humble
            target: sensing-perception-cuda
          - platform: linux/amd64
            ros-distro: jazzy
            target: sensing-perception-cuda
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pipx
          pipx install vcs2l
        shell: bash

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.prepare.outputs.autoware_ref }}
          path: autoware
          fetch-depth: 1

      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware/repositories/autoware.repos
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.target }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-${{ matrix.target }}
          tags: |
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v5
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.args.ROS_DISTRO=${{ matrix.ros-distro }}
            *.args.COMMON_BASE_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:base-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.COMMON_BASE_CUDA_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:base-cuda-amd64-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.COMMON_DEVEL_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.COMMON_DEVEL_CUDA_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:devel-cuda-amd64-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.labels."org.opencontainers.image.build-tag"=${{ needs.prepare.outputs.build_tag }}
            *.labels."org.opencontainers.image.run-id"=${{ github.run_id }}
            *.labels."org.opencontainers.image.openadkit-sha"=${{ github.sha }}
            *.labels."org.opencontainers.image.autoware-input-ref"=${{ needs.prepare.outputs.autoware_input_ref }}
            *.labels."org.opencontainers.image.autoware-ref-type"=${{ needs.prepare.outputs.autoware_ref_type }}
            *.labels."org.opencontainers.image.autoware-ref"=${{ needs.prepare.outputs.autoware_ref }}
            *.labels."org.opencontainers.image.autoware-base-version"=${{ needs.prepare.outputs.autoware_base_version }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main,mode=max

  # =============================================================================
  # Stage 3: Build universe and universe-cuda images (parallel)
  # =============================================================================
  build-universe:
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    needs: [prepare, build-common, build-components]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        platform: [linux/amd64, linux/arm64]
        ros-distro: [humble, jazzy]
        target: [universe]
        include:
          # CUDA variant only on amd64
          - platform: linux/amd64
            ros-distro: humble
            target: universe-cuda
          - platform: linux/amd64
            ros-distro: jazzy
            target: universe-cuda
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pipx
          pipx install vcs2l
        shell: bash

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.prepare.outputs.autoware_ref }}
          path: autoware
          fetch-depth: 1

      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware/repositories/autoware.repos
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.target }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-${{ matrix.target }}
          tags: |
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v5
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.args.ROS_DISTRO=${{ matrix.ros-distro }}
            *.args.COMMON_BASE_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:base-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.COMMON_BASE_CUDA_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:base-cuda-amd64-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.COMMON_DEVEL_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.COMMON_DEVEL_CUDA_IMAGE=${{ env.IMAGE_PREFIX_COMMON }}:devel-cuda-amd64-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.SENSING_PERCEPTION_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:sensing-perception-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.SENSING_PERCEPTION_CUDA_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:sensing-perception-cuda-amd64-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.LOCALIZATION_MAPPING_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:localization-mapping-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.PLANNING_CONTROL_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:planning-control-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.VEHICLE_SYSTEM_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:vehicle-system-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.API_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:api-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.VISUALIZER_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:visualizer-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.SIMULATOR_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:simulator-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.labels."org.opencontainers.image.build-tag"=${{ needs.prepare.outputs.build_tag }}
            *.labels."org.opencontainers.image.run-id"=${{ github.run_id }}
            *.labels."org.opencontainers.image.openadkit-sha"=${{ github.sha }}
            *.labels."org.opencontainers.image.autoware-input-ref"=${{ needs.prepare.outputs.autoware_input_ref }}
            *.labels."org.opencontainers.image.autoware-ref-type"=${{ needs.prepare.outputs.autoware_ref_type }}
            *.labels."org.opencontainers.image.autoware-ref"=${{ needs.prepare.outputs.autoware_ref }}
            *.labels."org.opencontainers.image.autoware-base-version"=${{ needs.prepare.outputs.autoware_base_version }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main,mode=max

  # =============================================================================
  # Stage 4: Create multi-arch manifests
  # =============================================================================
  create-manifests:
    runs-on: ubuntu-22.04
    needs: [prepare, build-common, build-components, build-universe]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        ros-distro: [humble, jazzy]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Combine multi-arch images
        uses: ./.github/actions/combine-multi-arch-images
        with:
          ros-distro: ${{ matrix.ros-distro }}
          build-tag: ${{ needs.prepare.outputs.build_tag }}
          registry: ${{ env.REGISTRY }}
          image-prefix-common: ${{ env.IMAGE_PREFIX_COMMON }}
          image-prefix-component: ${{ env.IMAGE_PREFIX_COMPONENT }}
          component-targets: >-
            sensing-perception
            sensing-perception-cuda
            localization-mapping
            planning-control
            vehicle-system
            api
            visualizer
            simulator
            universe
            universe-cuda
          token: ${{ secrets.GITHUB_TOKEN }}

  capture-metadata:
    runs-on: ubuntu-22.04
    needs: [prepare, create-manifests]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build metadata
        env:
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          OPENADKIT_SHA: ${{ github.sha }}
          AUTOWARE_INPUT_REF: ${{ needs.prepare.outputs.autoware_input_ref }}
          AUTOWARE_REF_TYPE: ${{ needs.prepare.outputs.autoware_ref_type }}
          AUTOWARE_REF: ${{ needs.prepare.outputs.autoware_ref }}
          AUTOWARE_BASE_VERSION: ${{ needs.prepare.outputs.autoware_base_version }}
          SCAN_REQUESTED: ${{ needs.prepare.outputs.scan_requested }}
          COMMON: ${{ env.IMAGE_PREFIX_COMMON }}
          COMPONENT: ${{ env.IMAGE_PREFIX_COMPONENT }}
        run: |
          set -euo pipefail

          mkdir -p build-metadata
          images_file="build-metadata/images.json"
          jq -n '[]' > "${images_file}"

          add_image() {
            local repo="$1"
            local target="$2"
            local distro="$3"
            local ref="${repo}:${target}-${distro}-${BUILD_TAG}"
            local inspect_json digest platforms

            inspect_json=$(docker buildx imagetools inspect "${ref}" --format '{{json .}}')
            digest=$(printf '%s' "${inspect_json}" | jq -r '.manifest.digest')
            platforms=$(
              printf '%s' "${inspect_json}" \
                | jq -c '[.manifest.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | unique'
            )

            tmp=$(mktemp)
            jq \
              --arg repo "${repo}" \
              --arg target "${target}" \
              --arg distro "${distro}" \
              --arg ref "${ref}" \
              --arg digest "${digest}" \
              --argjson platforms "${platforms}" \
              '. + [{repo: $repo, target: $target, ros_distro: $distro, ref: $ref, digest: $digest, platforms: $platforms}]' \
              "${images_file}" > "${tmp}"
            mv "${tmp}" "${images_file}"
          }

          for distro in humble jazzy; do
            for target in base base-cuda devel devel-cuda; do
              add_image "${COMMON}" "${target}" "${distro}"
            done
            for target in sensing-perception sensing-perception-cuda localization-mapping planning-control vehicle-system api visualizer simulator universe universe-cuda; do
              add_image "${COMPONENT}" "${target}" "${distro}"
            done
          done

          jq -n \
            --arg build_tag "${BUILD_TAG}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg openadkit_sha "${OPENADKIT_SHA}" \
            --arg autoware_input_ref "${AUTOWARE_INPUT_REF}" \
            --arg autoware_ref_type "${AUTOWARE_REF_TYPE}" \
            --arg autoware_ref "${AUTOWARE_REF}" \
            --arg autoware_base_version "${AUTOWARE_BASE_VERSION}" \
            --argjson scan_requested "${SCAN_REQUESTED}" \
            --slurpfile images "${images_file}" \
            '{
              build_tag: $build_tag,
              run_id: $run_id,
              run_attempt: $run_attempt,
              openadkit_sha: $openadkit_sha,
              autoware_input_ref: $autoware_input_ref,
              autoware_ref_type: $autoware_ref_type,
              autoware_ref: $autoware_ref,
              autoware_base_version: $autoware_base_version,
              scan_requested: $scan_requested,
              images: $images[0]
            }' > build-metadata/build-metadata.json
        shell: bash

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata-${{ needs.prepare.outputs.build_tag }}
          path: build-metadata/build-metadata.json
          retention-days: 90

  summarize:
    runs-on: ubuntu-latest
    needs: [prepare, capture-metadata]
    if: success()
    steps:
      - name: Write job summary
        run: |
          {
            echo "## Build Complete"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| **build_tag** | \`${{ needs.prepare.outputs.build_tag }}\` |"
            echo "| **autoware_input_ref** | \`${{ needs.prepare.outputs.autoware_input_ref }}\` |"
            echo "| **autoware_ref_type** | \`${{ needs.prepare.outputs.autoware_ref_type }}\` |"
            echo "| **autoware_ref** | \`${{ needs.prepare.outputs.autoware_ref }}\` |"
            echo "| **autoware_base_version** | \`${{ needs.prepare.outputs.autoware_base_version }}\` |"
            echo "| **scan_requested** | \`${{ needs.prepare.outputs.scan_requested }}\` |"
            echo ""
            echo "To release this build:"
            echo "1. Go to **Actions → release → Run workflow**"
            echo "2. Set \`build_tag\` to \`${{ needs.prepare.outputs.build_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    runs-on: ubuntu-latest
    needs: [prepare, build-common, build-components, build-universe, create-manifests, capture-metadata]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled build failed (${new Date().toISOString().split('T')[0]})`,
              body: [
                '**Scheduled build-all-images workflow failed.**',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            })
