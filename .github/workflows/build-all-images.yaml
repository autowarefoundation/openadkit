name: build-all-images

on:
  push:
    paths:
      - '.github/actions/combine-multi-arch-images/**'
      - '.github/actions/free-disk-space/**'
      - '.github/image-inventory.json'
      - '.github/scripts/**'
      - '.github/workflows/build-all-images.yaml'
      - 'components/**'

  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      autoware_ref:
        description: 'Autoware ref to build from (branch, tag, or SHA). Defaults to main.'
        required: false
        default: main
      run_scan:
        description: 'Run a full image scan after this build completes.'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-all-images-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX_COMMON: ghcr.io/${{ github.repository_owner }}/openadkit-common
  IMAGE_PREFIX_COMPONENT: ghcr.io/${{ github.repository_owner }}/openadkit
  BAKE_FILE: components/docker-bake.hcl

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      autoware_input_ref: ${{ steps.prepare.outputs.autoware_input_ref }}
      autoware_ref_type: ${{ steps.prepare.outputs.autoware_ref_type }}
      autoware_ref: ${{ steps.prepare.outputs.autoware_ref }}
      autoware_base_version: ${{ steps.prepare.outputs.autoware_base_version }}
      autoware_lock_sha256: ${{ steps.lock.outputs.autoware_lock_sha256 }}
      build_tag: ${{ steps.prepare.outputs.build_tag }}
      scan_requested: ${{ steps.prepare.outputs.scan_requested }}
      common_matrix: ${{ steps.inventory.outputs.common_matrix }}
      component_matrix: ${{ steps.inventory.outputs.component_matrix }}
      manifest_matrix: ${{ steps.inventory.outputs.manifest_matrix }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Resolve shared build inputs
        id: prepare
        env:
          AUTOWARE_REF_INPUT: ${{ inputs.autoware_ref || 'main' }}
          RUN_SCAN_INPUT: ${{ inputs.run_scan || false }}
        run: |
          set -euo pipefail

          autoware_input_ref="${AUTOWARE_REF_INPUT:-main}"
          build_tag="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          scan_requested=false
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            scan_requested=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${RUN_SCAN_INPUT}" = "true" ]; then
            scan_requested=true
          fi

          git init autoware-metadata
          git -C autoware-metadata remote add origin https://github.com/autowarefoundation/autoware

          fetch_ref="${autoware_input_ref}"
          autoware_ref_type="ref"
          if git -C autoware-metadata ls-remote --exit-code origin "refs/heads/${autoware_input_ref}" >/dev/null 2>&1; then
            fetch_ref="refs/heads/${autoware_input_ref}"
            autoware_ref_type="branch"
          elif git -C autoware-metadata ls-remote --exit-code origin "refs/tags/${autoware_input_ref}" >/dev/null 2>&1; then
            fetch_ref="refs/tags/${autoware_input_ref}"
            autoware_ref_type="tag"
          elif printf '%s\n' "${autoware_input_ref}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            autoware_ref_type="sha"
          fi

          git -C autoware-metadata fetch --filter=blob:none --tags --force origin "${fetch_ref}"
          git -C autoware-metadata checkout --detach FETCH_HEAD

          autoware_ref=$(git -C autoware-metadata rev-parse HEAD)
          autoware_base_version=$(
            git -C autoware-metadata describe --tags --match '[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || true
          )
          [ -n "${autoware_base_version}" ] || (echo "Could not infer Autoware base version from ${autoware_input_ref}" && exit 1)

          {
            echo "autoware_input_ref=${autoware_input_ref}"
            echo "autoware_ref_type=${autoware_ref_type}"
            echo "autoware_ref=${autoware_ref}"
            echo "autoware_base_version=${autoware_base_version}"
            echo "build_tag=${build_tag}"
            echo "scan_requested=${scan_requested}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Resolve image inventory
        id: inventory
        run: |
          set -euo pipefail
          mkdir -p image-inventory
          cp .github/image-inventory.json image-inventory/image-inventory.json
          python3 .github/scripts/resolve_image_matrices.py >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload image inventory
        uses: actions/upload-artifact@v4
        with:
          name: image-inventory-${{ steps.prepare.outputs.build_tag }}
          path: image-inventory/image-inventory.json
          retention-days: 90

      - name: Install YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
        shell: bash

      - name: Export exact Autoware dependency lockfile
        id: lock
        run: |
          set -euo pipefail
          mkdir -p autoware-lock
          python3 <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import sys

          import yaml

          source = pathlib.Path("autoware-metadata/repositories/autoware.repos")
          target = pathlib.Path("autoware-lock/autoware-lock.repos")
          data = yaml.safe_load(source.read_text())
          repos = data.get("repositories", {})
          sha_re = re.compile(r"^[0-9a-fA-F]{40}$")

          def ls_remote(url, ref):
              result = subprocess.run(
                  ["git", "ls-remote", "--exit-code", url, ref],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              if result.returncode != 0 or not result.stdout.strip():
                  return None
              return result.stdout.split()[0]

          def resolve(url, version):
              if sha_re.fullmatch(version):
                  return version.lower()
              for ref in (
                  f"refs/tags/{version}^{{}}",
                  f"refs/tags/{version}",
                  f"refs/heads/{version}",
                  version,
              ):
                  sha = ls_remote(url, ref)
                  if sha and sha_re.fullmatch(sha):
                      return sha.lower()
              raise RuntimeError(f"Could not resolve {url}@{version} to a commit SHA")

          with target.open("w") as out:
              out.write("repositories:\n")
              for path, repo in repos.items():
                  repo_type = repo.get("type")
                  url = repo.get("url")
                  version = str(repo.get("version", ""))
                  if repo_type != "git" or not url or not version:
                      raise RuntimeError(f"Unsupported repository entry: {path}")
                  resolved = resolve(url, version)
                  print(f"{path}: {version} -> {resolved}", file=sys.stderr)
                  out.write(f"  {json.dumps(path)}:\n")
                  out.write(f"    type: {json.dumps(repo_type)}\n")
                  out.write(f"    url: {json.dumps(url)}\n")
                  out.write(f"    version: {json.dumps(resolved)}\n")
          PY
          autoware_lock_sha256=$(sha256sum autoware-lock/autoware-lock.repos | cut -d ' ' -f1)
          echo "autoware_lock_sha256=${autoware_lock_sha256}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload Autoware dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: autoware-lock-${{ steps.prepare.outputs.build_tag }}
          path: autoware-lock/autoware-lock.repos
          retention-days: 90

  # =============================================================================
  # Stage 1: Build universe-common images (on upstream Autoware core bases)
  # =============================================================================
  build-common:
    needs: prepare
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
      packages: write
    env:
      CACHE_KEY_PREFIX: buildkit-mounts-universe-common-${{ matrix.ros-distro }}-${{ matrix.platform-label }}-
      IS_MAIN_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.common_matrix) }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pipx
          pipx install vcs2l
        shell: bash

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.prepare.outputs.autoware_ref }}
          path: autoware
          fetch-depth: 1

      - name: Download Autoware dependency lockfile
        uses: actions/download-artifact@v4
        with:
          name: autoware-lock-${{ needs.prepare.outputs.build_tag }}
          path: autoware-lock

      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware-lock/autoware-lock.repos
            # Some Autoware refs do not provide middleware sources, but
            # components/universe-common/Dockerfile bind-mounts this path.
            mkdir -p autoware/src/middleware/external
            touch autoware/src/middleware/external/.keep
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for openadkit-common:universe-common-devel
        id: meta-universe-common-devel
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMMON }}
          bake-target: docker-metadata-action-universe-common-devel
          tags: |
            type=raw,value=universe-common-devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=universe-common-devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Extract metadata for openadkit-common:universe-common
        id: meta-universe-common
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMMON }}
          bake-target: docker-metadata-action-universe-common
          tags: |
            type=raw,value=universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Ensure upstream Autoware base images exist
        env:
          ROS_DISTRO: ${{ matrix.ros-distro }}
          UPSTREAM_TAG: ${{ vars.UPSTREAM_TAG }}
        run: |
          set -euo pipefail
          # universe-common surfaces core/core-devel; sensing-perception-cuda
          # surfaces base-cuda-{devel,runtime}. Together they cover every
          # upstream base this build depends on, so a missing CUDA base fails
          # here instead of late in build-components.
          refs=$(docker buildx bake -f "${BAKE_FILE}" --print universe-common sensing-perception-cuda 2>/dev/null \
            | jq -r '[.target[].contexts // {} | to_entries[].value]
                     | map(select(startswith("docker-image://ghcr.io/autowarefoundation/autoware:")))
                     | unique[]' | sed 's#^docker-image://##')
          if [ -z "${refs}" ]; then echo "No upstream refs to verify."; exit 0; fi
          fail=0
          while IFS= read -r ref; do
            [ -z "${ref}" ] && continue
            if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then
              echo "OK: ${ref}"
            else
              echo "::error::Missing upstream image: ${ref}"; fail=1
            fi
          done <<< "${refs}"
          [ "${fail}" -eq 0 ]
        shell: bash

      - name: Restore BuildKit cache mounts
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: cache-mounts
          key: ${{ env.CACHE_KEY_PREFIX }}${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}

      - name: Arm post-step save of BuildKit cache mounts (main only)
        if: env.IS_MAIN_PUSH == 'true'
        uses: actions/cache@v5
        with:
          path: cache-mounts
          key: ${{ env.CACHE_KEY_PREFIX }}${{ github.sha }}
          lookup-only: true

      - name: Inject BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@7a38cfab60c63ee1022b7c1a14a031c82f4114c7 # v3
        with:
          # Only ccache is persisted across runs: it is the entire ~4.5x
          # recompile win and stays small (~0.14 GB/leg). apt/pip mounts were
          # dropped to keep the repo-wide 10 GB cache budget clear of LRU
          # eviction (their bandwidth-bound saving is largely covered by the
          # registry layer cache anyway).
          cache-map: |
            {
              "cache-mounts/ccache": {
                "id": "ccache-${{ matrix.ros-distro }}",
                "target": "/home/aw/.ccache",
                "uid": "1000",
                "gid": "1000"
              }
            }
          skip-extraction: ${{ steps.cache-restore.outputs.cache-hit }}

      - name: Build and push universe-common images
        uses: docker/bake-action@v5
        env:
          ROS_DISTRO: ${{ matrix.ros-distro }}
          UPSTREAM_TAG: ${{ vars.UPSTREAM_TAG }}
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta-universe-common-devel.outputs.bake-file }}
            ${{ steps.meta-universe-common.outputs.bake-file }}
          targets: |
            universe-common-devel
            universe-common
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.labels."org.opencontainers.image.build-tag"=${{ needs.prepare.outputs.build_tag }}
            *.labels."org.opencontainers.image.run-id"=${{ github.run_id }}
            *.labels."org.opencontainers.image.openadkit-sha"=${{ github.sha }}
            *.labels."org.opencontainers.image.autoware-input-ref"=${{ needs.prepare.outputs.autoware_input_ref }}
            *.labels."org.opencontainers.image.autoware-ref-type"=${{ needs.prepare.outputs.autoware_ref_type }}
            *.labels."org.opencontainers.image.autoware-ref"=${{ needs.prepare.outputs.autoware_ref }}
            *.labels."org.opencontainers.image.autoware-base-version"=${{ needs.prepare.outputs.autoware_base_version }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main,mode=max

      - name: Prune BuildKit cache mount lineage (main only)
        if: env.IS_MAIN_PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_KEY: ${{ env.CACHE_KEY_PREFIX }}${{ github.sha }}
          MAX_GB: 6
        run: |
          set -euo pipefail
          # KEEP_KEY is written by the actions/cache POST step, which runs after
          # this step, so it is never present here: this prune only removes
          # prior-lineage caches. The size check refreshes an oversized cache on
          # a same-SHA rerun (when KEEP_KEY already exists). --limit caps recovery
          # if a lineage ever exceeds it; steady state keeps a single entry.
          max_bytes=$((MAX_GB * 1000 * 1000 * 1000))
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$CACHE_KEY_PREFIX" --limit 100 --json key,sizeInBytes \
            | jq -r --arg keep "$KEEP_KEY" --argjson max "$max_bytes" \
                '.[] | select(.key != $keep or .sizeInBytes > $max) | .key' \
            | while read -r key; do
                echo "delete: $key"
                gh cache delete "$key" --repo "$GITHUB_REPOSITORY" || true
              done
        shell: bash

  # =============================================================================
  # Stage 2: Build component images (parallel)
  # =============================================================================
  build-components:
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    timeout-minutes: 120
    needs: [prepare, build-common]
    permissions:
      actions: write
      contents: read
      packages: write
    env:
      CACHE_KEY_PREFIX: buildkit-mounts-${{ matrix.target }}-${{ matrix.ros-distro }}-${{ matrix.platform-label }}-
      IS_MAIN_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.component_matrix) }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pipx
          pipx install vcs2l
        shell: bash

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.prepare.outputs.autoware_ref }}
          path: autoware
          fetch-depth: 1

      - name: Download Autoware dependency lockfile
        uses: actions/download-artifact@v4
        with:
          name: autoware-lock-${{ needs.prepare.outputs.build_tag }}
          path: autoware-lock

      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware-lock/autoware-lock.repos
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.target }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-${{ matrix.target }}
          tags: |
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Restore BuildKit cache mounts
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: cache-mounts
          key: ${{ env.CACHE_KEY_PREFIX }}${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}

      - name: Arm post-step save of BuildKit cache mounts (main only)
        if: env.IS_MAIN_PUSH == 'true'
        uses: actions/cache@v5
        with:
          path: cache-mounts
          key: ${{ env.CACHE_KEY_PREFIX }}${{ github.sha }}
          lookup-only: true

      - name: Inject BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          # Only ccache is persisted across runs (see build-common above for
          # the rationale). A single uniform map also drops the previous CUDA
          # apt special-case.
          cache-map: |
            {
              "cache-mounts/ccache": {
                "id": "ccache-${{ matrix.ros-distro }}",
                "target": "/home/aw/.ccache",
                "uid": "1000",
                "gid": "1000"
              }
            }
          skip-extraction: ${{ steps.cache-restore.outputs.cache-hit }}

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v5
        env:
          ROS_DISTRO: ${{ matrix.ros-distro }}
          UPSTREAM_TAG: ${{ vars.UPSTREAM_TAG }}
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.args.ROS_DISTRO=${{ matrix.ros-distro }}
            *.contexts.universe-common-devel=docker-image://${{ env.IMAGE_PREFIX_COMMON }}:universe-common-devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.contexts.universe-common=docker-image://${{ env.IMAGE_PREFIX_COMMON }}:universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.args.SIMULATOR_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:simulator-amd64-${{ matrix.ros-distro }}
            *.labels."org.opencontainers.image.build-tag"=${{ needs.prepare.outputs.build_tag }}
            *.labels."org.opencontainers.image.run-id"=${{ github.run_id }}
            *.labels."org.opencontainers.image.openadkit-sha"=${{ github.sha }}
            *.labels."org.opencontainers.image.autoware-input-ref"=${{ needs.prepare.outputs.autoware_input_ref }}
            *.labels."org.opencontainers.image.autoware-ref-type"=${{ needs.prepare.outputs.autoware_ref_type }}
            *.labels."org.opencontainers.image.autoware-ref"=${{ needs.prepare.outputs.autoware_ref }}
            *.labels."org.opencontainers.image.autoware-base-version"=${{ needs.prepare.outputs.autoware_base_version }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main,mode=max

      - name: Prune BuildKit cache mount lineage (main only)
        if: env.IS_MAIN_PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_KEY: ${{ env.CACHE_KEY_PREFIX }}${{ github.sha }}
          MAX_GB: 6
        run: |
          set -euo pipefail
          # KEEP_KEY is written by the actions/cache POST step, which runs after
          # this step, so it is never present here: this prune only removes
          # prior-lineage caches. The size check refreshes an oversized cache on
          # a same-SHA rerun (when KEEP_KEY already exists). --limit caps recovery
          # if a lineage ever exceeds it; steady state keeps a single entry.
          max_bytes=$((MAX_GB * 1000 * 1000 * 1000))
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$CACHE_KEY_PREFIX" --limit 100 --json key,sizeInBytes \
            | jq -r --arg keep "$KEEP_KEY" --argjson max "$max_bytes" \
                '.[] | select(.key != $keep or .sizeInBytes > $max) | .key' \
            | while read -r key; do
                echo "delete: $key"
                gh cache delete "$key" --repo "$GITHUB_REPOSITORY" || true
              done
        shell: bash

  # =============================================================================
  # Stage 3: Create multi-arch manifests
  # =============================================================================
  create-manifests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [prepare, build-common, build-components]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.manifest_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest for ${{ matrix.target }} (${{ matrix.ros-distro }})
        uses: ./.github/actions/combine-multi-arch-images
        with:
          image: ${{ matrix.repo == 'common' && env.IMAGE_PREFIX_COMMON || env.IMAGE_PREFIX_COMPONENT }}
          target: ${{ matrix.target }}
          ros-distro: ${{ matrix.ros-distro }}
          arches: ${{ matrix.arches }}
          build-tag: ${{ needs.prepare.outputs.build_tag }}
          registry: ${{ env.REGISTRY }}
          token: ${{ secrets.GITHUB_TOKEN }}

  manifest-report:
    runs-on: ubuntu-22.04
    needs: [prepare, create-manifests]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write manifest report
        env:
          MANIFEST_MATRIX: ${{ needs.prepare.outputs.manifest_matrix }}
          IMAGE_PREFIX_COMMON: ${{ env.IMAGE_PREFIX_COMMON }}
          IMAGE_PREFIX_COMPONENT: ${{ env.IMAGE_PREFIX_COMPONENT }}
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
        run: bash .github/scripts/report_manifests.sh >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  capture-metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [prepare, create-manifests]
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Download Autoware dependency lockfile
        uses: actions/download-artifact@v4
        with:
          name: autoware-lock-${{ needs.prepare.outputs.build_tag }}
          path: build-metadata

      - name: Download image inventory
        uses: actions/download-artifact@v4
        with:
          name: image-inventory-${{ needs.prepare.outputs.build_tag }}
          path: build-metadata

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build metadata
        env:
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          OPENADKIT_SHA: ${{ github.sha }}
          AUTOWARE_INPUT_REF: ${{ needs.prepare.outputs.autoware_input_ref }}
          AUTOWARE_REF_TYPE: ${{ needs.prepare.outputs.autoware_ref_type }}
          AUTOWARE_REF: ${{ needs.prepare.outputs.autoware_ref }}
          AUTOWARE_BASE_VERSION: ${{ needs.prepare.outputs.autoware_base_version }}
          PREPARED_LOCK_SHA256: ${{ needs.prepare.outputs.autoware_lock_sha256 }}
          SCAN_REQUESTED: ${{ needs.prepare.outputs.scan_requested }}
          COMMON: ${{ env.IMAGE_PREFIX_COMMON }}
          COMPONENT: ${{ env.IMAGE_PREFIX_COMPONENT }}
        run: |
          set -euo pipefail

          mkdir -p build-metadata
          autoware_lock_sha256=$(sha256sum build-metadata/autoware-lock.repos | cut -d ' ' -f1)
          [ "${autoware_lock_sha256}" = "${PREPARED_LOCK_SHA256}" ] \
            || (echo "Autoware lock SHA ${autoware_lock_sha256} does not match prepare output ${PREPARED_LOCK_SHA256}" >&2 && exit 1)
          image_inventory_sha256=$(sha256sum build-metadata/image-inventory.json | cut -d ' ' -f1)
          images_file="build-metadata/images.json"
          jq -n '[]' > "${images_file}"

          add_image() {
            local repo="$1"
            local target="$2"
            local distro="$3"
            local ref="${repo}:${target}-${distro}-${BUILD_TAG}"
            local inspect_json digest platforms

            inspect_json=$(docker buildx imagetools inspect "${ref}" --format '{{json .}}')
            digest=$(printf '%s' "${inspect_json}" | jq -r '.manifest.digest')
            platforms=$(
              printf '%s' "${inspect_json}" \
                | jq -c '[.manifest.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | unique'
            )

            tmp=$(mktemp)
            jq \
              --arg repo "${repo}" \
              --arg target "${target}" \
              --arg distro "${distro}" \
              --arg ref "${ref}" \
              --arg digest "${digest}" \
              --argjson platforms "${platforms}" \
              '. + [{repo: $repo, target: $target, ros_distro: $distro, ref: $ref, digest: $digest, platforms: $platforms}]' \
              "${images_file}" > "${tmp}"
            mv "${tmp}" "${images_file}"
          }

          while IFS=$'\t' read -r repo_kind target distro; do
            if [ "${repo_kind}" = "common" ]; then
              repo="${COMMON}"
            elif [ "${repo_kind}" = "component" ]; then
              repo="${COMPONENT}"
            else
              echo "Unsupported image inventory repo kind: ${repo_kind}" >&2
              exit 1
            fi
            add_image "${repo}" "${target}" "${distro}"
          done < <(jq -r '
            .ros_distros as $global |
            .images[] |
            ((.ros_distros // $global)[]) as $distro |
            [.repo, .target, $distro] |
            @tsv
          ' build-metadata/image-inventory.json)

          jq -n \
            --arg build_tag "${BUILD_TAG}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg openadkit_sha "${OPENADKIT_SHA}" \
            --arg autoware_input_ref "${AUTOWARE_INPUT_REF}" \
            --arg autoware_ref_type "${AUTOWARE_REF_TYPE}" \
            --arg autoware_ref "${AUTOWARE_REF}" \
            --arg autoware_base_version "${AUTOWARE_BASE_VERSION}" \
            --arg autoware_lock_sha256 "${autoware_lock_sha256}" \
            --arg image_inventory_sha256 "${image_inventory_sha256}" \
            --argjson scan_requested "${SCAN_REQUESTED}" \
            --slurpfile images "${images_file}" \
            '{
              build_tag: $build_tag,
              run_id: $run_id,
              run_attempt: $run_attempt,
              openadkit_sha: $openadkit_sha,
              autoware_input_ref: $autoware_input_ref,
              autoware_ref_type: $autoware_ref_type,
              autoware_ref: $autoware_ref,
              autoware_base_version: $autoware_base_version,
              autoware_lock_sha256: $autoware_lock_sha256,
              image_inventory_sha256: $image_inventory_sha256,
              scan_requested: $scan_requested,
              images: $images[0]
            }' > build-metadata/build-metadata.json
        shell: bash

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata-${{ needs.prepare.outputs.build_tag }}
          path: |
            build-metadata/build-metadata.json
            build-metadata/autoware-lock.repos
            build-metadata/image-inventory.json
          retention-days: 90

  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, capture-metadata]
    if: success()
    steps:
      - name: Write job summary
        env:
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          AUTOWARE_INPUT_REF: ${{ needs.prepare.outputs.autoware_input_ref }}
          AUTOWARE_REF_TYPE: ${{ needs.prepare.outputs.autoware_ref_type }}
          AUTOWARE_REF: ${{ needs.prepare.outputs.autoware_ref }}
          AUTOWARE_BASE_VERSION: ${{ needs.prepare.outputs.autoware_base_version }}
          SCAN_REQUESTED: ${{ needs.prepare.outputs.scan_requested }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          {
            echo "## Build Complete"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| **build_tag** | \`${BUILD_TAG}\` |"
            echo "| **autoware_input_ref** | \`${AUTOWARE_INPUT_REF}\` |"
            echo "| **autoware_ref_type** | \`${AUTOWARE_REF_TYPE}\` |"
            echo "| **autoware_ref** | \`${AUTOWARE_REF}\` |"
            echo "| **autoware_base_version** | \`${AUTOWARE_BASE_VERSION}\` |"
            echo "| **scan_requested** | \`${SCAN_REQUESTED}\` |"
            echo ""
            echo "## Release Eligibility"
            autoware_stable_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
            if [ "${SOURCE_REF}" != "refs/heads/main" ]; then
              echo "This build is not release-eligible. Releases must promote builds from the main branch."
            elif [ "${AUTOWARE_REF_TYPE}" = "tag" ] && printf '%s\n' "${AUTOWARE_INPUT_REF}" | grep -Eq "${autoware_stable_re}"; then
              echo "This build can be promoted to a stable or pre-release OpenADKit version after a passed full scan."
              echo ""
              echo "To release this build, run **Actions -> release -> Run workflow** and set \`build_tag\` to \`${BUILD_TAG}\`."
            elif [ "${AUTOWARE_REF_TYPE}" = "sha" ]; then
              echo "This build can only be promoted to a pre-release OpenADKit version after a passed full scan."
              echo ""
              echo "To pre-release this build, run **Actions -> release -> Run workflow** and set \`build_tag\` to \`${BUILD_TAG}\`."
            else
              echo "This build is not release-eligible. Stable releases require an Autoware SemVer tag, and pre-releases require an Autoware SemVer tag or full SHA."
            fi

            if [ "${SCAN_REQUESTED}" != "true" ]; then
              echo ""
              echo "If this build is otherwise release-eligible, run **Actions -> scan-images -> Run workflow** with \`build_tag\` set to \`${BUILD_TAG}\` before releasing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, build-common, build-components, create-manifests, capture-metadata]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled build failed (${new Date().toISOString().split('T')[0]})`,
              body: [
                '**Scheduled build-all-images workflow failed.**',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            })
