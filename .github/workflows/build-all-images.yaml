name: build-all-images

on:
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - '.dockerignore'
      - '.github/autoware.ref'
      - '.github/autoware-lock.repos'
      - '.github/autoware-base-images.json'
      - '.github/autoware-patches/**'
      - '.github/actions/combine-multi-arch-images/**'
      - '.github/actions/free-disk-space/**'
      - '.github/actions/build-image/**'
      - '.github/actions/setup-build-env/**'
      - '.github/image-inventory.json'
      - '.github/scripts/**'
      # Test-only and README-only pushes change no image or evidence input.
      - '!.github/scripts/tests/**'
      - '.github/workflows/build-all-images.yaml'
      - 'components/**'
      - '!components/*/README.md'

  schedule:
    - cron: '0 0 * * 0'
  # The branch's .github/autoware.ref selects the Autoware sources.
  workflow_dispatch:
    inputs:
      run_scan:
        description: 'Run a full image scan after this build completes (main only; release branches dispatch scan-images on the branch).'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-all-images-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX_COMMON: ghcr.io/${{ github.repository_owner }}/openadkit-common
  IMAGE_PREFIX_COMPONENT: ghcr.io/${{ github.repository_owner }}/openadkit
  IS_MAIN_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
  SAVE_CCACHE: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && (github.event_name == 'push' || github.event_name == 'schedule') }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      autoware_input_ref: ${{ steps.prepare.outputs.autoware_input_ref }}
      autoware_ref_type: ${{ steps.prepare.outputs.autoware_ref_type }}
      autoware_ref: ${{ steps.prepare.outputs.autoware_ref }}
      autoware_base_version: ${{ steps.prepare.outputs.autoware_base_version }}
      upstream_tag: ${{ steps.prepare.outputs.upstream_tag }}
      cache_scope: ${{ steps.prepare.outputs.cache_scope }}
      upstream_images: ${{ steps.upstream.outputs.upstream_images }}
      autoware_lock_sha256: ${{ steps.lock.outputs.autoware_lock_sha256 }}
      build_tag: ${{ steps.prepare.outputs.build_tag }}
      scan_requested: ${{ steps.prepare.outputs.scan_requested }}
      common_matrix: ${{ steps.inventory.outputs.common_matrix }}
      component_matrix: ${{ steps.inventory.outputs.component_matrix }}
      carla_matrix: ${{ steps.inventory.outputs.carla_matrix }}
      manifest_matrix: ${{ steps.inventory.outputs.manifest_matrix }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v7

      - name: Resolve shared build inputs
        id: prepare
        env:
          RUN_SCAN_INPUT: ${{ inputs.run_scan || false }}
        run: bash .github/scripts/resolve_build_inputs.sh
        shell: bash

      - name: Resolve image inventory
        id: inventory
        run: |
          set -euo pipefail
          mkdir -p image-inventory
          cp .github/image-inventory.json image-inventory/image-inventory.json
          python3 .github/scripts/build.py >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve immutable upstream Autoware images
        id: upstream
        env:
          UPSTREAM_TAG: ${{ steps.prepare.outputs.upstream_tag }}
          UPSTREAM_PINS: ${{ steps.prepare.outputs.upstream_pins }}
        run: |
          set -euo pipefail
          bash .github/scripts/resolve_upstream_images.sh
          echo "upstream_images=$(jq -c 'reduce .[] as $item ({}; .[$item.ros_distro][$item.name] = $item)' upstream-images/upstream-images.json)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload immutable upstream image metadata
        uses: actions/upload-artifact@v7
        with:
          name: upstream-images-${{ steps.prepare.outputs.build_tag }}
          path: upstream-images/upstream-images.json
          retention-days: 90

      - name: Upload image inventory
        uses: actions/upload-artifact@v7
        with:
          name: image-inventory-${{ steps.prepare.outputs.build_tag }}
          path: image-inventory/image-inventory.json
          retention-days: 90

      - name: Install YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
        shell: bash

      - name: Export exact Autoware dependency lockfile
        id: lock
        env:
          AUTOWARE_OVERLAY: ${{ steps.prepare.outputs.autoware_overlay }}
          AUTOWARE_LOCK_FILE: ${{ steps.prepare.outputs.autoware_lock_file }}
        run: |
          set -euo pipefail
          mkdir -p autoware-lock
          if [ -n "${AUTOWARE_LOCK_FILE}" ]; then
            # A commit pin builds the dependency lock committed with it.
            cp "${AUTOWARE_LOCK_FILE}" autoware-lock/autoware-lock.repos
          else
            python3 .github/scripts/export_autoware_lock.py \
              autoware-metadata/repositories/autoware.repos \
              autoware-lock/autoware-lock.repos \
              "${AUTOWARE_OVERLAY}"
          fi
          autoware_lock_sha256=$(sha256sum autoware-lock/autoware-lock.repos | cut -d ' ' -f1)
          echo "autoware_lock_sha256=${autoware_lock_sha256}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload Autoware dependency lockfile
        uses: actions/upload-artifact@v7
        with:
          name: autoware-lock-${{ steps.prepare.outputs.build_tag }}
          path: autoware-lock/autoware-lock.repos
          retention-days: 90

  # =============================================================================
  # Stage 1: Build universe-common images (core-devel build, lean base runtime)
  # =============================================================================
  build-common:
    needs: prepare
    runs-on: ${{ matrix.platform == 'linux/amd64' && (vars.RUNNER_AMD64 || 'ubuntu-22.04') || (vars.RUNNER_ARM64 || 'ubuntu-22.04-arm') }}
    # Development builds also compile Autoware core.
    timeout-minutes: ${{ needs.prepare.outputs.upstream_tag == '' && 240 || 120 }}
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.common_matrix) }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          autoware-ref: ${{ needs.prepare.outputs.autoware_ref }}
          build-tag: ${{ needs.prepare.outputs.build_tag }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          free-disk: true
          setup-autoware: true
          with-middleware: true

      - name: Build and push universe-common images
        uses: ./.github/actions/build-image
        with:
          target: universe-common
          ros-distro: ${{ matrix.ros-distro }}
          platform: ${{ matrix.platform }}
          prepared: ${{ toJSON(needs.prepare.outputs) }}
          tag-suffix: ${{ needs.prepare.outputs.build_tag }}
          publish: true
          stable-tags: ${{ env.IS_MAIN_PUSH }}
          save-ccache: ${{ env.SAVE_CCACHE }}

  # =============================================================================
  # Stage 2: Build component images (parallel)
  # =============================================================================
  build-components:
    runs-on: ${{ matrix.platform == 'linux/amd64' && (vars.RUNNER_AMD64 || 'ubuntu-22.04') || (vars.RUNNER_ARM64 || 'ubuntu-22.04-arm') }}
    # A compile with a cold ccache, such as the first build of new Autoware
    # sources, takes planning-control close to two hours.
    timeout-minutes: 180
    needs: [prepare, build-common]
    # A single common matrix failure must not skip cells whose common image
    # was already published. Missing contexts fail at pull.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.component_matrix) }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          autoware-ref: ${{ needs.prepare.outputs.autoware_ref }}
          build-tag: ${{ needs.prepare.outputs.build_tag }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          free-disk: true
          setup-autoware: true
          with-middleware: false

      - name: Build and push ${{ matrix.target }}
        uses: ./.github/actions/build-image
        with:
          target: ${{ matrix.target }}
          ros-distro: ${{ matrix.ros-distro }}
          platform: ${{ matrix.platform }}
          prepared: ${{ toJSON(needs.prepare.outputs) }}
          tag-suffix: ${{ needs.prepare.outputs.build_tag }}
          publish: true
          stable-tags: ${{ env.IS_MAIN_PUSH }}
          save-ccache: ${{ env.SAVE_CCACHE }}

  build-carla-interface:
    runs-on: ${{ vars.RUNNER_AMD64 || 'ubuntu-22.04' }}
    timeout-minutes: 60
    needs: [prepare, build-common, build-components]
    # build-components remains an ordering dependency, but unrelated matrix
    # failures must not suppress CARLA when its simulator image was published.
    if: >-
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.build-common.result == 'success'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.carla_matrix) }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          free-disk: true
          setup-autoware: false

      - name: Build and push ${{ matrix.target }}
        uses: ./.github/actions/build-image
        with:
          target: ${{ matrix.target }}
          ros-distro: ${{ matrix.ros-distro }}
          platform: ${{ matrix.platform }}
          prepared: ${{ toJSON(needs.prepare.outputs) }}
          tag-suffix: ${{ needs.prepare.outputs.build_tag }}
          publish: true
          stable-tags: ${{ env.IS_MAIN_PUSH }}
          ccache: false

  # =============================================================================
  # Stage 3: Create multi-arch manifests
  # =============================================================================
  create-manifests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [prepare, build-common, build-components, build-carla-interface]
    # Run even if one build leg failed so multi-arch manifests for the legs
    # that did complete are still published, instead of suppressing the whole
    # image set on a single flaky platform build. Prepare must have succeeded
    # or fromJson(manifest_matrix) evaluates an empty output.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.manifest_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifest for ${{ matrix.target }} (${{ matrix.ros-distro }})
        uses: ./.github/actions/combine-multi-arch-images
        with:
          image: ${{ matrix.repo == 'common' && env.IMAGE_PREFIX_COMMON || env.IMAGE_PREFIX_COMPONENT }}
          target: ${{ matrix.target }}
          ros-distro: ${{ matrix.ros-distro }}
          arches: ${{ matrix.arches }}
          build-tag: ${{ needs.prepare.outputs.build_tag }}
          registry: ${{ env.REGISTRY }}
          token: ${{ secrets.GITHUB_TOKEN }}

  manifest-report:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [prepare, create-manifests]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write manifest report
        env:
          MANIFEST_MATRIX: ${{ needs.prepare.outputs.manifest_matrix }}
          IMAGE_PREFIX_COMMON: ${{ env.IMAGE_PREFIX_COMMON }}
          IMAGE_PREFIX_COMPONENT: ${{ env.IMAGE_PREFIX_COMPONENT }}
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
        run: bash .github/scripts/report_manifests.sh >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  capture-metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [prepare, create-manifests]
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v7

      - name: Download Autoware dependency lockfile
        uses: actions/download-artifact@v8
        with:
          name: autoware-lock-${{ needs.prepare.outputs.build_tag }}
          path: build-metadata

      - name: Download image inventory
        uses: actions/download-artifact@v8
        with:
          name: image-inventory-${{ needs.prepare.outputs.build_tag }}
          path: build-metadata

      - name: Download immutable upstream image metadata
        uses: actions/download-artifact@v8
        with:
          name: upstream-images-${{ needs.prepare.outputs.build_tag }}
          path: build-metadata

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build metadata
        env:
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          OPENADKIT_SHA: ${{ github.sha }}
          AUTOWARE_INPUT_REF: ${{ needs.prepare.outputs.autoware_input_ref }}
          AUTOWARE_REF_TYPE: ${{ needs.prepare.outputs.autoware_ref_type }}
          AUTOWARE_REF: ${{ needs.prepare.outputs.autoware_ref }}
          AUTOWARE_BASE_VERSION: ${{ needs.prepare.outputs.autoware_base_version }}
          PREPARED_LOCK_SHA256: ${{ needs.prepare.outputs.autoware_lock_sha256 }}
          SCAN_REQUESTED: ${{ needs.prepare.outputs.scan_requested }}
          COMMON: ${{ env.IMAGE_PREFIX_COMMON }}
          COMPONENT: ${{ env.IMAGE_PREFIX_COMPONENT }}
        run: python3 .github/scripts/images.py capture
        shell: bash

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: build-metadata-${{ needs.prepare.outputs.build_tag }}
          path: |
            build-metadata/build-metadata.json
            build-metadata/autoware-lock.repos
            build-metadata/image-inventory.json
            build-metadata/upstream-images.json
          retention-days: 90

  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, capture-metadata]
    if: success()
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v7

      - name: Write job summary
        env:
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          AUTOWARE_INPUT_REF: ${{ needs.prepare.outputs.autoware_input_ref }}
          AUTOWARE_REF_TYPE: ${{ needs.prepare.outputs.autoware_ref_type }}
          AUTOWARE_REF: ${{ needs.prepare.outputs.autoware_ref }}
          AUTOWARE_BASE_VERSION: ${{ needs.prepare.outputs.autoware_base_version }}
          SCAN_REQUESTED: ${{ needs.prepare.outputs.scan_requested }}
          SOURCE_REF: ${{ github.ref }}
        run: bash .github/scripts/write_build_summary.sh >> "$GITHUB_STEP_SUMMARY"

  # The weekly Autoware snapshot bump (bump-autoware.yaml) is verified like
  # main. A dispatched run does not show as a pull request check, so report the
  # build as a commit status, then start the evidence cells, which follow
  # main's builds only on their own.
  bump-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, capture-metadata]
    if: always() && github.ref == 'refs/heads/ci/bump-autoware'
    permissions:
      actions: write
      statuses: write
    steps:
      - name: Report the build and dispatch the evidence cells
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          BUILT: ${{ needs.capture-metadata.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          status() {  # context, state, description
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$2" \
              -f context="bump-autoware / $1" -f description="$3" -f target_url="${RUN_URL}" >/dev/null
          }
          if [ "${BUILT}" = success ]; then
            status build success "build ${BUILD_TAG}"
            gh workflow run evidence.yaml --repo "${GITHUB_REPOSITORY}" --ref ci/bump-autoware -f build_tag="${BUILD_TAG}"
          else
            status build failure "the image build did not complete"
            status evidence error "not run: the image build did not complete"
          fi
        shell: bash

  notify-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, build-common, build-components, build-carla-interface, create-manifests, capture-metadata]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled build failed (${new Date().toISOString().split('T')[0]})`,
              body: [
                '**Scheduled build-all-images workflow failed.**',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            })
