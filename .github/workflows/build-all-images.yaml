name: build-all-images

on:
  push:
    paths:
      - '.github/actions/combine-multi-arch-images/**'
      - '.github/actions/free-disk-space/**'
      - '.github/actions/inject-ccache/**'
      - '.github/actions/setup-build-env/**'
      - '.github/image-inventory.json'
      - '.github/scripts/**'
      - '.github/workflows/build-all-images.yaml'
      - 'components/**'

  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      autoware_ref:
        description: 'Autoware ref to build from (branch, tag, or SHA). Defaults to main.'
        required: false
        default: main
      run_scan:
        description: 'Run a full image scan after this build completes.'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-all-images-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX_COMMON: ghcr.io/${{ github.repository_owner }}/openadkit-common
  IMAGE_PREFIX_COMPONENT: ghcr.io/${{ github.repository_owner }}/openadkit
  BAKE_FILE: components/docker-bake.hcl

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      autoware_input_ref: ${{ steps.prepare.outputs.autoware_input_ref }}
      autoware_ref_type: ${{ steps.prepare.outputs.autoware_ref_type }}
      autoware_ref: ${{ steps.prepare.outputs.autoware_ref }}
      autoware_base_version: ${{ steps.prepare.outputs.autoware_base_version }}
      autoware_lock_sha256: ${{ steps.lock.outputs.autoware_lock_sha256 }}
      build_tag: ${{ steps.prepare.outputs.build_tag }}
      scan_requested: ${{ steps.prepare.outputs.scan_requested }}
      common_matrix: ${{ steps.inventory.outputs.common_matrix }}
      component_matrix: ${{ steps.inventory.outputs.component_matrix }}
      carla_matrix: ${{ steps.inventory.outputs.carla_matrix }}
      manifest_matrix: ${{ steps.inventory.outputs.manifest_matrix }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Resolve shared build inputs
        id: prepare
        env:
          AUTOWARE_REF_INPUT: ${{ inputs.autoware_ref || 'main' }}
          RUN_SCAN_INPUT: ${{ inputs.run_scan || false }}
        run: bash .github/scripts/resolve_build_inputs.sh
        shell: bash

      - name: Resolve image inventory
        id: inventory
        run: |
          set -euo pipefail
          mkdir -p image-inventory
          cp .github/image-inventory.json image-inventory/image-inventory.json
          python3 .github/scripts/resolve_image_matrices.py >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload image inventory
        uses: actions/upload-artifact@v4
        with:
          name: image-inventory-${{ steps.prepare.outputs.build_tag }}
          path: image-inventory/image-inventory.json
          retention-days: 90

      - name: Install YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
        shell: bash

      - name: Export exact Autoware dependency lockfile
        id: lock
        run: |
          set -euo pipefail
          python3 .github/scripts/export_autoware_lock.py \
            autoware-metadata/repositories/autoware.repos \
            autoware-lock/autoware-lock.repos
          autoware_lock_sha256=$(sha256sum autoware-lock/autoware-lock.repos | cut -d ' ' -f1)
          echo "autoware_lock_sha256=${autoware_lock_sha256}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload Autoware dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: autoware-lock-${{ steps.prepare.outputs.build_tag }}
          path: autoware-lock/autoware-lock.repos
          retention-days: 90

  # =============================================================================
  # Stage 1: Build universe-common images (on upstream Autoware core bases)
  # =============================================================================
  build-common:
    needs: prepare
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
      packages: write
    env:
      CACHE_KEY_PREFIX: buildkit-mounts-universe-common-${{ matrix.ros-distro }}-${{ matrix.platform-label }}-
      IS_MAIN_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.common_matrix) }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          autoware-ref: ${{ needs.prepare.outputs.autoware_ref }}
          build-tag: ${{ needs.prepare.outputs.build_tag }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          free-disk: true
          setup-autoware: true
          with-middleware: true

      - name: Extract metadata for openadkit-common:universe-common-devel
        id: meta-universe-common-devel
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMMON }}
          bake-target: docker-metadata-action-universe-common-devel
          tags: |
            type=raw,value=universe-common-devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=universe-common-devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Extract metadata for openadkit-common:universe-common
        id: meta-universe-common
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMMON }}
          bake-target: docker-metadata-action-universe-common
          tags: |
            type=raw,value=universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Ensure upstream Autoware base images exist
        env:
          ROS_DISTRO: ${{ matrix.ros-distro }}
          UPSTREAM_TAG: ${{ vars.UPSTREAM_TAG }}
        run: |
          set -euo pipefail
          # universe-common surfaces core/core-devel; sensing-perception-cuda
          # surfaces base-cuda-{devel,runtime}. Together they cover every
          # upstream base this build depends on, so a missing CUDA base fails
          # here instead of late in build-components.
          refs=$(docker buildx bake -f "${BAKE_FILE}" --print universe-common sensing-perception-cuda 2>/dev/null \
            | jq -r '[.target[].contexts // {} | to_entries[].value]
                     | map(select(startswith("docker-image://ghcr.io/autowarefoundation/autoware:")))
                     | unique[]' | sed 's#^docker-image://##')
          if [ -z "${refs}" ]; then echo "No upstream refs to verify."; exit 0; fi
          fail=0
          while IFS= read -r ref; do
            [ -z "${ref}" ] && continue
            if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then
              echo "OK: ${ref}"
            else
              echo "::error::Missing upstream image: ${ref}"; fail=1
            fi
          done <<< "${refs}"
          [ "${fail}" -eq 0 ]
        shell: bash

      - name: Restore BuildKit cache mounts
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: cache-mounts
          key: ${{ env.CACHE_KEY_PREFIX }}${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}

      - name: Arm post-step save of BuildKit cache mounts (main only)
        if: env.IS_MAIN_PUSH == 'true'
        uses: actions/cache@v5
        with:
          path: cache-mounts
          key: ${{ env.CACHE_KEY_PREFIX }}${{ github.sha }}
          lookup-only: true

      - name: Inject BuildKit cache mounts
        uses: ./.github/actions/inject-ccache
        with:
          ros-distro: ${{ matrix.ros-distro }}
          skip-extraction: ${{ steps.cache-restore.outputs.cache-hit }}

      - name: Build and push universe-common images
        uses: docker/bake-action@v5
        env:
          ROS_DISTRO: ${{ matrix.ros-distro }}
          UPSTREAM_TAG: ${{ vars.UPSTREAM_TAG }}
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta-universe-common-devel.outputs.bake-file }}
            ${{ steps.meta-universe-common.outputs.bake-file }}
          targets: |
            universe-common-devel
            universe-common
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.labels."org.opencontainers.image.build-tag"=${{ needs.prepare.outputs.build_tag }}
            *.labels."org.opencontainers.image.run-id"=${{ github.run_id }}
            *.labels."org.opencontainers.image.openadkit-sha"=${{ github.sha }}
            *.labels."org.opencontainers.image.autoware-input-ref"=${{ needs.prepare.outputs.autoware_input_ref }}
            *.labels."org.opencontainers.image.autoware-ref-type"=${{ needs.prepare.outputs.autoware_ref_type }}
            *.labels."org.opencontainers.image.autoware-ref"=${{ needs.prepare.outputs.autoware_ref }}
            *.labels."org.opencontainers.image.autoware-base-version"=${{ needs.prepare.outputs.autoware_base_version }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main,mode=max

      - name: Prune BuildKit cache mount lineage (main only)
        if: env.IS_MAIN_PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY_PREFIX: ${{ env.CACHE_KEY_PREFIX }}
          KEEP_KEY: ${{ env.CACHE_KEY_PREFIX }}${{ github.sha }}
          MAX_GB: 6
        run: bash .github/scripts/prune-buildkit-cache.sh

  # =============================================================================
  # Stage 2: Build component images (parallel)
  # =============================================================================
  build-components:
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    timeout-minutes: 120
    needs: [prepare, build-common]
    permissions:
      actions: write
      contents: read
      packages: write
    env:
      CACHE_KEY_PREFIX: buildkit-mounts-${{ matrix.target }}-${{ matrix.ros-distro }}-${{ matrix.platform-label }}-
      IS_MAIN_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.component_matrix) }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          autoware-ref: ${{ needs.prepare.outputs.autoware_ref }}
          build-tag: ${{ needs.prepare.outputs.build_tag }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          free-disk: true
          setup-autoware: true
          with-middleware: false

      - name: Extract metadata for ${{ matrix.target }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-${{ matrix.target }}
          tags: |
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Restore BuildKit cache mounts
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: cache-mounts
          key: ${{ env.CACHE_KEY_PREFIX }}${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}

      - name: Arm post-step save of BuildKit cache mounts (main only)
        if: env.IS_MAIN_PUSH == 'true'
        uses: actions/cache@v5
        with:
          path: cache-mounts
          key: ${{ env.CACHE_KEY_PREFIX }}${{ github.sha }}
          lookup-only: true

      - name: Inject BuildKit cache mounts
        uses: ./.github/actions/inject-ccache
        with:
          ros-distro: ${{ matrix.ros-distro }}
          skip-extraction: ${{ steps.cache-restore.outputs.cache-hit }}

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v5
        env:
          ROS_DISTRO: ${{ matrix.ros-distro }}
          UPSTREAM_TAG: ${{ vars.UPSTREAM_TAG }}
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.args.ROS_DISTRO=${{ matrix.ros-distro }}
            *.contexts.universe-common-devel=docker-image://${{ env.IMAGE_PREFIX_COMMON }}:universe-common-devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.contexts.universe-common=docker-image://${{ env.IMAGE_PREFIX_COMMON }}:universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.labels."org.opencontainers.image.build-tag"=${{ needs.prepare.outputs.build_tag }}
            *.labels."org.opencontainers.image.run-id"=${{ github.run_id }}
            *.labels."org.opencontainers.image.openadkit-sha"=${{ github.sha }}
            *.labels."org.opencontainers.image.autoware-input-ref"=${{ needs.prepare.outputs.autoware_input_ref }}
            *.labels."org.opencontainers.image.autoware-ref-type"=${{ needs.prepare.outputs.autoware_ref_type }}
            *.labels."org.opencontainers.image.autoware-ref"=${{ needs.prepare.outputs.autoware_ref }}
            *.labels."org.opencontainers.image.autoware-base-version"=${{ needs.prepare.outputs.autoware_base_version }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main,mode=max

      - name: Prune BuildKit cache mount lineage (main only)
        if: env.IS_MAIN_PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY_PREFIX: ${{ env.CACHE_KEY_PREFIX }}
          KEEP_KEY: ${{ env.CACHE_KEY_PREFIX }}${{ github.sha }}
          MAX_GB: 6
        run: bash .github/scripts/prune-buildkit-cache.sh

  build-carla-interface:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: [prepare, build-common, build-components]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.carla_matrix) }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.target }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-${{ matrix.target }}
          tags: |
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v5
        env:
          ROS_DISTRO: ${{ matrix.ros-distro }}
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.args.ROS_DISTRO=${{ matrix.ros-distro }}
            carla-interface.args.SIMULATOR_IMAGE=${{ env.IMAGE_PREFIX_COMPONENT }}:simulator-amd64-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.labels."org.opencontainers.image.build-tag"=${{ needs.prepare.outputs.build_tag }}
            *.labels."org.opencontainers.image.run-id"=${{ github.run_id }}
            *.labels."org.opencontainers.image.openadkit-sha"=${{ github.sha }}
            *.labels."org.opencontainers.image.autoware-input-ref"=${{ needs.prepare.outputs.autoware_input_ref }}
            *.labels."org.opencontainers.image.autoware-ref-type"=${{ needs.prepare.outputs.autoware_ref_type }}
            *.labels."org.opencontainers.image.autoware-ref"=${{ needs.prepare.outputs.autoware_ref }}
            *.labels."org.opencontainers.image.autoware-base-version"=${{ needs.prepare.outputs.autoware_base_version }}

  # =============================================================================
  # Stage 3: Create multi-arch manifests
  # =============================================================================
  create-manifests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [prepare, build-common, build-components, build-carla-interface]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.manifest_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest for ${{ matrix.target }} (${{ matrix.ros-distro }})
        uses: ./.github/actions/combine-multi-arch-images
        with:
          image: ${{ matrix.repo == 'common' && env.IMAGE_PREFIX_COMMON || env.IMAGE_PREFIX_COMPONENT }}
          target: ${{ matrix.target }}
          ros-distro: ${{ matrix.ros-distro }}
          arches: ${{ matrix.arches }}
          build-tag: ${{ needs.prepare.outputs.build_tag }}
          registry: ${{ env.REGISTRY }}
          token: ${{ secrets.GITHUB_TOKEN }}

  manifest-report:
    runs-on: ubuntu-22.04
    needs: [prepare, create-manifests]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write manifest report
        env:
          MANIFEST_MATRIX: ${{ needs.prepare.outputs.manifest_matrix }}
          IMAGE_PREFIX_COMMON: ${{ env.IMAGE_PREFIX_COMMON }}
          IMAGE_PREFIX_COMPONENT: ${{ env.IMAGE_PREFIX_COMPONENT }}
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
        run: bash .github/scripts/report_manifests.sh >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  capture-metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [prepare, create-manifests]
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Download Autoware dependency lockfile
        uses: actions/download-artifact@v4
        with:
          name: autoware-lock-${{ needs.prepare.outputs.build_tag }}
          path: build-metadata

      - name: Download image inventory
        uses: actions/download-artifact@v4
        with:
          name: image-inventory-${{ needs.prepare.outputs.build_tag }}
          path: build-metadata

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build metadata
        env:
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          OPENADKIT_SHA: ${{ github.sha }}
          AUTOWARE_INPUT_REF: ${{ needs.prepare.outputs.autoware_input_ref }}
          AUTOWARE_REF_TYPE: ${{ needs.prepare.outputs.autoware_ref_type }}
          AUTOWARE_REF: ${{ needs.prepare.outputs.autoware_ref }}
          AUTOWARE_BASE_VERSION: ${{ needs.prepare.outputs.autoware_base_version }}
          PREPARED_LOCK_SHA256: ${{ needs.prepare.outputs.autoware_lock_sha256 }}
          SCAN_REQUESTED: ${{ needs.prepare.outputs.scan_requested }}
          COMMON: ${{ env.IMAGE_PREFIX_COMMON }}
          COMPONENT: ${{ env.IMAGE_PREFIX_COMPONENT }}
        run: bash .github/scripts/capture_build_metadata.sh
        shell: bash

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata-${{ needs.prepare.outputs.build_tag }}
          path: |
            build-metadata/build-metadata.json
            build-metadata/autoware-lock.repos
            build-metadata/image-inventory.json
          retention-days: 90

  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, capture-metadata]
    if: success()
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Write job summary
        env:
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          AUTOWARE_INPUT_REF: ${{ needs.prepare.outputs.autoware_input_ref }}
          AUTOWARE_REF_TYPE: ${{ needs.prepare.outputs.autoware_ref_type }}
          AUTOWARE_REF: ${{ needs.prepare.outputs.autoware_ref }}
          AUTOWARE_BASE_VERSION: ${{ needs.prepare.outputs.autoware_base_version }}
          SCAN_REQUESTED: ${{ needs.prepare.outputs.scan_requested }}
          SOURCE_REF: ${{ github.ref }}
        run: bash .github/scripts/write_build_summary.sh >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, build-common, build-components, build-carla-interface, create-manifests, capture-metadata]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled build failed (${new Date().toISOString().split('T')[0]})`,
              body: [
                '**Scheduled build-all-images workflow failed.**',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            })
