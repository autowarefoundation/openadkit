name: build-single-image-distro

permissions:
  contents: read

# The jobs of build-single-image.yaml for one ROS distribution. That workflow
# calls this once per distribution; it also owns the concurrency group and the
# pull request's cache cleanup, which both distributions share.

on:
  workflow_call:
    inputs:
      ros-distro:
        description: "ROS distribution (humble or jazzy)"
        required: true
        type: string
      target:
        description: "Space-separated Bake targets. Empty = auto-detect relevant changes."
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX_COMMON: ghcr.io/${{ github.repository_owner }}/openadkit-common
  IMAGE_PREFIX_COMPONENT: ghcr.io/${{ github.repository_owner }}/openadkit

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      autoware_input_ref: ${{ steps.prepare.outputs.autoware_input_ref }}
      autoware_ref_type: ${{ steps.prepare.outputs.autoware_ref_type }}
      autoware_ref: ${{ steps.prepare.outputs.autoware_ref }}
      autoware_base_version: ${{ steps.prepare.outputs.autoware_base_version }}
      upstream_tag: ${{ steps.prepare.outputs.upstream_tag }}
      cache_scope: ${{ steps.prepare.outputs.cache_scope }}
      autoware_lock_sha256: ${{ steps.lock.outputs.autoware_lock_sha256 }}
      upstream_core_devel: ${{ steps.upstream.outputs.core_devel }}
      upstream_base: ${{ steps.upstream.outputs.base }}
      upstream_cuda_runtime: ${{ steps.upstream.outputs.cuda_runtime }}
      upstream_cuda_devel: ${{ steps.upstream.outputs.cuda_devel }}
      build_tag: ${{ steps.prepare.outputs.build_tag }}
      targets_json: ${{ steps.detect.outputs.targets_json }}
      setup_autoware: ${{ steps.detect.outputs.setup_autoware }}
      with_middleware: ${{ steps.detect.outputs.with_middleware }}
      use_local_common: ${{ steps.contexts.outputs.use_local_common }}
      use_local_simulator: ${{ steps.contexts.outputs.use_local_simulator }}
      devel_context: ${{ steps.contexts.outputs.devel_context }}
      runtime_context: ${{ steps.contexts.outputs.runtime_context }}
      simulator_context: ${{ steps.contexts.outputs.simulator_context }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve shared build inputs
        id: prepare
        env:
          REUSE_IMAGE: ${{ env.IMAGE_PREFIX_COMMON }}:universe-common-devel-amd64-${{ inputs.ros-distro }}
        run: bash .github/scripts/resolve_build_inputs.sh
        shell: bash

      - name: Install YAML parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
        shell: bash

      - name: Export Autoware dependency lockfile
        id: lock
        env:
          AUTOWARE_OVERLAY: ${{ steps.prepare.outputs.autoware_overlay }}
          AUTOWARE_LOCK_FILE: ${{ steps.prepare.outputs.autoware_lock_file }}
          LOCK_BUILD_TAG: ${{ steps.prepare.outputs.lock_build_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p autoware-lock
          # A commit pin builds the dependency lock committed with it; a branch
          # reuses the lock of the build whose Autoware revision this check uses.
          if [ -n "${AUTOWARE_LOCK_FILE}" ]; then
            cp "${AUTOWARE_LOCK_FILE}" autoware-lock/autoware-lock.repos
          elif [ -z "${LOCK_BUILD_TAG}" ] || ! gh run download "${LOCK_BUILD_TAG%%-*}" --repo "${GITHUB_REPOSITORY}" \
            --name "autoware-lock-${LOCK_BUILD_TAG}" --dir autoware-lock; then
            python3 .github/scripts/export_autoware_lock.py \
              autoware-metadata/repositories/autoware.repos \
              autoware-lock/autoware-lock.repos \
              "${AUTOWARE_OVERLAY}"
          fi
          autoware_lock_sha256=$(sha256sum autoware-lock/autoware-lock.repos | cut -d ' ' -f1)
          echo "autoware_lock_sha256=${autoware_lock_sha256}" >> "${GITHUB_OUTPUT}"
        shell: bash

      - name: Upload Autoware dependency lockfile
        uses: actions/upload-artifact@v7
        with:
          # Both distributions run in one workflow run: name each one's lock.
          name: autoware-lock-${{ steps.prepare.outputs.build_tag }}-${{ inputs.ros-distro }}
          path: autoware-lock/autoware-lock.repos
          retention-days: 7

      - name: Detect changed targets
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          ROS_DISTRO: ${{ inputs.ros-distro }}
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          set -euo pipefail

          changed_files=""
          if [ -z "${TARGET_INPUT}" ]; then
            if [ "${EVENT_NAME}" = "pull_request" ]; then
              if [ -z "${BASE_SHA}" ]; then
                echo "Pull request base SHA is unavailable" >&2
                exit 1
              fi
              diff_base="${BASE_SHA}"
            else
              diff_base=$(git rev-parse HEAD^)
            fi

            changed_files=$(git diff --name-only "${diff_base}...HEAD")
            echo "Changed files:" >&2
            printf '%s\n' "${changed_files}" >&2
          fi

          python3 .github/scripts/build.py \
            single-image "${ROS_DISTRO}" "${TARGET_INPUT}" \
            <<< "${changed_files}" >> "${GITHUB_OUTPUT}"
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve registry contexts
        id: contexts
        env:
          ROS_DISTRO: ${{ inputs.ros-distro }}
          TARGETS_JSON: ${{ steps.detect.outputs.targets_json }}
          USE_LOCAL_COMMON: ${{ steps.detect.outputs.use_local_common }}
          USE_LOCAL_SIMULATOR: ${{ steps.detect.outputs.use_local_simulator }}
          AUTOWARE_INPUT_REF: ${{ steps.prepare.outputs.autoware_input_ref }}
          AUTOWARE_REF_TYPE: ${{ steps.prepare.outputs.autoware_ref_type }}
          AUTOWARE_REF: ${{ steps.prepare.outputs.autoware_ref }}
          AUTOWARE_BASE_VERSION: ${{ steps.prepare.outputs.autoware_base_version }}
          AUTOWARE_LOCK_SHA256: ${{ steps.lock.outputs.autoware_lock_sha256 }}
        run: bash .github/scripts/resolve_registry_contexts.sh
        shell: bash

      - name: Resolve required immutable upstream Autoware images
        if: steps.detect.outputs.targets_json != '[]'
        id: upstream
        env:
          UPSTREAM_TAG: ${{ steps.prepare.outputs.upstream_tag }}
          UPSTREAM_PINS: ${{ steps.prepare.outputs.upstream_pins }}
          TARGETS_JSON: ${{ steps.detect.outputs.targets_json }}
          UPSTREAM_ROS_DISTRO: ${{ inputs.ros-distro }}
          USE_LOCAL_COMMON: ${{ steps.contexts.outputs.use_local_common }}
        run: |
          set -euo pipefail
          names=()
          if [ "${USE_LOCAL_COMMON}" = true ] \
            || jq -e 'index("universe-common-devel") != null or index("universe-common") != null' <<<"${TARGETS_JSON}" >/dev/null; then
            names+=(core-devel base)
          fi
          if jq -e 'index("sensing-perception-cuda") != null' <<<"${TARGETS_JSON}" >/dev/null; then
            names+=(base-cuda-runtime base-cuda-devel)
          fi
          export UPSTREAM_IMAGE_NAMES="${names[*]}"
          bash .github/scripts/resolve_upstream_images.sh
          {
            echo "core_devel=$(jq -r 'map(select(.name == "core-devel"))[0].uri // empty' upstream-images/upstream-images.json)"
            echo "base=$(jq -r 'map(select(.name == "base"))[0].uri // empty' upstream-images/upstream-images.json)"
            echo "cuda_runtime=$(jq -r 'map(select(.name == "base-cuda-runtime"))[0].uri // empty' upstream-images/upstream-images.json)"
            echo "cuda_devel=$(jq -r 'map(select(.name == "base-cuda-devel"))[0].uri // empty' upstream-images/upstream-images.json)"
          } >> "${GITHUB_OUTPUT}"
        shell: bash

  build-local-common:
    needs: prepare
    # The shared cache is about 4 GB. Limit it to PRs where build-single-image
    # can remove the cache after the matrix completes; forks keep the old fallback.
    if: >-
      needs.prepare.outputs.use_local_common == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.RUNNER_AMD64 || 'ubuntu-22.04' }}
    # Development builds also compile Autoware core.
    timeout-minutes: ${{ needs.prepare.outputs.upstream_tag == '' && 240 || 120 }}
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          autoware-ref: ${{ needs.prepare.outputs.autoware_ref }}
          build-tag: ${{ needs.prepare.outputs.build_tag }}-${{ inputs.ros-distro }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          free-disk: true
          setup-autoware: true
          with-middleware: true

      - name: Build shared universe-common images
        uses: ./.github/actions/build-image
        with:
          target: universe-common
          ros-distro: ${{ inputs.ros-distro }}
          platform: linux/amd64
          prepared: ${{ toJSON(needs.prepare.outputs) }}
          tag-suffix: pr${{ github.event.pull_request.number || github.run_id }}
          shared-common: true

  build:
    needs: [prepare, build-local-common]
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.targets_json != '[]' &&
      (needs.build-local-common.result == 'success' ||
      needs.build-local-common.result == 'skipped')
    runs-on: ${{ vars.RUNNER_AMD64 || 'ubuntu-22.04' }}
    # planning-control can take nearly two hours before the bounded Trivy scan;
    # fork PRs may also compile development core and universe-common first.
    timeout-minutes: ${{ needs.prepare.outputs.upstream_tag == '' && 300 || 180 }}
    permissions:
      actions: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets_json) }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          autoware-ref: ${{ needs.prepare.outputs.autoware_ref }}
          build-tag: ${{ needs.prepare.outputs.build_tag }}-${{ inputs.ros-distro }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          free-disk: ${{ needs.prepare.outputs.setup_autoware == 'true' || needs.prepare.outputs.use_local_common == 'true' || needs.prepare.outputs.use_local_simulator == 'true' }}
          setup-autoware: ${{ needs.prepare.outputs.setup_autoware == 'true' || needs.prepare.outputs.use_local_common == 'true' || needs.prepare.outputs.use_local_simulator == 'true' }}
          with-middleware: ${{ needs.prepare.outputs.with_middleware == 'true' || needs.prepare.outputs.use_local_common == 'true' }}

      - name: Build ${{ matrix.target }}
        id: image
        uses: ./.github/actions/build-image
        with:
          target: ${{ matrix.target }}
          ros-distro: ${{ inputs.ros-distro }}
          platform: linux/amd64
          prepared: ${{ toJSON(needs.prepare.outputs) }}
          tag-suffix: pr${{ github.event.pull_request.number || github.run_id }}
          common-cached: ${{ needs.build-local-common.result == 'success' }}

      - name: Scan ${{ matrix.target }} for HIGH and CRITICAL vulnerabilities
        # Reporting-only: findings are surfaced in the step log, but the hard
        # gate is the scan-images workflow (scan.yaml) that feeds releases.
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.tags }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln,secret
          timeout: 15m
          trivyignores: .trivyignore
