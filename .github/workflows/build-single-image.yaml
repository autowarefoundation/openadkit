name: build-single-image

permissions:
  contents: read

# Lightweight single-image build for PR checks and manual debugging.
#
# Triggers:
#   - pull_request: when component or shared build-graph inputs change.
#     Builds affected targets with --load, then scans them (no push), amd64
#     only, for both ROS distributions: an image that builds on humble can
#     still break on jazzy (Ubuntu 24.04 ships different packages).
#     Fork-safe: elevated cache cleanup runs only for same-repository PRs.
#   - workflow_dispatch: manual single-target or multi-target validation build
#     for one distribution.
#
# The jobs per distribution live in build-single-image-distro.yaml.
# This workflow does NOT replace build-all-images.yaml for releases.
# It validates that affected build inputs produce buildable images
# without running the full 32+ job pipeline.

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/autoware.ref"
      - ".github/autoware-patches/**"
      - ".github/scripts/autoware_patches.py"
      - "components/**"
      - ".github/image-inventory.json"
      - ".github/scripts/export_autoware_lock.py"
      - ".github/scripts/build.py"
      - ".github/scripts/resolve_build_inputs.sh"
      - ".github/scripts/resolve_registry_contexts.sh"
      - ".github/scripts/resolve_upstream_images.sh"
      - ".github/scripts/registry_lookup.sh"
      - ".github/actions/free-disk-space/**"
      - ".github/actions/build-image/**"
      - ".github/actions/setup-build-env/**"
      - ".github/workflows/build-single-image.yaml"
      - ".github/workflows/build-single-image-distro.yaml"
      - ".trivyignore"
  workflow_dispatch:
    inputs:
      target:
        description: "Space-separated Bake targets (e.g. visualizer sensing-perception). Empty = auto-detect relevant changes."
        required: false
        default: ""
      ros-distro:
        description: "ROS distribution (humble or jazzy)"
        required: false
        default: humble

concurrency:
  group: build-single-image-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ros-distro: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.ros-distro) || '["humble", "jazzy"]') }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/build-single-image-distro.yaml
    with:
      ros-distro: ${{ matrix.ros-distro }}
      target: ${{ inputs.target || '' }}
