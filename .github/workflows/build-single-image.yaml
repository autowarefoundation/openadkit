name: build-single-image

permissions:
  contents: read

# Lightweight single-image build for PR checks and manual debugging.
#
# Triggers:
#   - pull_request: when component or shared build-graph inputs change.
#     Builds affected targets with --load, then scans them (no push), amd64 only.
#     Fork-safe: uses GITHUB_TOKEN (read-only for public GHCR pulls).
#   - workflow_dispatch: manual single-target or multi-target build.
#     Optionally pushes a run-tagged image to GHCR.
#
# This workflow does NOT replace build-all-images.yaml for releases.
# It validates that affected build inputs produce buildable images
# without running the full 32+ job pipeline.

on:
  pull_request:
    paths:
      - "components/**"
      - ".github/image-inventory.json"
      - ".github/scripts/export_autoware_lock.py"
      - ".github/scripts/resolve_build_inputs.sh"
      - ".github/actions/free-disk-space/**"
      - ".github/actions/inject-ccache/**"
      - ".github/actions/setup-build-env/**"
      - ".github/workflows/build-single-image.yaml"
  workflow_dispatch:
    inputs:
      target:
        description: "Space-separated Bake targets (e.g. visualizer sensing-perception). Empty = auto-detect relevant changes."
        required: false
        default: ""
      ros-distro:
        description: "ROS distribution (humble or jazzy)"
        required: false
        default: humble
      push:
        description: "Push to GHCR (otherwise --load only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: build-single-image-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX_COMMON: ghcr.io/${{ github.repository_owner }}/openadkit-common
  IMAGE_PREFIX_COMPONENT: ghcr.io/${{ github.repository_owner }}/openadkit
  BAKE_FILE: components/docker-bake.hcl

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      autoware_ref: ${{ steps.prepare.outputs.autoware_ref }}
      build_tag: ${{ steps.prepare.outputs.build_tag }}
      targets_json: ${{ steps.detect.outputs.targets_json }}
      setup_autoware: ${{ steps.detect.outputs.setup_autoware }}
      with_middleware: ${{ steps.detect.outputs.with_middleware }}
      use_local_common: ${{ steps.detect.outputs.use_local_common }}
      use_local_simulator: ${{ steps.detect.outputs.use_local_simulator }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve shared build inputs
        id: prepare
        env:
          AUTOWARE_REF_INPUT: main
        run: bash .github/scripts/resolve_build_inputs.sh
        shell: bash

      - name: Install YAML parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
        shell: bash

      - name: Export Autoware dependency lockfile
        id: lock
        run: |
          set -euo pipefail
          python3 .github/scripts/export_autoware_lock.py \
            autoware-metadata/repositories/autoware.repos \
            autoware-lock/autoware-lock.repos
        shell: bash

      - name: Upload Autoware dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: autoware-lock-${{ steps.prepare.outputs.build_tag }}
          path: autoware-lock/autoware-lock.repos
          retention-days: 7

      - name: Detect changed targets
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          set -euo pipefail

          all_targets=$(jq -r '.images[].target' .github/image-inventory.json | xargs)
          targets=""
          build_input_matched=false
          use_local_common=false
          use_local_simulator=false

          if [ -n "${TARGET_INPUT}" ]; then
            for requested_target in ${TARGET_INPUT}; do
              if ! jq -e --arg target "${requested_target}" \
                '.images[] | select(.target == $target)' \
                .github/image-inventory.json > /dev/null; then
                echo "Unknown Bake target: ${requested_target}" >&2
                exit 1
              fi
            done
            targets="${TARGET_INPUT}"
          else
            if [ "${EVENT_NAME}" = "pull_request" ]; then
              if [ -z "${BASE_SHA}" ]; then
                echo "Pull request base SHA is unavailable" >&2
                exit 1
              fi
              diff_base="${BASE_SHA}"
            else
              diff_base=$(git rev-parse HEAD^)
            fi

            changed_files=$(git diff --name-only "${diff_base}...HEAD")
            echo "Changed files:" >&2
            echo "${changed_files}" >&2

            while IFS= read -r changed_file; do
              [ -n "${changed_file}" ] || continue
              case "${changed_file}" in
                components/docker-bake.hcl)
                  targets="${targets} ${all_targets}"
                  build_input_matched=true
                  use_local_common=true
                  use_local_simulator=true
                  ;;
                components/README.md|components/*/README.md)
                  ;;
                components/universe-common/*)
                  targets="${targets} universe-common-devel universe-common"
                  build_input_matched=true
                  use_local_common=true
                  ;;
                components/sensing-perception/Dockerfile)
                  targets="${targets} sensing-perception"
                  build_input_matched=true
                  ;;
                components/sensing-perception/Dockerfile.cuda)
                  targets="${targets} sensing-perception-cuda"
                  build_input_matched=true
                  ;;
                components/sensing-perception/*)
                  targets="${targets} sensing-perception sensing-perception-cuda"
                  build_input_matched=true
                  ;;
                components/localization-mapping/*)
                  targets="${targets} localization-mapping"
                  build_input_matched=true
                  ;;
                components/planning-control/*)
                  targets="${targets} planning-control"
                  build_input_matched=true
                  ;;
                components/vehicle-system/*)
                  targets="${targets} vehicle-system"
                  build_input_matched=true
                  ;;
                components/api/*)
                  targets="${targets} api"
                  build_input_matched=true
                  ;;
                components/visualizer/*)
                  targets="${targets} visualizer"
                  build_input_matched=true
                  ;;
                components/simulator/*)
                  targets="${targets} simulator carla-interface"
                  build_input_matched=true
                  use_local_simulator=true
                  ;;
                components/carla-interface/*)
                  targets="${targets} carla-interface"
                  build_input_matched=true
                  ;;
                .github/image-inventory.json|\
                .github/scripts/export_autoware_lock.py|\
                .github/scripts/resolve_build_inputs.sh|\
                .github/actions/free-disk-space/*|\
                .github/actions/inject-ccache/*|\
                .github/actions/setup-build-env/*|\
                .github/workflows/build-single-image.yaml)
                  targets="${targets} ${all_targets}"
                  build_input_matched=true
                  ;;
                components/*)
                  echo "Unmapped component build input: ${changed_file}" >&2
                  exit 1
                  ;;
                *)
                  ;;
              esac
            done <<< "${changed_files}"
          fi

          targets=$(tr ' ' '\n' <<< "${targets}" | sort -u | xargs)

          if [ "${build_input_matched}" = true ] && [ -z "${targets}" ]; then
            echo "A build-affecting path matched but produced no Bake targets" >&2
            exit 1
          fi

          setup_autoware=false
          with_middleware=false
          for target in ${targets}; do
            if [ "${target}" != "carla-interface" ]; then
              setup_autoware=true
            fi
            case "${target}" in
              universe-common-devel|universe-common)
                with_middleware=true
                ;;
            esac
          done

          if [ -z "${targets}" ]; then
            targets_json="[]"
          else
            targets_json=$(tr ' ' '\n' <<< "${targets}" | jq -R . | jq -s -c .)
          fi

          {
            echo "targets_json=${targets_json}"
            echo "setup_autoware=${setup_autoware}"
            echo "with_middleware=${with_middleware}"
            echo "use_local_common=${use_local_common}"
            echo "use_local_simulator=${use_local_simulator}"
          } >> "${GITHUB_OUTPUT}"
          echo "Detected targets: '${targets}'" >&2
          echo "setup_autoware: ${setup_autoware}" >&2
          echo "with_middleware: ${with_middleware}" >&2
          echo "use_local_common: ${use_local_common}" >&2
          echo "use_local_simulator: ${use_local_simulator}" >&2
        shell: bash

  build:
    needs: prepare
    if: needs.prepare.outputs.targets_json != '[]'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets_json) }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          autoware-ref: ${{ needs.prepare.outputs.autoware_ref }}
          build-tag: ${{ needs.prepare.outputs.build_tag }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          free-disk: ${{ needs.prepare.outputs.setup_autoware == 'true' }}
          setup-autoware: ${{ needs.prepare.outputs.setup_autoware == 'true' }}
          with-middleware: ${{ needs.prepare.outputs.with_middleware == 'true' }}

      - name: Extract metadata for ${{ matrix.target }}
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ startsWith(matrix.target, 'universe-common') && env.IMAGE_PREFIX_COMMON || env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-${{ matrix.target }}
          tags: |
            type=raw,value=${{ matrix.target }}-amd64-${{ inputs.ros-distro || 'humble' }}-pr${{ github.event.pull_request.number || github.run_id }}
          flavor: |
            latest=false

      - name: Resolve universe-common registry context
        id: contexts
        env:
          ROS_DISTRO: ${{ inputs.ros-distro || 'humble' }}
        run: |
          set -euo pipefail
          distro="${ROS_DISTRO:-humble}"
          # Use stable main-branch tags for universe-common base images.
          # These are updated on every main push by build-all-images.yaml.
          devel_tag="universe-common-devel-amd64-${distro}"
          runtime_tag="universe-common-amd64-${distro}"
          echo "devel_context=docker-image://${IMAGE_PREFIX_COMMON}:${devel_tag}" >> "$GITHUB_OUTPUT"
          echo "runtime_context=docker-image://${IMAGE_PREFIX_COMMON}:${runtime_tag}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Restore BuildKit cache mounts
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: cache-mounts
          key: buildkit-mounts-${{ matrix.target }}-${{ inputs.ros-distro || 'humble' }}-amd64-${{ github.sha }}
          restore-keys: |
            buildkit-mounts-${{ matrix.target }}-${{ inputs.ros-distro || 'humble' }}-amd64-

      - name: Inject BuildKit cache mounts
        uses: ./.github/actions/inject-ccache
        with:
          ros-distro: ${{ inputs.ros-distro || 'humble' }}
          skip-extraction: ${{ steps.cache-restore.outputs.cache-hit }}

      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5
        env:
          ROS_DISTRO: ${{ inputs.ros-distro || 'humble' }}
          UPSTREAM_TAG: ${{ vars.UPSTREAM_TAG }}
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.target }}
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
          load: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.push) }}
          set: |
            *.platform=linux/amd64
            *.args.ROS_DISTRO=${{ inputs.ros-distro || 'humble' }}
            ${{ needs.prepare.outputs.use_local_common != 'true' && format('*.contexts.universe-common-devel={0}', steps.contexts.outputs.devel_context) || '' }}
            ${{ needs.prepare.outputs.use_local_common != 'true' && format('*.contexts.universe-common={0}', steps.contexts.outputs.runtime_context) || '' }}
            ${{ matrix.target == 'carla-interface' && needs.prepare.outputs.use_local_simulator != 'true' && format('carla-interface.args.SIMULATOR_IMAGE={0}:simulator-amd64-{1}', env.IMAGE_PREFIX_COMPONENT, inputs.ros-distro || 'humble') || '' }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-amd64-${{ inputs.ros-distro || 'humble' }}-main

      - name: Scan ${{ matrix.target }} for HIGH and CRITICAL vulnerabilities
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
