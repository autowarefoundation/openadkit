name: deploy-docs

on:
  push:
    branches:
      - main
    paths:
      - mkdocs.yaml
      - install.sh
      - docs/macros.py
      - .github/image-inventory.json
      - docs/requirements.txt
      - "docs/scripts/**"
      - "**/*.md"
      - "**/*.svg"
      - "**/*.png"
      - "**/*.jpg"
      - "docs/assets/**"
      - "docs/overrides/**"
      - "**/*.pages"
      - ".github/actions/build-docs/**"
      - ".github/workflows/deploy-docs.yaml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

# All triggers deploy the same production site, so serialize them globally.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Push to main: builds the latest docs.
          # Release published: builds docs from the release tag (github.ref is
          #   refs/tags/<version>), so the doc page matches the release snapshot.
          # workflow_dispatch: builds from the default branch.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Build docs
        uses: ./.github/actions/build-docs

      - name: Upload production site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-docs-site
          path: site
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download production site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-docs-site
          path: site

      # The root site is the canonical (main) documentation. A release build
      # checks out its own tag, so publishing an older delayed release or a
      # prerelease would roll the public docs backward. Only let a release
      # replace the root site when it is the repository's latest stable release.
      - name: Gate production deploy to the latest stable release
        id: gate
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Prerelease $RELEASE_TAG will not replace the production docs."
            exit 0
          fi
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$RELEASE_TAG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$RELEASE_TAG is not the latest stable release ($latest); leaving production docs unchanged."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        if: github.event_name != 'release' || steps.gate.outputs.skip == 'false'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: site
          branch: gh-pages
          # PR previews (pr-preview.yaml) live on the same branch; don't wipe them.
          clean-exclude: pr-preview
          force: false
