name: deploy-docs

on:
  push:
    branches:
      - main
    paths:
      - mkdocs.yaml
      - docs/macros.py
      - .github/image-inventory.json
      - docs/requirements.txt
      - "docs/scripts/**"
      - "**/*.md"
      - "**/*.svg"
      - "**/*.png"
      - "**/*.jpg"
      - "docs/assets/**"
      - ".github/actions/build-docs/**"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

# All triggers deploy the same production site, so serialize them globally.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The production site is always built from main, regardless of which
          # trigger fired (a release tag may point at an older commit).
          ref: main

      - name: Build docs
        uses: ./.github/actions/build-docs
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: site
          branch: gh-pages
          # PR previews (pr-preview.yaml) live on the same branch; don't wipe them.
          clean-exclude: pr-preview
          force: false
