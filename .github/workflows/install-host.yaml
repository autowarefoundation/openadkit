name: install-host

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'openadkit'
      - 'openadkit.json'
      - 'openadkit.d/**'
      - 'deployments/**'
      - '.github/scripts/tests/test_openadkit_cli.py'
      - '.github/workflows/install-host.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-host:
    name: install-host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test Open AD Kit CLI safety
        run: |
          python3 -m pip install --user pytest
          python3 -m pytest .github/scripts/tests/test_openadkit_cli.py

      - name: Install host dependencies from official packages
        # Force the install path only on this disposable runner so the test
        # cannot pass solely because GitHub's preinstalled Docker works.
        run: |
          env CI=true OPENADKIT_CI_FORCE_DOCKER_INSTALL=true \
            ./openadkit setup --verify

      - name: Validate repository Compose configs
        run: |
          set -euo pipefail
          for ros_distro in humble jazzy; do
            for deployment in planning-simulation scenario-simulation logging-simulation; do
              ./openadkit validate "${deployment}" --ros-distro "${ros_distro}"
            done
            ./openadkit validate logging-simulation \
              --ros-distro "${ros_distro}" --gpu
          done
