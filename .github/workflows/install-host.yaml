name: install-host

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'install.sh'
      - '.github/workflows/install-host.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-host:
    name: install-host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install host dependencies from official packages
        # Force installation only on this disposable runner so the test cannot
        # pass solely because GitHub's preinstalled Docker happens to work.
        run: |
          sudo env CI=true OPENADKIT_CI_FORCE_DOCKER_INSTALL=true \
            ./install.sh --no-nvidia --verify

      - name: Validate repository Compose config
        run: |
          set -euo pipefail
          (
            cd deployments/scenario-simulation
            docker compose \
              --env-file ../base/base.env \
              --env-file scenario-simulation.env \
              config -q
          )
