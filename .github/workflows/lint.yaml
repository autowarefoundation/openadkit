name: lint

on:
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/image-inventory.json'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/*.md'
      - '**/Dockerfile*'
      - '**/*.dockerfile'
      - '**/docker-compose*.yaml'
      - '**/docker-compose*.yml'
      - '**/*.env'
      - 'components/**/*.hcl'
      - 'mkdocs.yaml'
      - 'docs/**/*.yaml'
      - 'docs/**/*.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          severity: error

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          # github-pr-check is fork-safe: on read-only tokens (PRs from forks)
          # reviewdog falls back to GitHub Actions annotations instead of the
          # Review API, which github-pr-review cannot do.
          reporter: github-pr-check
          fail_on_error: true

  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile*
          recursive: true
          config: .hadolint.yaml

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint --format github -c .yamllint.yaml \
            .github/workflows/ \
            .github/actions/ \
            .github/ISSUE_TEMPLATE/ \
            .github/DISCUSSION_TEMPLATE/ \
            .github/dependabot.yaml \
            .github/stale.yml \
            .github/sync-files.yaml \
            deployments/ \
            platforms/ \
            mkdocs.yaml \
            docs/

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run markdownlint
        run: npx --yes markdownlint-cli --config .markdownlint.yaml '**/*.md' '!site/**' '!.git/**'

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Docker Compose v5.2+
        # The ubuntu-latest runner ships an older compose plugin that rejects
        # service overrides after `include:` (used by scenario-simulation).
        # Install the latest release that supports the compose-spec include/merge.
        run: bash .github/scripts/install-compose.sh

      - name: Validate documented Docker Compose files
        # `docker compose config -q` parses, interpolates, and schema-validates
        # each documented stack with its sample env file. It does not pull images.
        run: |
          set -euo pipefail
          # zenoh-bridge requires a non-empty REMOTE_PASSWORD (its .env leaves it
          # blank on purpose); a shell value overrides the blank for validation.
          export REMOTE_PASSWORD="ci-validate"
          fail=0
          validate() {
            local dir="$1"; shift
            echo "::group::${dir} $*"
            if ( cd "${dir}" && docker compose "$@" config -q ); then
              echo "ok: ${dir} $*"
            else
              echo "::error file=${dir}/docker-compose.yaml::invalid docker compose config ($*)"
              fail=1
            fi
            echo "::endgroup::"
          }
          # Deployments sharing the base load ../base/base.env first, then
          # their delta env (last wins). Release packaging concatenates the two so
          # shipped bundles run with a single --env-file.
          validate deployments/planning-simulation --env-file ../base/base.env --env-file planning-simulation.env
          validate deployments/scenario-simulation --env-file ../base/base.env --env-file scenario-simulation.env
          validate deployments/logging-simulation  --env-file ../base/base.env --env-file logging-simulation.env
          validate deployments/logging-simulation  --env-file ../base/base.env --env-file logging-simulation.env --env-file logging-simulation.gpu.env -f docker-compose.yaml -f docker-compose.gpu.yaml
          validate deployments/carla-simulation    --env-file ../base/base.env --env-file carla-simulation.env
          validate deployments/zenoh-bridge          --env-file .env
          exit "${fail}"

  bake-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate bake.hcl parses and COLCON_BASE_PATHS is single-source
        # `docker buildx bake --print` parses the HCL and resolves every target
        # without pulling images. The CPU and CUDA sensing targets must produce
        # the same COLCON_BASE_PATHS value (R4's invariant: a single source of
        # truth for the sensing `--base-paths` list).
        run: |
          set -euo pipefail
          fail=0
          cpu=$(docker buildx bake -f components/docker-bake.hcl --print sensing-perception \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"]["sensing-perception"]["args"]["COLCON_BASE_PATHS"])')
          cuda=$(docker buildx bake -f components/docker-bake.hcl --print sensing-perception-cuda \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"]["sensing-perception-cuda"]["args"]["COLCON_BASE_PATHS"])')
          if [ -z "${cpu}" ]; then
            echo "::error::sensing-perception has no COLCON_BASE_PATHS"
            fail=1
          fi
          if [ -z "${cuda}" ]; then
            echo "::error::sensing-perception-cuda has no COLCON_BASE_PATHS"
            fail=1
          fi
          if [ "${cpu}" != "${cuda}" ]; then
            echo "::error::COLCON_BASE_PATHS diverges between CPU and CUDA sensing targets"
            echo "  cpu:  ${cpu}"
            echo "  cuda: ${cuda}"
            fail=1
          fi
          # Validate that the universe-common-devel target parses cleanly (catches
          # locals-blocks, typo'd function names, missing ARGs, etc.).
          docker buildx bake -f components/docker-bake.hcl --print universe-common-devel \
            > /dev/null
          exit "${fail}"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pytest
        run: pip install pytest

      - name: Run Python tests
        run: pytest .github/scripts/

      - name: Run shell tests
        run: |
          bash .github/actions/combine-multi-arch-images/test-create-manifest.sh
          bash .github/scripts/tests/test_report_manifests.sh
