name: lint

on:
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/workflows/lint.yaml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
