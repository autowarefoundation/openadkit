name: lint

on:
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/image-inventory.json'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/*.md'
      - '**/Dockerfile*'
      - '**/*.dockerfile'
      - '**/docker-compose*.yaml'
      - '**/docker-compose*.yml'
      - '**/*.env'
      - 'mkdocs.yaml'
      - 'docs/**/*.yaml'
      - 'docs/**/*.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          severity: error

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          # github-pr-check is fork-safe: on read-only tokens (PRs from forks)
          # reviewdog falls back to GitHub Actions annotations instead of the
          # Review API, which github-pr-review cannot do.
          reporter: github-pr-check
          fail_on_error: true

  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile*
          recursive: true
          config: .hadolint.yaml

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run yamllint
        uses: reviewdog/action-yamllint@f01d8a48fd8d89f89895499fca2cff09f9e9e8c0 # v1.21.0
        with:
          # github-pr-check is fork-safe: on read-only tokens (PRs from forks)
          # reviewdog falls back to GitHub Actions annotations instead of the
          # Review API, which github-pr-review cannot do.
          reporter: github-pr-check
          fail_on_error: true
          yamllint_flags: >-
            .github/workflows/
            .github/actions/
            .github/ISSUE_TEMPLATE/
            .github/DISCUSSION_TEMPLATE/
            .github/dependabot.yaml
            .github/stale.yml
            .github/sync-files.yaml
            deployments/
            platforms/
            mkdocs.yaml
            docs/

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run markdownlint
        uses: reviewdog/action-markdownlint@3667398db9118d7e78f7a63d10e26ce454ba5f58 # v0.26.2
        with:
          # github-pr-check is fork-safe: on read-only tokens (PRs from forks)
          # reviewdog falls back to GitHub Actions annotations instead of the
          # Review API, which github-pr-review cannot do.
          reporter: github-pr-check
          fail_on_error: true

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Docker Compose v5.2+
        # The ubuntu-latest runner ships an older compose plugin that rejects
        # service overrides after `include:` (used by scenario-simulation).
        # Install the latest release that supports the compose-spec include/merge.
        run: bash .github/scripts/install-compose.sh

      - name: Validate documented Docker Compose files
        # `docker compose config -q` parses, interpolates, and schema-validates
        # each documented stack with its sample env file. It does not pull images.
        run: |
          set -euo pipefail
          # zenoh-bridge requires a non-empty REMOTE_PASSWORD (its .env leaves it
          # blank on purpose); a shell value overrides the blank for validation.
          export REMOTE_PASSWORD="ci-validate"
          fail=0
          validate() {
            local dir="$1"; shift
            echo "::group::${dir} $*"
            if ( cd "${dir}" && docker compose "$@" config -q ); then
              echo "ok: ${dir} $*"
            else
              echo "::error file=${dir}/docker-compose.yaml::invalid docker compose config ($*)"
              fail=1
            fi
            echo "::endgroup::"
          }
          # Samples sharing the deployment base load ../_base/base.env first, then
          # their delta env (last wins). Release packaging concatenates the two so
          # shipped bundles run with a single --env-file.
          validate deployments/samples/planning-simulation --env-file ../_base/base.env --env-file planning-simulation.env
          validate deployments/samples/scenario-simulation --env-file ../_base/base.env --env-file scenario-simulation.env
          validate deployments/samples/logging-simulation  --env-file ../_base/base.env --env-file logging-simulation.env
          validate deployments/samples/logging-simulation  --env-file ../_base/base.env --env-file logging-simulation.env --env-file logging-simulation.gpu.env -f docker-compose.yaml -f docker-compose.gpu.yaml
          validate deployments/samples/carla-simulation    --env-file ../_base/base.env --env-file carla-simulation.env
          validate deployments/demos/zenoh-bridge          --env-file .env
          exit "${fail}"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pytest
        run: pip install pytest

      - name: Run Python tests
        run: pytest .github/scripts/test_resolve_image_matrices.py

      - name: Run shell tests
        run: |
          bash .github/actions/combine-multi-arch-images/test-create-manifest.sh
          bash .github/scripts/test_report_manifests.sh
