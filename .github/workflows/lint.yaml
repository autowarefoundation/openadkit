name: lint

on:
  pull_request:
    paths:
      - '**/*.sh'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/*.md'
      - '**/Dockerfile*'
      - '**/*.dockerfile'
      - '**/docker-compose*.yaml'
      - '**/docker-compose*.yml'
      - 'mkdocs.yaml'
      - 'docs/**/*.yaml'
      - 'docs/**/*.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          severity: error

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          # github-pr-check is fork-safe: on read-only tokens (PRs from forks)
          # reviewdog falls back to GitHub Actions annotations instead of the
          # Review API, which github-pr-review cannot do.
          reporter: github-pr-check
          fail_on_error: true

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile*
          recursive: true
          config: .hadolint.yaml

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run yamllint
        uses: reviewdog/action-yamllint@f01d8a48fd8d89f89895499fca2cff09f9e9e8c0 # v1.21.0
        with:
          # github-pr-check is fork-safe: on read-only tokens (PRs from forks)
          # reviewdog falls back to GitHub Actions annotations instead of the
          # Review API, which github-pr-review cannot do.
          reporter: github-pr-check
          fail_on_error: true
          yamllint_flags: >-
            .github/workflows/
            .github/actions/
            deployments/
            mkdocs.yaml
            docs/

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run markdownlint
        uses: reviewdog/action-markdownlint@3667398db9118d7e78f7a63d10e26ce454ba5f58 # v0.26.2
        with:
          # github-pr-check is fork-safe: on read-only tokens (PRs from forks)
          # reviewdog falls back to GitHub Actions annotations instead of the
          # Review API, which github-pr-review cannot do.
          reporter: github-pr-check
          fail_on_error: true
