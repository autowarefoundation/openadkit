name: lint

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.gitignore'
      - 'openadkit'
      - 'openadkit.d/**'
      - '**/*.sh'
      - '**/*.json'
      - '**/*.json5'
      - '.github/image-inventory.json'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/DISCUSSION_TEMPLATE/**'
      - '.github/dependabot.yaml'
      - '.github/stale.yml'
      - '.github/sync-files.yaml'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/*.md'
      - '**/Dockerfile*'
      - '**/*.dockerfile'
      - '**/docker-compose*.yaml'
      - '**/docker-compose*.yml'
      - '**/*.env'
      - 'deployments/**/*.yaml'
      - 'deployments/**/*.yml'
      - 'platforms/**/*.yaml'
      - 'platforms/**/*.yml'
      - 'components/**/*.hcl'
      - '.hadolint.yaml'
      - '.yamllint.yaml'
      - 'platforms/autosd/x5h/components/nodes/*.py'
      - 'platforms/autosd/x5h/components/nodes/fixtures/*'
      - 'platforms/autosd/x5h/scripts/*.awk'
      - '.github/workflows/lint.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install tools
        run: |
          pip install yamllint pytest
          curl -sSL -o /tmp/actionlint.sh https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash
          bash /tmp/actionlint.sh

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          severity: error

      - name: Run actionlint
        run: ./actionlint

      - name: Run hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile*
          recursive: true
          config: .hadolint.yaml

      - name: Run yamllint
        run: |
          yamllint --format github -c .yamllint.yaml \
            .github/workflows/ \
            .github/actions/ \
            .github/ISSUE_TEMPLATE/ \
            .github/DISCUSSION_TEMPLATE/ \
            .github/dependabot.yaml \
            .github/stale.yml \
            .github/sync-files.yaml \
            deployments/ \
            platforms/

      - name: Install Docker Compose v5.2+
        # The ubuntu-latest runner ships an older compose plugin that rejects
        # service overrides after `include:` (used by scenario-simulation).
        # Install the latest release that supports the compose-spec include/merge.
        run: bash .github/scripts/install-compose.sh

      - name: Validate Docker Compose files
        # `docker compose config -q` parses, interpolates, and schema-validates
        # each documented stack with its sample env file. It does not pull images.
        run: |
          set -euo pipefail
          for ros_distro in humble jazzy; do
            for deployment in planning-simulation scenario-simulation logging-simulation; do
              ./openadkit validate "${deployment}" --ros-distro "${ros_distro}"
            done
            ./openadkit validate logging-simulation \
              --ros-distro "${ros_distro}" --gpu
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate bake.hcl parses and COLCON_BASE_PATHS is single-source
        # `docker buildx bake --print` parses the HCL and resolves every target
        # without pulling images. The CPU and CUDA sensing targets must produce
        # the same COLCON_BASE_PATHS value (R4's invariant: a single source of
        # truth for the sensing `--base-paths` list).
        run: |
          set -euo pipefail
          fail=0
          cpu=$(docker buildx bake -f components/docker-bake.hcl --print sensing-perception \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"]["sensing-perception"]["args"]["COLCON_BASE_PATHS"])')
          cuda=$(docker buildx bake -f components/docker-bake.hcl --print sensing-perception-cuda \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"]["sensing-perception-cuda"]["args"]["COLCON_BASE_PATHS"])')
          if [ -z "${cpu}" ]; then
            echo "::error::sensing-perception has no COLCON_BASE_PATHS"
            fail=1
          fi
          if [ -z "${cuda}" ]; then
            echo "::error::sensing-perception-cuda has no COLCON_BASE_PATHS"
            fail=1
          fi
          if [ "${cpu}" != "${cuda}" ]; then
            echo "::error::COLCON_BASE_PATHS diverges between CPU and CUDA sensing targets"
            echo "  cpu:  ${cpu}"
            echo "  cuda: ${cuda}"
            fail=1
          fi
          # Validate that the universe-common-devel target parses cleanly (catches
          # locals-blocks, typo'd function names, missing ARGs, etc.).
          docker buildx bake -f components/docker-bake.hcl --print universe-common-devel \
            > /dev/null
          exit "${fail}"

      - name: Run Python tests
        run: pytest .github/scripts/

      - name: Run shell tests
        run: |
          bash .github/actions/combine-multi-arch-images/test-create-manifest.sh
          bash .github/scripts/tests/test_report_manifests.sh

  # This job runs every unit test suite under components/nodes: traj_relay's
  # arithmetic, the stop-distance metric awk, and the before/after demo
  # orchestrator's local gates.
  #
  # traj_relay.py downsamples the Autoware trajectory to fit domain 2's
  # MTU 462. That arithmetic is load-bearing -- an off-by-one in the point
  # budget means the CR52 either receives a fragmented sample it cannot
  # reassemble or receives nothing -- and test_traj_relay.py pins it against
  # CDR sizes measured with rclpy's own serialize_message() on the staged
  # arm64 image. The tests need no ROS: traj_relay defers its rclpy imports
  # into main(), so everything exercised is plain Python.
  #
  # test_stop_metrics.py pins scripts/x5h-stop-metrics.awk (the before/after
  # demo's stop-distance measurement) against fixture captures via
  # subprocess, also with no ROS required.
  #
  # test_mrm_demo_gates.py exercises scripts/x5h-mrm-demo.sh's `check`
  # subcommand and its board-free `run` gates (payload validation, argument
  # ordering, the payload_exceeds_extent size check) with ssh/scp stubbed
  # onto PATH so no test can reach the board.
  #
  # Gated here rather than deleted. The file sat in the tree for a while with
  # nothing running it, which is the worst of both worlds -- it reads as
  # coverage while proving nothing, and it rots silently. 44 tests, all
  # passing at the time this comment was last updated -- see `pytest -q`'s
  # own count for the current total, which this comment will again drift
  # from as tests are added.
  x5h-node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pytest
        run: python3 -m pip install --user pytest
        shell: bash

      - name: Run x5h node and metrics unit tests
        run: python3 -m pytest -q
        working-directory: platforms/autosd/x5h/components/nodes
        shell: bash
