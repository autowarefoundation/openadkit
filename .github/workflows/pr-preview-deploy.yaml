name: pr-preview-deploy

on:
  workflow_run:
    workflows: [pr-preview]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  deploy-preview:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: preview-deploy-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted deployment workflow context
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check pull request state
        id: pr-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          state=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .state)
          if [ "${state}" = "open" ]; then
            echo "open=true" >> "${GITHUB_OUTPUT}"
          else
            echo "open=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download preview artifact
        if: steps.pr-state.outputs.open == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pr-preview-site
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy preview
        if: steps.pr-state.outputs.open == 'true'
        id: preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          source-dir: ./site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          action: deploy
          comment: false
          qr-code: false

      - name: Update preview comment
        if: steps.pr-state.outputs.open == 'true'
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2
        with:
          number: ${{ github.event.workflow_run.pull_requests[0].number }}
          header: pr-preview
          message: 'Preview: ${{ steps.preview.outputs.preview-url }}'

      - name: Recheck pull request state
        if: steps.pr-state.outputs.open == 'true'
        id: final-pr-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          state=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .state)
          if [ "${state}" = "open" ]; then
            echo "open=true" >> "${GITHUB_OUTPUT}"
          else
            echo "open=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Remove preview closed during deployment
        if: steps.final-pr-state.outputs.open == 'false'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          action: remove
          comment: false
          qr-code: false

      - name: Remove preview comment closed during deployment
        if: steps.final-pr-state.outputs.open == 'false'
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2
        with:
          number: ${{ github.event.workflow_run.pull_requests[0].number }}
          header: pr-preview
          delete: true

  remove-preview:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted deployment workflow context
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Remove preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ github.event.pull_request.number }}
          action: remove
          comment: false
          qr-code: false

      - name: Remove preview comment
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2
        with:
          number: ${{ github.event.pull_request.number }}
          header: pr-preview
          delete: true
