name: pr-preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - mkdocs.yaml
      - install.sh
      - docs/macros.py
      - .github/image-inventory.json
      - docs/requirements.txt
      - "docs/scripts/**"
      - "**/*.md"
      - "**/*.svg"
      - "**/*.png"
      - "**/*.jpg"
      - "docs/assets/**"
      - "docs/overrides/**"
      - "**/*.pages"
      - ".github/actions/build-docs/**"
      - ".github/workflows/pr-preview.yaml"

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build docs
        uses: ./.github/actions/build-docs
        with:
          allow-stale-release-notes: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-site
          path: site
          retention-days: 1
