permissions:
  contents: read

# Runs a release line's whole release, stable or pre-release, in order: build,
# then scan and evidence, then release. Each step stays its own workflow run on
# the release branch, dispatched here and awaited, so the release gate checks
# the same runs as for manual dispatches and any step can still be rerun on its
# own. A failed step stops the chain; rerun it, then rerun this workflow's
# failed jobs.

name: release-pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenADKit release version (e.g. v1.0.0 or v1.0.0-rc.1)'
        required: true
      build_tag:
        description: 'Build tag of an existing release/X.Y build (e.g. 123456789-1); empty uses the branch head build, starting one if none exists'
        required: false
      default_ros_distro:
        description: 'ROS distro for bare tag aliases; must match openadkit.json defaultRosDistro'
        required: false
        type: choice
        options:
          - humble
          - jazzy
        default: humble

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    outputs:
      build_tag: ${{ steps.tag.outputs.build_tag }}
    steps:
      # Fail rather than skip: a skipped chain would end green with nothing released.
      - name: Require a release branch
        if: ${{ !startsWith(github.ref, 'refs/heads/release/') }}
        run: |
          echo "::error::run release-pipeline on a release/X.Y branch, not ${GITHUB_REF}"
          exit 1

      - name: Check out dispatch script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/dispatch_and_wait.sh
          sparse-checkout-cone-mode: false

      - name: Find the branch head build
        id: find
        if: ${{ inputs.build_tag == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A push to the branch has usually started one already.
          run_id=$(gh run list -R "${GITHUB_REPOSITORY}" --workflow build-all-images.yaml \
            --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" --limit 20 \
            --json databaseId,status,conclusion \
            --jq '[.[] | select(.status != "completed" or .conclusion == "success")][0].databaseId // empty')
          echo "run_id=${run_id}" >>"${GITHUB_OUTPUT}"

      - name: Build
        id: build
        if: ${{ inputs.build_tag == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: bash .github/scripts/dispatch_and_wait.sh build-all-images.yaml

      - name: Resolve build tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TAG: ${{ inputs.build_tag }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          set -euo pipefail
          # The images carry the tag of the attempt that built them: re-running
          # only the failed jobs keeps the first attempt's. Read it from the
          # newest metadata artifact, as evidence does, not from the attempt.
          build_tag=${BUILD_TAG}
          if [ -z "${build_tag}" ]; then
            build_tag=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | .name | select(startswith("build-metadata-")) | ltrimstr("build-metadata-")' \
              | sort -V | tail -n 1)
          fi
          [[ "${build_tag}" =~ ^[0-9]+-[0-9]+$ ]] || { echo "Invalid build tag '${build_tag}'" >&2; exit 1; }
          echo "build_tag=${build_tag}" >>"${GITHUB_OUTPUT}"
          echo "build_tag: ${build_tag}" >>"${GITHUB_STEP_SUMMARY}"

  scan:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out dispatch script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/dispatch_and_wait.sh
          sparse-checkout-cone-mode: false

      - name: Scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TAG: ${{ needs.build.outputs.build_tag }}
        run: bash .github/scripts/dispatch_and_wait.sh scan.yaml "build_tag=${BUILD_TAG}"

  evidence:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out dispatch script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/dispatch_and_wait.sh
          sparse-checkout-cone-mode: false

      - name: Evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TAG: ${{ needs.build.outputs.build_tag }}
        run: bash .github/scripts/dispatch_and_wait.sh evidence.yaml "build_tag=${BUILD_TAG}"

  release:
    needs: [build, scan, evidence]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out dispatch script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/dispatch_and_wait.sh
          sparse-checkout-cone-mode: false

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          BUILD_TAG: ${{ needs.build.outputs.build_tag }}
          DEFAULT_ROS_DISTRO: ${{ inputs.default_ros_distro }}
        run: >-
          bash .github/scripts/dispatch_and_wait.sh release.yaml
          "version=${VERSION}"
          "build_tag=${BUILD_TAG}"
          "default_ros_distro=${DEFAULT_ROS_DISTRO}"
