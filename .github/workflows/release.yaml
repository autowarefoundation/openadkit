# Manually promotes an existing build-all-images run to an OpenADKit release.
# The build records provenance; this workflow only assigns the OpenADKit version
# after validating build metadata, a passing full scan, a passing evidence run,
# and registry digests.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenADKit release version (e.g. v1.0.0 or v1.0.0-rc.1)'
        required: true
      build_tag:
        description: 'Build tag of a build of this branch to promote (e.g. 123456789-1)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX_COMMON: ghcr.io/${{ github.repository_owner }}/openadkit-common
  IMAGE_PREFIX_COMPONENT: ghcr.io/${{ github.repository_owner }}/openadkit

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
      publish_latest_aliases: ${{ steps.validate.outputs.publish_latest_aliases }}
      is_stable_release: ${{ steps.validate.outputs.is_stable_release }}
    steps:
      - name: Check out release scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts/registry_lookup.sh
            .github/scripts/stable_alias_policy.sh
            .github/scripts/validate_release.sh
            .github/scripts/images.py
            openadkit.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release inputs and metadata
        id: validate
        env:
          BUILD_TAG: ${{ inputs.build_tag }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/validate_release.sh
        shell: bash

      - name: Upload validated release metadata
        uses: actions/upload-artifact@v7
        with:
          name: validated-release-${{ inputs.build_tag }}
          path: release-input
          retention-days: 7
          overwrite: true

  package-bundles:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: validate
    permissions:
      actions: read
      contents: read
    outputs:
      packager_sha: ${{ steps.packager.outputs.packager_sha }}
    steps:
      - name: Check out release scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          # Cone mode always includes root files (the openadkit launcher) and
          # rejects leading-slash entries.
          sparse-checkout: |
            .github/scripts/install-compose.sh
            .github/scripts/package_release_bundles.sh
            .github/scripts/release_plan.py
            .github/scripts/autoware_patches.py
            .github/scripts/images.py
            .github/scripts/validation_matrix.py

      - name: Verify packager revision
        id: packager
        env:
          EXPECTED_PACKAGER_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          packager_sha=$(git rev-parse HEAD)
          if [ "${packager_sha}" != "${EXPECTED_PACKAGER_SHA}" ]; then
            echo "Packager checkout ${packager_sha} does not match workflow ${EXPECTED_PACKAGER_SHA}" >&2
            exit 1
          fi
          echo "packager_sha=${packager_sha}" >> "${GITHUB_OUTPUT}"
        shell: bash

      - name: Check out repository at release SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /openadkit
            /openadkit.json
            /cli/
            /components/docker-bake.hcl
            /deployments/
            /.github/autoware-patches/

      - name: Download validated release metadata
        uses: actions/download-artifact@v8
        with:
          name: validated-release-${{ inputs.build_tag }}
          path: release-input

      - name: Install Docker Compose v5.2+
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/install-compose.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Package and validate deployment bundles
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          PACKAGER_SHA: ${{ steps.packager.outputs.packager_sha }}
          INSTALLER_SOURCE_DIR: ${{ github.workspace }}
          PUBLISH_LATEST_ALIASES: ${{ needs.validate.outputs.publish_latest_aliases }}
          STABLE_RELEASE: ${{ needs.validate.outputs.is_stable_release }}
        run: bash .github/scripts/package_release_bundles.sh
        shell: bash

      - name: Upload deployment bundles
        uses: actions/upload-artifact@v7
        with:
          name: release-bundles-${{ inputs.build_tag }}
          path: |
            release-plan.json
            dist/openadkit
            dist/openadkit-${{ inputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [validate, package-bundles]
    environment: release
    permissions:
      actions: read
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out release scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts/manage_github_release.sh
            .github/scripts/promote_release_images.sh
            .github/scripts/registry_lookup.sh
            .github/scripts/stable_alias_policy.sh
            .github/scripts/write_release_notes.sh
            .github/scripts/evidence/report.py
            .github/scripts/evidence/cells.py

      - name: Download validated release metadata
        uses: actions/download-artifact@v8
        with:
          name: validated-release-${{ inputs.build_tag }}
          path: release-input

      - name: Download deployment bundles
        uses: actions/download-artifact@v8
        with:
          name: release-bundles-${{ inputs.build_tag }}
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release metadata and notes
        run: bash .github/scripts/write_release_notes.sh
        shell: bash

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/openadkit
            dist/openadkit-${{ inputs.version }}.tar.gz
            release-plan.json
            release-metadata.json

      - name: Create the draft release
        run: bash .github/scripts/manage_github_release.sh draft
        shell: bash

      - name: Promote image digests
        run: bash .github/scripts/promote_release_images.sh
        shell: bash

      - name: Publish the release
        run: bash .github/scripts/manage_github_release.sh publish
        shell: bash

  deploy-docs:
    needs: [validate, publish]
    if: needs.validate.outputs.is_stable_release == 'true' && needs.validate.outputs.publish_latest_aliases == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-docs.yaml
    with:
      # Default branch, not the dispatch-time SHA or the promoted build tag:
      # the release can outlive main advancing, and publishing an older tree
      # would overwrite the newer docs already on gh-pages.
      source_ref: ${{ github.event.repository.default_branch }}
