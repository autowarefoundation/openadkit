# Manually promotes images from a build-all-images run to a release version.
# This workflow does not rebuild images; it only re-tags existing manifests.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
      build_tag:
        description: 'Build tag to promote (e.g. 123456789-1)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX_COMMON: ghcr.io/${{ github.repository_owner }}/openadkit-common
  IMAGE_PREFIX_COMPONENT: ghcr.io/${{ github.repository_owner }}/openadkit

jobs:
  # =============================================================================
  # Stage 1: Validate inputs before touching anything
  # =============================================================================
  validate:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.get-sha.outputs.sha }}
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format '${VERSION}': must be vX.Y.Z"
            exit 1
          fi

      - name: Validate build_tag format
        env:
          BUILD_TAG: ${{ inputs.build_tag }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$BUILD_TAG" | grep -Eq '^[0-9]+-[0-9]+$'; then
            echo "Invalid build_tag format '${BUILD_TAG}': must be RUN_ID-RUN_ATTEMPT"
            exit 1
          fi

      - name: Check release runs from main branch
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] \
            || (echo "Release must be triggered from main branch (got ${GITHUB_REF})" && exit 1)

      - name: Validate source build run
        id: get-sha
        env:
          BUILD_TAG: ${{ inputs.build_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id="${BUILD_TAG%%-*}"
          run_attempt="${BUILD_TAG##*-}"
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}")

          workflow_name=$(printf '%s' "$run_json" | jq -r '.name')
          workflow_path=$(printf '%s' "$run_json" | jq -r '.path')
          head_branch=$(printf '%s' "$run_json" | jq -r '.head_branch')
          status=$(printf '%s' "$run_json" | jq -r '.status')
          conclusion=$(printf '%s' "$run_json" | jq -r '.conclusion')
          sha=$(printf '%s' "$run_json" | jq -r '.head_sha')

          [ "$workflow_name" = "build-all-images" ] || (echo "Expected build-all-images run, got '${workflow_name}'" && exit 1)
          [ "$workflow_path" = ".github/workflows/build-all-images.yaml" ] || (echo "Unexpected workflow path '${workflow_path}'" && exit 1)
          [ "$head_branch" = "main" ] || (echo "Source build must come from main branch (got '${head_branch}')" && exit 1)
          [ "$status" = "completed" ] || (echo "Source build must be completed (got '${status}')" && exit 1)
          [ "$conclusion" = "success" ] || (echo "Source build must succeed (got '${conclusion}')" && exit 1)

          [ -n "$sha" ] || (echo "Could not resolve SHA for run_id ${run_id} attempt ${run_attempt}" && exit 1)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Check git tag does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${VERSION}" 2>/dev/null; then
            echo "Tag ${VERSION} already exists - aborting to prevent duplicate release"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build_tag images exist in registry
        env:
          BUILD_TAG: ${{ inputs.build_tag }}
          VERSION: ${{ inputs.version }}
          COMMON: ${{ env.IMAGE_PREFIX_COMMON }}
          COMPONENT: ${{ env.IMAGE_PREFIX_COMPONENT }}
        run: |
          set -euo pipefail

          DISTROS="humble jazzy"
          COMMON_VARIANTS="base base-cuda devel devel-cuda"
          COMPONENT_TARGETS="sensing-perception sensing-perception-cuda localization-mapping planning-control vehicle-system api visualizer simulator universe universe-cuda"

          missing=0
          existing=0
          for distro in ${DISTROS}; do
            for variant in ${COMMON_VARIANTS}; do
              source_ref="${COMMON}:${variant}-${distro}-${BUILD_TAG}"
              release_ref="${COMMON}:${variant}-${distro}-${VERSION}"
              if ! docker buildx imagetools inspect "$source_ref" >/dev/null 2>&1; then
                echo "Missing source image: ${source_ref}" >&2
                missing=1
              fi
              if docker buildx imagetools inspect "$release_ref" >/dev/null 2>&1; then
                echo "Release image tag already exists: ${release_ref}" >&2
                existing=1
              fi
            done
            for target in ${COMPONENT_TARGETS}; do
              source_ref="${COMPONENT}:${target}-${distro}-${BUILD_TAG}"
              release_ref="${COMPONENT}:${target}-${distro}-${VERSION}"
              if ! docker buildx imagetools inspect "$source_ref" >/dev/null 2>&1; then
                echo "Missing source image: ${source_ref}" >&2
                missing=1
              fi
              if docker buildx imagetools inspect "$release_ref" >/dev/null 2>&1; then
                echo "Release image tag already exists: ${release_ref}" >&2
                existing=1
              fi
            done
          done

          if [ "$missing" -ne 0 ]; then
            echo "build_tag '${BUILD_TAG}' is incomplete in registry" >&2
            exit 1
          fi
          if [ "$existing" -ne 0 ]; then
            echo "Release image tags for '${VERSION}' already exist" >&2
            exit 1
          fi

  # =============================================================================
  # Stage 2: Promote all images to release tag
  # =============================================================================
  release-images:
    runs-on: ubuntu-22.04
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote all images
        env:
          BUILD_TAG: ${{ inputs.build_tag }}
          VERSION: ${{ inputs.version }}
          COMMON: ${{ env.IMAGE_PREFIX_COMMON }}
          COMPONENT: ${{ env.IMAGE_PREFIX_COMPONENT }}
        run: |
          set -euo pipefail

          DISTROS="humble jazzy"
          COMMON_VARIANTS="base base-cuda devel devel-cuda"
          COMPONENT_TARGETS="sensing-perception sensing-perception-cuda localization-mapping planning-control vehicle-system api visualizer simulator universe universe-cuda"

          for distro in ${DISTROS}; do
            for variant in ${COMMON_VARIANTS}; do
              echo "Promoting ${COMMON}:${variant}-${distro}-${BUILD_TAG} → ${VERSION}"
              docker buildx imagetools create \
                -t "${COMMON}:${variant}-${distro}-${VERSION}" \
                "${COMMON}:${variant}-${distro}-${BUILD_TAG}"
            done
            for target in ${COMPONENT_TARGETS}; do
              echo "Promoting ${COMPONENT}:${target}-${distro}-${BUILD_TAG} → ${VERSION}"
              docker buildx imagetools create \
                -t "${COMPONENT}:${target}-${distro}-${VERSION}" \
                "${COMPONENT}:${target}-${distro}-${BUILD_TAG}"
            done
          done

  # =============================================================================
  # Stage 3: Create git tag and GitHub Release
  # =============================================================================
  release-github:
    runs-on: ubuntu-22.04
    needs: [validate, release-images]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create git tag
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${process.env.VERSION}`,
              sha: process.env.RELEASE_SHA
            })
            console.log(`Created tag ${process.env.VERSION} at ${process.env.RELEASE_SHA}`)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "OpenADKit $VERSION" \
            --generate-notes
