# Manually promotes an existing build-all-images run to an Open AD Kit release.
# The build records provenance; this workflow only assigns the Open AD Kit version
# after validating build metadata, a passing full scan, a passing evidence run,
# and registry digests.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Open AD Kit release version (e.g. v2.0.0 or v2.0.0-rc.1)'
        required: true
      build_tag:
        description: 'Build tag of a build of this branch to promote (e.g. 123456789-1)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/openadkit

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
      publish_latest_aliases: ${{ steps.validate.outputs.publish_latest_aliases }}
      is_stable_release: ${{ steps.validate.outputs.is_stable_release }}
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts/registry_lookup.sh
            .github/scripts/stable_alias_policy.sh
            .github/scripts/validate_release.sh
            .github/scripts/images.py
            openadkit.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release inputs and metadata
        id: validate
        env:
          BUILD_TAG: ${{ inputs.build_tag }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/validate_release.sh
        shell: bash

      - name: Upload validated release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-release-${{ inputs.build_tag }}
          path: release-input
          retention-days: 7
          overwrite: true

  package-bundles:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: validate
    permissions:
      actions: read
      contents: read
    steps:
      # The build commit packages itself: its own scripts made the tree its
      # evidence ran, so they make the bundle too. Validation above stays with
      # the branch's scripts.
      - name: Check out repository at release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /openadkit
            /openadkit.json
            /cli/
            /components/docker-bake.hcl
            /deployments/
            /.github/autoware-patches/
            /.github/scripts/

      - name: Download validated release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-release-${{ inputs.build_tag }}
          path: release-input

      - name: Install Docker Compose 5.0+
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash src/.github/scripts/install-compose.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Package and validate deployment bundles
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          PUBLISH_LATEST_ALIASES: ${{ needs.validate.outputs.publish_latest_aliases }}
          STABLE_RELEASE: ${{ needs.validate.outputs.is_stable_release }}
        run: bash src/.github/scripts/package_release_bundles.sh
        shell: bash

      - name: Upload deployment bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundles-${{ inputs.build_tag }}
          path: |
            release-plan.json
            dist/openadkit
            dist/openadkit-${{ inputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [validate, package-bundles]
    environment: release
    permissions:
      actions: read
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/scripts/images.py
            .github/scripts/manage_github_release.sh
            .github/scripts/promote_release_images.sh
            .github/scripts/registry_lookup.sh
            .github/scripts/stable_alias_policy.sh
            .github/scripts/validate_release.sh
            .github/scripts/write_release_notes.sh
            .github/scripts/release_notes.py
            .github/scripts/evidence/report.py
            .github/scripts/evidence/cells.py
            .github/release-highlights

      - name: Download validated release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-release-${{ inputs.build_tag }}
          path: release-input

      - name: Download deployment bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundles-${{ inputs.build_tag }}
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check scan and evidence again
        env:
          BUILD_TAG: ${{ inputs.build_tag }}
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/validate_release.sh --recheck
        shell: bash

      - name: Create release metadata and notes
        run: bash .github/scripts/write_release_notes.sh
        shell: bash

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/openadkit
            dist/openadkit-${{ inputs.version }}.tar.gz
            release-metadata.json

      - name: Create the draft release
        run: bash .github/scripts/manage_github_release.sh draft
        shell: bash

      - name: Promote image digests
        run: bash .github/scripts/promote_release_images.sh
        shell: bash

      - name: Publish the release
        run: bash .github/scripts/manage_github_release.sh publish
        shell: bash

  deploy-docs:
    needs: [validate, publish]
    if: needs.validate.outputs.is_stable_release == 'true' && needs.validate.outputs.publish_latest_aliases == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-docs.yaml
    with:
      # Default branch, not the dispatch-time SHA or the promoted build tag:
      # the release can outlive main advancing, and publishing an older tree
      # would overwrite the newer docs already on gh-pages.
      source_ref: ${{ github.event.repository.default_branch }}
