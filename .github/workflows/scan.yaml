permissions:
  contents: read

# Full image scan of a build-all-images run: after every successful build of
# main or a maintenance branch, weekly for main's latest build so new
# vulnerabilities surface without a rebuild, or by dispatch for any build_tag.
# A successful scan metadata artifact makes a build promotable.

name: scan-images

on:
  workflow_run:
    workflows: [build-all-images]
    types: [completed]
    branches: [main, 'release/*']
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      build_tag:
        description: 'Build tag to scan (e.g. 123456789-1)'
        required: true

concurrency:
  group: scan-images-${{ github.event_name == 'workflow_dispatch' && inputs.build_tag || github.event_name == 'workflow_run' && format('{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || github.run_id }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      build_tag: ${{ steps.prepare.outputs.build_tag }}
      policy_sha: ${{ steps.prepare.outputs.policy_sha }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Check out trusted metadata policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts/images.py
          sparse-checkout-cone-mode: false

      - name: Resolve build metadata
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_BUILD_TAG: ${{ inputs.build_tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            run_id=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow build-all-images.yaml --branch main \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "${run_id}" ] || { echo "main has no successful build to scan" >&2; exit 1; }
          fi
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            run_id="${run_id:-${{ github.event.workflow_run.id }}}"
            # "Re-run failed jobs" keeps the first attempt's tag; read it from
            # the newest metadata artifact instead of this attempt's number.
            build_tag=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | .name | select(startswith("build-metadata-")) | ltrimstr("build-metadata-")' \
              | sort -V | tail -n 1)
            [ -n "${build_tag}" ] || { echo "Build run ${run_id} has no build metadata artifact" >&2; exit 1; }
          else
            build_tag="${DISPATCH_BUILD_TAG}"
            if ! printf '%s\n' "${build_tag}" | grep -Eq '^[0-9]+-[0-9]+$'; then
              echo "Invalid build_tag '${build_tag}': must be RUN_ID-RUN_ATTEMPT" >&2
              exit 1
            fi
            run_id="${build_tag%%-*}"
          fi

          mkdir -p build-metadata
          gh run download "${run_id}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "build-metadata-${build_tag}" \
            --dir build-metadata

          policy_sha=$(jq -r '.openadkit_sha' build-metadata/build-metadata.json)
          if ! printf '%s\n' "${policy_sha}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid OpenADKit SHA in build metadata: ${policy_sha}" >&2
            exit 1
          fi

          matrix=$(python3 .github/scripts/images.py scan-matrix build-metadata/build-metadata.json)

          {
            echo "build_tag=${build_tag}"
            echo "policy_sha=${policy_sha}"
            echo "matrix=${matrix}"
          } >> "$GITHUB_OUTPUT"
        shell: bash

  scan:
    needs: prepare
    runs-on: ${{ vars.RUNNER_AMD64 || 'ubuntu-22.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.policy_sha }}
          sparse-checkout: .trivyignore
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan ${{ matrix.target }}-${{ matrix.ros_distro }} (${{ matrix.platform }})
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ matrix.image_ref }}
          format: sarif
          output: trivy-${{ matrix.target }}-${{ matrix.ros_distro }}-${{ matrix.platform_label }}.sarif
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln,secret
          timeout: 15m
          trivyignores: .trivyignore
          limit-severities-for-sarif: true

      - name: Retry scan after transient failure
        id: trivy-retry
        if: ${{ steps.trivy-scan.outcome == 'failure' && hashFiles(format('trivy-{0}-{1}-{2}.sarif', matrix.target, matrix.ros_distro, matrix.platform_label)) == '' }}
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ matrix.image_ref }}
          format: sarif
          output: trivy-${{ matrix.target }}-${{ matrix.ros_distro }}-${{ matrix.platform_label }}.sarif
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln,secret
          timeout: 15m
          trivyignores: .trivyignore
          limit-severities-for-sarif: true

      - name: Fail on vulnerability findings
        if: ${{ steps.trivy-scan.outcome == 'failure' && steps.trivy-retry.outcome != 'success' }}
        run: exit 1

      - name: Upload scan results to GitHub Security
        if: ${{ always() && hashFiles(format('trivy-{0}-{1}-{2}.sarif', matrix.target, matrix.ros_distro, matrix.platform_label)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.target }}-${{ matrix.ros_distro }}-${{ matrix.platform_label }}.sarif
          category: ${{ matrix.target }}-${{ matrix.ros_distro }}-${{ matrix.platform_label }}

  publish-metadata:
    needs: [prepare, scan]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted metadata policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts/images.py
          sparse-checkout-cone-mode: false

      - name: Write scan metadata
        env:
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          POLICY_SHA: ${{ needs.prepare.outputs.policy_sha }}
          SCAN_RESULT: ${{ needs.scan.result }}
          SCAN_MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: python3 .github/scripts/images.py scan-report
        shell: bash

      - name: Upload scan metadata
        uses: actions/upload-artifact@v7
        with:
          name: scan-metadata-${{ needs.prepare.outputs.build_tag }}
          path: scan-metadata/scan-metadata.json
          retention-days: 90

      - name: Fail if full scan failed
        if: needs.scan.result != 'success'
        run: exit 1

  notify-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, scan, publish-metadata]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly image scan failed (${new Date().toISOString().split('T')[0]})`,
              body: [
                '**The weekly scan of main\'s latest build failed.**',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            })
