# This file is automatically synced from:
# https://github.com/autowarefoundation/sync-file-templates
# To make changes, update the source repository and follow the guidelines in its README.

name: semantic-pull-request

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-pull-request:
    # timeout-minutes cannot be set on jobs that call a reusable workflow
    # (actionlint enforces this); the upstream workflow controls its own
    # timeout, so the 6-hour GHA default is fine for this sync'd template.
    uses: autowarefoundation/autoware-github-actions/.github/workflows/semantic-pull-request.yaml@v1
