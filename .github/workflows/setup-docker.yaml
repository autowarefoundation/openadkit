name: setup-docker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'setup.sh'
      - '.github/workflows/setup-docker.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup-docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run setup script
        # Validate the non-NVIDIA path, which covers the majority of samples
        # (planning, scenario, logging). NVIDIA installs add ~30-60s of apt
        # traffic and can flake on network; the GPU path is exercised by the
        # build-all-images and compose-config jobs downstream.
        run: |
          ./setup.sh --no-nvidia
