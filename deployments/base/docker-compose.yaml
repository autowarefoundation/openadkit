# Open AD Kit deployment base.
#
# Shared Autoware services. Deployment Compose files include this and add
# only service-level differences. Image refs use
# `${COMPONENT_IMAGE:-<default>}` so the registry+tag lives here once; override a
# COMPONENT_IMAGE var (e.g. for CUDA images) to swap an image without editing this
# file. Do not run this file directly — run a deployment, which includes it.
#
# Container ROS/DDS env: ./runtime.env via env_file. Each deployment supplies
# one complete config.env for Compose interpolation.
services:
  # Fail fast when MAP_PATH is empty or missing required files (replaces the
  # former map-init oneshot). Depends on deployment data already published.
  map-check:
    image: ${LOCALIZATION_MAPPING_IMAGE:-ghcr.io/autowarefoundation/openadkit:localization-mapping}
    container_name: autoware-map-check
    network_mode: host
    init: true
    volumes:
      - type: bind
        source: ${MAP_PATH}
        target: /autoware_map
        read_only: true
        bind:
          create_host_path: false
    entrypoint: ["bash", "-lc"]
    command:
      - |
        set -euo pipefail
        missing=0
        for f in "${LANELET2_MAP_FILE}" "${POINTCLOUD_MAP_FILE}"; do
          if [[ ! -s "/autoware_map/$${f}" ]]; then
            echo "map-check: missing or empty /autoware_map/$${f} (MAP_PATH on host)" >&2
            missing=1
          fi
        done
        if [[ "$${missing}" -ne 0 ]]; then
          echo "map-check: fetch sample data with ./openadkit fetch <deployment>" >&2
          exit 1
        fi
        echo "map-check: ok (${LANELET2_MAP_FILE}, ${POINTCLOUD_MAP_FILE})"
    restart: "no"

  map:
    image: ${LOCALIZATION_MAPPING_IMAGE:-ghcr.io/autowarefoundation/openadkit:localization-mapping}
    container_name: autoware-map
    network_mode: host
    init: true
    ipc: host
    env_file:
      - ./runtime.env
    volumes:
      - type: bind
        source: ${MAP_PATH}
        target: /autoware_map
        read_only: true
        bind:
          create_host_path: false
      - ./cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    depends_on:
      map-check:
        condition: service_completed_successfully
    command: >
      ros2 launch autoware_launch tier4_map_component.launch.xml
      lanelet2_map_file:=${LANELET2_MAP_FILE}
      map_path:=/autoware_map
      pointcloud_map_file:=${POINTCLOUD_MAP_FILE}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  planning:
    image: ${PLANNING_CONTROL_IMAGE:-ghcr.io/autowarefoundation/openadkit:planning-control}
    container_name: autoware-planning
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ./runtime.env
    volumes:
      - ./cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    depends_on:
      - map
    command: >
      ros2 launch autoware_launch tier4_planning_component.launch.xml
      component_wise_launch:=true
      enable_all_modules_auto_mode:=${ENABLE_ALL_MODULES_AUTO_MODE}
      is_simulation:=${IS_SIMULATION_MODE}
      module_preset:=${PLANNING_MODULE_PRESET}
      pointcloud_container_name:=${POINTCLOUD_CONTAINER_NAME}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  vehicle:
    image: ${VEHICLE_SYSTEM_IMAGE:-ghcr.io/autowarefoundation/openadkit:vehicle-system}
    container_name: autoware-vehicle
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ./runtime.env
    volumes:
      - ./cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    depends_on:
      - map
    command: >
      ros2 launch tier4_vehicle_launch vehicle.launch.xml
      launch_vehicle_interface:=${LAUNCH_VEHICLE_INTERFACE}
      raw_vehicle_cmd_converter_param_path:=/opt/autoware/autoware_launch/share/autoware_launch/config/vehicle/raw_vehicle_cmd_converter/raw_vehicle_cmd_converter.param.yaml
      sensor_model:=${SENSOR_MODEL}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_id:=${VEHICLE_ID}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  system:
    image: ${VEHICLE_SYSTEM_IMAGE:-ghcr.io/autowarefoundation/openadkit:vehicle-system}
    container_name: autoware-system
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ./runtime.env
    volumes:
      - ./cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    depends_on:
      - map
    command: >
      ros2 launch autoware_launch tier4_system_component.launch.xml
      diagnostic_graph_aggregator_graph_path:=/opt/autoware/autoware_launch/share/autoware_launch/config/system/diagnostics/autoware-main.yaml
      launch_system_monitor:=${LAUNCH_SYSTEM_MONITOR}
      launch_dummy_diag_publisher:=${LAUNCH_DUMMY_DIAG_PUBLISHER}
      sensor_model:=${SENSOR_MODEL}
      system_run_mode:=${SYSTEM_RUN_MODE}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  control:
    image: ${PLANNING_CONTROL_IMAGE:-ghcr.io/autowarefoundation/openadkit:planning-control}
    container_name: autoware-control
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ./runtime.env
    volumes:
      - ./cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      - ./config/vehicle_cmd_gate.param.yaml:/opt/autoware/autoware_vehicle_cmd_gate/share/autoware_vehicle_cmd_gate/config/vehicle_cmd_gate.param.yaml:ro
      - ./config/vehicle_cmd_gate.param.yaml:/opt/autoware/autoware_launch/share/autoware_launch/config/control/vehicle_cmd_gate/vehicle_cmd_gate.param.yaml:ro
    depends_on:
      - map
      - planning
      - system
    command: >
      ros2 launch autoware_launch tier4_control_component.launch.xml
      check_external_emergency_heartbeat:=${CHECK_EXTERNAL_EMERGENCY_HEARTBEAT}
      component_wise_launch:=true
      lateral_controller_mode:=${LATERAL_CONTROLLER_MODE}
      longitudinal_controller_mode:=${LONGITUDINAL_CONTROLLER_MODE}
      module_preset:=${CONTROL_MODULE_PRESET}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_id:=${VEHICLE_ID}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  api:
    image: ${API_IMAGE:-ghcr.io/autowarefoundation/openadkit:api}
    container_name: autoware-api
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ./runtime.env
    volumes:
      - ./cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    depends_on:
      - map
    command: >
      ros2 launch autoware_launch tier4_autoware_api_component.launch.xml
      component_wise_launch:=true
      scenario_simulation:=${SCENARIO_SIMULATION}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  visualizer:
    image: ${VISUALIZER_IMAGE:-ghcr.io/autowarefoundation/openadkit:visualizer}
    container_name: autoware-visualizer
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    depends_on:
      - map
    # Note: `ports:` is ignored under `network_mode: host`. Websockify binds
    # to loopback by default (`WEBSOCKIFY_BIND=127.0.0.1`). To expose noVNC
    # remotely, set WEBSOCKIFY_BIND=0.0.0.0 and front the port with an
    # authenticated reverse proxy.
    env_file:
      - ./runtime.env
    environment:
      - RVIZ_CONFIG=${RVIZ_CONFIG}
      - USE_SIM_TIME=${USE_SIM_TIME}
      - REMOTE_DISPLAY=${REMOTE_DISPLAY}
      - REMOTE_PASSWORD=${REMOTE_PASSWORD}
    volumes:
      - ./cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    restart: on-failure
