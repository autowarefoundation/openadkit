# The Autoware role's services for CARLA simulation.
#
# Shared by the single-host compose.yaml (which restores
# the carla-interface edges) and the `--role autoware` view (this file plus
# compose.zenoh.yaml). No service here depends on a CARLA service: the
# sim-local edges are added back only by the default entry file. A kit that
# brings its own simulator includes this file, and
# ../shared/services/visualizer.yaml where it wants RViz.
include:
  - ../shared/services/map.yaml
  - ../shared/services/system.yaml
  - ../shared/services/sensing.yaml
  - ../shared/services/perception.yaml
  - ../shared/services/localization.yaml
  - ../shared/services/planning.yaml
  - ../shared/services/vehicle.yaml
  - ../shared/services/control.yaml
  - ../shared/services/api.yaml

services:
  # SYSTEM_DIAGNOSTICS_GRAPH=autoware-carla.yaml (settings.env) selects the
  # CARLA diagnostics graph; the shared system definition is unchanged.
  system:
    depends_on:
      - map

  sensing:
    depends_on:
      - map
      - system

  perception:
    image: ${SENSING_PERCEPTION_GPU_IMAGE:?set by the openadkit CLI}
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    depends_on:
      - map
      - sensing
      - system

  localization:
    depends_on:
      - map
      - sensing
      - perception
      - system

  planning:
    depends_on:
      - map
      - localization
      - perception
      - system

  vehicle:
    depends_on:
      - map

  control:
    depends_on:
      - map
      - planning
      - system

  api:
    depends_on:
      - map
      - system
