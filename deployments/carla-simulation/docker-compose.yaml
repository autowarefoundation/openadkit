# CARLA simulation — single-host graph.
#
# Assembles the shared Autoware and CARLA service files and restores the
# single-host wiring: vehicle/sensing/visualizer wait on carla-interface. The
# split views remove those edges: --role autoware / --role carla select one
# service file plus the base Zenoh fragment. This file never includes the
# Zenoh bridge.
include:
  - services.autoware.yaml
  - services.carla.yaml

services:
  vehicle:
    depends_on:
      - carla-interface

  sensing:
    depends_on:
      - carla-interface

  visualizer:
    depends_on:
      - carla-interface
