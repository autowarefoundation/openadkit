# CARLA simulation — single-host graph.
#
# Assembles the shared Autoware and CARLA service files and restores the
# single-host wiring: vehicle/sensing/visualizer wait on carla-interface. The
# split views remove those edges: --node autoware / --node carla select one
# compose.<node>.yaml entrypoint with an explicit bridge. This file never includes the
# Zenoh bridge.
#
# Compose replaces depends_on on merge, so the default view restates the
# Autoware edges plus the carla-interface edges.
include:
  - services.autoware.yaml
  - services.carla.yaml

services:
  # Like every Autoware launch, carla-interface joins map's PID namespace so its
  # /launch_ros_<PID> node is unique (../shared/services/map.yaml). The
  # --node carla view has no map and keeps its own namespace.
  carla-interface:
    pid: service:map

  vehicle:
    depends_on:
      - map
      - carla-interface

  sensing:
    depends_on:
      - map
      - carla-interface
      - system

  visualizer:
    depends_on:
      - map
      - api
      - planning
      - control
      - carla-interface
