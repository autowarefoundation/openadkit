# CARLA simulation — Autoware closed loop against CARLA 0.9.16 (Humble, amd64,
# GPU required).
#
# Service definitions live in ../shared/services/<service>.yaml (one file per service).
# This file selects the stack, owns its topology (depends_on), moves
# sensing/perception onto the CUDA images, and adds the CARLA-only services.
include:
  - ../shared/services/map-check.yaml
  - ../shared/services/map.yaml
  - ../shared/services/system.yaml
  - ../shared/services/sensing.yaml
  - ../shared/services/localization.yaml
  - ../shared/services/planning.yaml
  - ../shared/services/vehicle.yaml
  - ../shared/services/control.yaml
  - ../shared/services/api.yaml
  - ../shared/services/visualizer.yaml

services:
  map:
    depends_on:
      map-check:
        condition: service_completed_successfully

  # SYSTEM_DIAGNOSTICS_GRAPH=autoware-carla.yaml (config.env) selects the
  # CARLA diagnostics graph; the shared system definition is unchanged.
  system:
    depends_on:
      - map

  sensing:
    image: ${SENSING_PERCEPTION_GPU_IMAGE:-ghcr.io/autowarefoundation/openadkit:sensing-perception-cuda}
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    depends_on:
      - map
      - carla-interface
      - system

  # CARLA's perception takes a different set of launch arguments (it adds
  # use_empty_dynamic_object_publisher), so it is defined here rather than
  # included from ../shared/services/perception.yaml.
  perception:
    image: ${SENSING_PERCEPTION_GPU_IMAGE:-ghcr.io/autowarefoundation/openadkit:sensing-perception-cuda}
    container_name: autoware-perception
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    runtime: nvidia
    env_file:
      - ../shared/runtime.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ${DATA_PATH}:/autoware_data:rw
      - ../shared/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    depends_on:
      - map
      - sensing
      - system
    command: >
      ros2 launch autoware_launch tier4_perception_component.launch.xml
      data_path:=/autoware_data
      launch_pointcloud_container:=${LAUNCH_POINTCLOUD_CONTAINER_PERCEPTION}
      lidar_detection_model:=${LIDAR_DETECTION_MODEL}
      occupancy_grid_map_method:=${OCCUPANCY_GRID_MAP_METHOD}
      perception_mode:=${PERCEPTION_MODE}
      pointcloud_container_name:=${POINTCLOUD_CONTAINER_NAME}
      use_empty_dynamic_object_publisher:=${AUTOWARE_E2E_EMPTY_OBJECTS}
      use_sim_time:=${USE_SIM_TIME}
      use_traffic_light_recognition:=${AUTOWARE_E2E_USE_TRAFFIC_LIGHT_RECOGNITION}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  localization:
    depends_on:
      - map
      - sensing
      - perception
      - system

  planning:
    depends_on:
      - map
      - localization
      - perception
      - system

  vehicle:
    depends_on:
      - map
      - carla-interface

  control:
    depends_on:
      - map
      - planning
      - system

  api:
    depends_on:
      - map
      - system

  # The visualizer renders CARLA on the GPU, so it needs the graphics caps.
  visualizer:
    container_name: autoware-e2e-visualizer
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,compute,utility,display
      - RVIZ_GPU=auto
    depends_on:
      - map
      - api
      - planning
      - control
      - carla-interface

  # CARLA-only services.
  carla:
    image: ${CARLA_CONTAINER_IMAGE:-carlasim/carla:0.9.16@sha256:aaf1df22702780ece072069e23d03c4879b002ae028c79744b09c4c7ddbae953}
    container_name: ${CARLA_CONTAINER_NAME}
    network_mode: host
    init: true
    ipc: host
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    command: >
      /bin/bash ./CarlaUE4.sh
      ${CARLA_RENDER_ARGS}
      -nosound
      -quality-level=${CARLA_QUALITY}
      -carla-rpc-port=${CARLA_RPC_PORT}
      -world-port=${CARLA_WORLD_PORT}
      -stdout
      -FullStdOutLogOutput
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/${CARLA_RPC_PORT}'"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 30s
    restart: on-failure

  carla-interface:
    image: ${CARLA_INTERFACE_IMAGE:-ghcr.io/autowarefoundation/openadkit:carla-interface}
    container_name: ${CARLA_INTERFACE_CONTAINER}
    network_mode: host
    init: true
    ipc: host
    env_file:
      - ../shared/runtime.env
    volumes:
      - ../shared/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      - ./sensor_mapping.yaml:/autoware_config/sensor_mapping.yaml:ro
    depends_on:
      carla:
        condition: service_healthy
        restart: true
      carla-map-loader:
        condition: service_completed_successfully
        restart: true
    command: >
      ros2 launch autoware_carla_interface autoware_carla_interface.launch.xml
      host:=${CARLA_RPC_HOST}
      port:=${CARLA_RPC_PORT}
      timeout:=${CARLA_LOAD_TIMEOUT}
      carla_map:=${CARLA_WORLD}
      sensor_kit_name:=carla_sensor_kit_description
      sensor_mapping_file:=/autoware_config/sensor_mapping.yaml
    restart: on-failure

  carla-map-loader:
    image: ${CARLA_INTERFACE_IMAGE:-ghcr.io/autowarefoundation/openadkit:carla-interface}
    container_name: ${CARLA_MAP_LOADER_CONTAINER}
    network_mode: host
    init: true
    ipc: host
    environment:
      - CARLA_RPC_HOST=${CARLA_RPC_HOST}
      - CARLA_RPC_PORT=${CARLA_RPC_PORT}
      - CARLA_WORLD=${CARLA_WORLD}
      - CARLA_LOAD_TIMEOUT=${CARLA_LOAD_TIMEOUT}
    volumes:
      - ./load-carla-map.py:/autoware_config/load-carla-map.py:ro
    depends_on:
      carla:
        condition: service_healthy
    command: python3 /autoware_config/load-carla-map.py
    restart: "no"
