# CARLA-side services for carla simulation.
#
# Shared by the single-host entry point (docker-compose.yaml) and the
# `--role carla` view (this file plus deployments/base/compose.zenoh.yaml,
# attached by the CLI). All cross-service edges here are sim-local
# (carla-interface waits on CARLA and the map loader), so they stay in this
# file. CARLA RPC and map loading are host-local and never cross Zenoh. No
# pid: service:map: the CARLA host has no map service.
services:
  carla:
    image: ${CARLA_CONTAINER_IMAGE:-carlasim/carla:0.9.16@sha256:aaf1df22702780ece072069e23d03c4879b002ae028c79744b09c4c7ddbae953}
    container_name: ${CARLA_CONTAINER_NAME}
    network_mode: host
    init: true
    ipc: host
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    command: >
      /bin/bash ./CarlaUE4.sh
      ${CARLA_RENDER_ARGS}
      -nosound
      -quality-level=${CARLA_QUALITY}
      -carla-rpc-port=${CARLA_RPC_PORT}
      -world-port=${CARLA_WORLD_PORT}
      -stdout
      -FullStdOutLogOutput
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/${CARLA_RPC_PORT}'"]
      interval: 5s
      timeout: 2s
      retries: 60
      start_period: 30s
    restart: on-failure

  carla-interface:
    image: ${CARLA_INTERFACE_IMAGE:-ghcr.io/autowarefoundation/openadkit:carla-interface-amd64-humble}
    container_name: ${CARLA_INTERFACE_CONTAINER}
    network_mode: host
    init: true
    ipc: host
    env_file:
      - ../base/runtime.env
    volumes:
      - ../base/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      - ./sensor_mapping.yaml:/autoware_config/sensor_mapping.yaml:ro
    depends_on:
      carla:
        condition: service_healthy
        restart: true
      carla-map-loader:
        condition: service_completed_successfully
        restart: true
    command: >
      ros2 launch autoware_carla_interface autoware_carla_interface.launch.xml
      host:=${CARLA_RPC_HOST}
      port:=${CARLA_RPC_PORT}
      timeout:=${CARLA_LOAD_TIMEOUT}
      carla_map:=${CARLA_WORLD}
      sensor_kit_name:=carla_sensor_kit_description
      sensor_mapping_file:=/autoware_config/sensor_mapping.yaml
    restart: on-failure

  carla-map-loader:
    image: ${CARLA_INTERFACE_IMAGE:-ghcr.io/autowarefoundation/openadkit:carla-interface-amd64-humble}
    container_name: ${CARLA_MAP_LOADER_CONTAINER}
    network_mode: host
    init: true
    ipc: host
    environment:
      - CARLA_RPC_HOST=${CARLA_RPC_HOST}
      - CARLA_RPC_PORT=${CARLA_RPC_PORT}
      - CARLA_WORLD=${CARLA_WORLD}
      - CARLA_LOAD_TIMEOUT=${CARLA_LOAD_TIMEOUT}
    volumes:
      - ./load-carla-map.py:/autoware_config/load-carla-map.py:ro
    depends_on:
      carla:
        condition: service_healthy
    command: python3 /autoware_config/load-carla-map.py
    restart: "no"
