# Spec-QoS conformance: a lone provider whose offered QoS is exactly the QoS the fixture spec
# manifest declares for the interface (reliable / volatile), so no QOS_SPEC_MISMATCH row is
# produced and the set is admitted (exit 0).
#
# The control for the two rejection sets: compose.qos-reject.yaml deviates from the spec in the
# weaker direction and compose.qos-stronger.yaml in the stronger one, and each uses a provider
# manifest identical to this one but for that single field. Together the three sets pin the semantics
# to exact matching -- this one shows conformance is admitted, qos-stronger shows a deviation an
# ordering rule would have admitted is still rejected -- under the same tool image and spec manifest.
services:
  provider:
    image: autoware-admission-self-test-qos-provider-conformant
