x-scenario-simulator-image: &scenario-simulator-image ghcr.io/tier4/scenario_simulator_v2:humble-25.0.20-runtime

services:
  autoware:
    image: ghcr.io/autowarefoundation/autoware:universe
    volumes:
      - ${MAP_PATH}:/autoware_map:ro
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
      ros2 launch autoware_launch planning_simulator.launch.xml
      map_path:=/autoware_map
      vehicle_model:=sample_vehicle
      sensor_model:=sample_sensor_kit
      scenario_simulation:=${SCENARIO_SIMULATION:-true}
      rviz:=false"
    depends_on:
      edge_zenoh_bridge:
        condition: service_started

  scenario_simulator:
    image: *scenario-simulator-image
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
    command:
      - bash
      - -lc
      - |
        set -e
        exec ros2 launch scenario_test_runner scenario_test_runner.launch.py \
          architecture_type:=awf/universe/20250130 \
          global_frame_rate:=30 \
          global_timeout:=180 \
          initialize_duration:=90 \
          launch_autoware:=false \
          launch_rviz:=false \
          launch_visualization:=false \
          output_directory:=/autoware/scenario-sim/output \
          record:=false \
          scenario:="$(ros2 pkg prefix --share scenario_test_runner)/scenario/sample.yaml" \
          sensor_model:=sample_sensor_kit \
          use_custom_centerline:=true \
          use_sim_time:=false \
          vehicle_model:=sample_vehicle
    depends_on:
      autoware:
        condition: service_started
      edge_zenoh_bridge:
        condition: service_started

  edge_zenoh_bridge:
    image: eclipse/zenoh-bridge-ros2dds:latest
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=0
    volumes:
      - ./config:/config
    command: >
      -l tcp/0.0.0.0:7447
      -e tcp/${CLOUD_IP:-cloud_zenoh_bridge}:7448
      -c /config/zenoh-bridge-ros2dds.json5

  visualizer:
    image: ghcr.io/autowarefoundation/openadkit:visualizer
    # Uses bridge networking (port-mapped) to allow access from the host machine
    # during split-topology deployments where edge and cloud run on separate hosts.
    # The visualizer runs in a separate Docker network rather than host networking
    # to enable controlled access via the exposed port (6081:6080).
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
      - REMOTE_PASSWORD=${REMOTE_PASSWORD:?Set REMOTE_PASSWORD in .env before starting the visualizer}
      - USE_SIM_TIME=true
    ports:
      - "0.0.0.0:6081:6080"
    depends_on:
      cloud_zenoh_bridge:
        condition: service_started

  cloud_zenoh_bridge:
    image: eclipse/zenoh-bridge-ros2dds:latest
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=1
    ports:
      - "7448:7448"
    volumes:
      - ./config:/config
    command: >
      -l tcp/0.0.0.0:7448
      -c /config/zenoh-bridge-ros2dds.json5

  teleop:
    image: ghcr.io/evshary/autoware_manual_control:feat-ci-image-release
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
    volumes:
      - ./teleop/teleop_config.yaml:/autoware_manual_control_ws/src/autoware_manual_control/teleop_config.yaml
    command: sleep infinity
    depends_on:
      - cloud_zenoh_bridge
