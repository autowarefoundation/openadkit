services:
  map-init:
    image: ghcr.io/tier4/scenario_simulator_v2:humble-25.0.20-runtime
    volumes:
      - autoware_map:/autoware_map
    command:
      - bash
      - -lc
      - |
        set -e
        image="ghcr.io/tier4/scenario_simulator_v2:humble-25.0.20-runtime"
        marker=/autoware_map/.scenario-simulator-image
        required_files="lanelet2_map.osm pointcloud_map.pcd"
        needs_extract=false
        marker_matches=false

        if [ -f "$$marker" ] && [ "$$(cat "$$marker")" = "$$image" ]; then
          marker_matches=true
        fi

        if [ -f "$$marker" ] && [ "$$marker_matches" = false ]; then
          needs_extract=true
        fi

        if [ ! -f "$$marker" ]; then
          needs_extract=true
        fi

        for file in $$required_files; do
          if [ ! -f "/autoware_map/$$file" ]; then
            needs_extract=true
          fi
        done

        if [ "$$needs_extract" = true ]; then
          echo "Extracting kashiwanoha map from $$image..."
          map_dir="$$(ros2 pkg prefix --share kashiwanoha_map)/map"
          if [ ! -d "$$map_dir" ]; then
            echo "ERROR: Kashiwanoha map not found in $$image." >&2
            exit 1
          fi
          tmp_dir="$$(mktemp -d)"
          trap 'rm -rf "$$tmp_dir"' EXIT
          cp -a "$$map_dir/." "$$tmp_dir/"
          for file in $$required_files; do
            if [ ! -f "$$tmp_dir/$$file" ]; then
              echo "ERROR: Extracted map is missing $$file." >&2
              exit 1
            fi
          done

          if [ ! -f "$$marker" ]; then
            needs_extract=false
            for file in $$required_files; do
              if [ ! -f "/autoware_map/$$file" ] || ! cmp -s "$$tmp_dir/$$file" "/autoware_map/$$file"; then
                needs_extract=true
              fi
            done
          fi

          if [ "$$needs_extract" = true ]; then
            rm -rf /autoware_map/* /autoware_map/.[!.]* /autoware_map/..?*
            cp -a "$$tmp_dir/." /autoware_map/
          fi
          echo "$$image" > "$$marker"
          rm -rf "$$tmp_dir"
          trap - EXIT
        else
          echo "Using validated kashiwanoha map volume"
        fi
    restart: "no"

  autoware:
    image: ghcr.io/autowarefoundation/autoware:universe
    volumes:
      - autoware_map:/autoware_map:ro
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
    command: > 
      bash -c "source /opt/ros/humble/setup.bash &&
      ros2 launch autoware_launch planning_simulator.launch.xml
      map_path:=/autoware_map
      vehicle_model:=sample_vehicle
      sensor_model:=sample_sensor_kit
      scenario_simulation:=${SCENARIO_SIMULATION:-true}
      rviz:=false"
    depends_on:
      map-init:
        condition: service_completed_successfully
      edge_zenoh_bridge:
        condition: service_started

  scenario_simulator:
    image: ghcr.io/tier4/scenario_simulator_v2:humble-25.0.20-runtime
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
    command: >
      ros2 launch scenario_test_runner scenario_test_runner.launch.py
      architecture_type:=awf/universe/20250130
      global_frame_rate:=30
      global_timeout:=180
      initialize_duration:=90
      launch_autoware:=false
      launch_rviz:=false
      launch_visualization:=false
      output_directory:=/autoware/scenario-sim/output
      record:=false
      scenario:=/home/ubuntu/Desktop/scenario_simulator_ws/install/scenario_test_runner/share/scenario_test_runner/scenario/sample.yaml
      sensor_model:=sample_sensor_kit
      use_custom_centerline:=true
      use_sim_time:=false
      vehicle_model:=sample_vehicle
    depends_on:
      map-init:
        condition: service_completed_successfully
      autoware:
        condition: service_started
      edge_zenoh_bridge:
        condition: service_started

  edge_zenoh_bridge:
    image:  eclipse/zenoh-bridge-ros2dds:latest
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=0
    volumes:
      - ./config:/config
    command: >
      -l tcp/0.0.0.0:7447
      -e tcp/${CLOUD_IP:-cloud_zenoh_bridge}:7448
      -c /config/zenoh-bridge-ros2dds.json5

  visualizer:
    image: ghcr.io/autowarefoundation/autoware-tools:visualizer-20251009
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
      - REMOTE_PASSWORD=openadkit
      - USE_SIM_TIME=true
    ports:
      - "0.0.0.0:6081:6080"
    depends_on:
      - cloud_zenoh_bridge

  cloud_zenoh_bridge:
    image: eclipse/zenoh-bridge-ros2dds:latest
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=1
    ports:
      - "7448:7448"
    volumes:
      - ./config:/config
    command: >
      -l tcp/0.0.0.0:7448
      -c /config/zenoh-bridge-ros2dds.json5

  teleop:
    image: ghcr.io/evshary/autoware_manual_control:feat-ci-image-release
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
    volumes:
      - ./teleop/teleop_config.yaml:/autoware_manual_control_ws/src/autoware_manual_control/teleop_config.yaml
    command: sleep infinity
    depends_on:
      - cloud_zenoh_bridge

volumes:
  autoware_map:
