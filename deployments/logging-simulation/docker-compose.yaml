# Logging simulation — the live sensing, perception, and localization stack plus
# a rosbag player. Pair with docker-compose.gpu.yaml to GPU-accelerate
# sensing/perception.
#
# Service definitions live in ../shared/services/<service>.yaml (one file per service).
# This file selects the stack, owns its topology (depends_on), and adds
# deployment-specific mounts and the rosbag player.
include:
  - ../shared/services/map-check.yaml
  - ../shared/services/map.yaml
  - ../shared/services/system.yaml
  - ../shared/services/sensing.yaml
  - ../shared/services/perception.yaml
  - ../shared/services/localization.yaml
  - ../shared/services/visualizer.yaml

services:
  map:
    depends_on:
      map-check:
        condition: service_completed_successfully

  system:
    depends_on:
      - map

  sensing:
    depends_on:
      - map
      - system
    volumes:
      # Shared with perception (models); sensing mounts it only in this stack.
      - ${DATA_PATH}:/autoware_data:rw

  perception:
    depends_on:
      - map
      - system
      - sensing

  localization:
    depends_on:
      - map
      - system
      - sensing
      - perception

  visualizer:
    depends_on:
      - map

  # Logging-only service.
  rosbag:
    image: ${AUTOWARE_UNIVERSE_IMAGE:-ghcr.io/autowarefoundation/autoware:universe@sha256:df96858b83f11c1d30aba1522108093ac09e8587ef3f85b8278c44ee37305175}
    container_name: autoware-rosbag
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ../shared/runtime.env
    environment:
      # Passed as runtime environment data (not interpolated into the command
      # program) so shell metacharacters in a value cannot alter the script.
      - ROSBAG_FORMAT=${ROSBAG_FORMAT}
      - ROSBAG_READY_TOPIC=${ROSBAG_READY_TOPIC}
      - ROSBAG_READY_TIMEOUT=${ROSBAG_READY_TIMEOUT}
      - ROSBAG_RATE=${ROSBAG_RATE}
    volumes:
      - ../shared/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      - ${ROSBAG_PATH}:/autoware_map/rosbag:ro
    depends_on:
      sensing:
        condition: service_started
      perception:
        condition: service_started
      localization:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        # Validate the values that arrive as environment data before use.
        case "$$ROSBAG_FORMAT" in
          sqlite3|mcap) ;;
          *) echo "Invalid ROSBAG_FORMAT '$$ROSBAG_FORMAT' (expected sqlite3 or mcap)" >&2; exit 1 ;;
        esac
        case "$$ROSBAG_READY_TIMEOUT" in
          ''|*[!0-9]*) echo "ROSBAG_READY_TIMEOUT must be a positive integer, got '$$ROSBAG_READY_TIMEOUT'" >&2; exit 1 ;;
        esac
        case "$$ROSBAG_RATE" in
          ''|*[!0-9.]*) echo "ROSBAG_RATE must be numeric, got '$$ROSBAG_RATE'" >&2; exit 1 ;;
        esac
        ros2 bag info /autoware_map/rosbag -s "$$ROSBAG_FORMAT"
        topic="$$ROSBAG_READY_TOPIC"
        deadline=$$((SECONDS + ROSBAG_READY_TIMEOUT))
        until ros2 topic info "$$topic" 2>/dev/null | grep -Eq 'Subscription count: [1-9][0-9]*'; do
          if (( SECONDS >= deadline )); then
            echo "Timed out waiting for a subscriber on $$topic" >&2
            exit 1
          fi
          sleep 2
        done
        exec ros2 bag play /autoware_map/rosbag -r "$$ROSBAG_RATE" -s "$$ROSBAG_FORMAT"
    restart: "no"
    profiles:
      - rosbag
