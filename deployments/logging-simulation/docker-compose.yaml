# Logging simulation — extends the deployment base with the live sensing,
# perception, and localization stack plus a rosbag player. Pair with
# docker-compose.gpu.yaml to GPU-accelerate sensing/perception.
include:
  - ../base/docker-compose.yaml

services:
  sensing:
    image: ${SENSING_PERCEPTION_IMAGE:-ghcr.io/autowarefoundation/openadkit:sensing-perception}
    container_name: autoware-sensing
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ../base/runtime.env
    volumes:
      - ${DATA_PATH}:/autoware_data:rw
      - ../base/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    depends_on:
      - map
      - system
    command: >
      ros2 launch autoware_launch tier4_sensing_component.launch.xml
      launch_pointcloud_container:=${LAUNCH_POINTCLOUD_CONTAINER_SENSING}
      launch_sensing_driver:=${LAUNCH_SENSING_DRIVER}
      pointcloud_container_name:=${POINTCLOUD_CONTAINER_NAME}
      sensor_model:=${SENSOR_MODEL}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  perception:
    image: ${SENSING_PERCEPTION_IMAGE:-ghcr.io/autowarefoundation/openadkit:sensing-perception}
    container_name: autoware-perception
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ../base/runtime.env
    volumes:
      - ${DATA_PATH}:/autoware_data:rw
      - ../base/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    depends_on:
      - map
      - system
      - sensing
    command: >
      ros2 launch autoware_launch tier4_perception_component.launch.xml
      data_path:=/autoware_data
      launch_pointcloud_container:=${LAUNCH_POINTCLOUD_CONTAINER_PERCEPTION}
      lidar_detection_model:=${LIDAR_DETECTION_MODEL}
      occupancy_grid_map_method:=${OCCUPANCY_GRID_MAP_METHOD}
      perception_mode:=${PERCEPTION_MODE}
      pointcloud_container_name:=${POINTCLOUD_CONTAINER_NAME}
      use_traffic_light_recognition:=${USE_TRAFFIC_LIGHT_RECOGNITION}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  localization:
    image: ${LOCALIZATION_MAPPING_IMAGE:-ghcr.io/autowarefoundation/openadkit:localization-mapping}
    container_name: autoware-localization
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ../base/runtime.env
    volumes:
      - ../base/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    depends_on:
      - map
      - system
      - sensing
      - perception
    command: >
      ros2 launch autoware_launch tier4_localization_component.launch.xml
      system_run_mode:=${SYSTEM_RUN_MODE}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  rosbag:
    image: ${AUTOWARE_UNIVERSE_IMAGE}
    container_name: autoware-rosbag
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ../base/runtime.env
    environment:
      # Passed as runtime environment data (not interpolated into the command
      # program) so shell metacharacters in a value cannot alter the script.
      - ROSBAG_FORMAT=${ROSBAG_FORMAT}
      - ROSBAG_READY_TOPIC=${ROSBAG_READY_TOPIC}
      - ROSBAG_READY_TIMEOUT=${ROSBAG_READY_TIMEOUT}
      - ROSBAG_RATE=${ROSBAG_RATE}
    volumes:
      - ../base/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      - ${ROSBAG_PATH}:/autoware_map/rosbag:ro
    depends_on:
      sensing:
        condition: service_started
      perception:
        condition: service_started
      localization:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        # Validate the values that arrive as environment data before use.
        case "$$ROSBAG_FORMAT" in
          sqlite3|mcap) ;;
          *) echo "Invalid ROSBAG_FORMAT '$$ROSBAG_FORMAT' (expected sqlite3 or mcap)" >&2; exit 1 ;;
        esac
        case "$$ROSBAG_READY_TIMEOUT" in
          ''|*[!0-9]*) echo "ROSBAG_READY_TIMEOUT must be a positive integer, got '$$ROSBAG_READY_TIMEOUT'" >&2; exit 1 ;;
        esac
        case "$$ROSBAG_RATE" in
          ''|*[!0-9.]*) echo "ROSBAG_RATE must be numeric, got '$$ROSBAG_RATE'" >&2; exit 1 ;;
        esac
        ros2 bag info /autoware_map/rosbag -s "$$ROSBAG_FORMAT"
        topic="$$ROSBAG_READY_TOPIC"
        deadline=$$((SECONDS + ROSBAG_READY_TIMEOUT))
        until ros2 topic info "$$topic" 2>/dev/null | grep -Eq 'Subscription count: [1-9][0-9]*'; do
          if (( SECONDS >= deadline )); then
            echo "Timed out waiting for a subscriber on $$topic" >&2
            exit 1
          fi
          sleep 2
        done
        exec ros2 bag play /autoware_map/rosbag -r "$$ROSBAG_RATE" -s "$$ROSBAG_FORMAT"
    restart: "no"
    profiles:
      - rosbag
