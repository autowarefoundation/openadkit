services:
  map-init:
    image: ${SCENARIO_SIMULATOR_IMAGE}
    volumes:
      - ${MAP_PATH}:/autoware_map
      - ../../common/scripts/map-init.sh:/map-init.sh:ro
    command: /map-init.sh
    environment:
      - SCENARIO_SIMULATOR_IMAGE=${SCENARIO_SIMULATOR_IMAGE}
      - MAP_VOLUME_PATH=/autoware_map
      - REQUIRED_FILES=${LANELET2_MAP_FILE} ${POINTCLOUD_MAP_FILE}
      - AUTO_EXTRACT_MAP=${AUTO_EXTRACT_MAP:-true}
      - MAP_PATH=${MAP_PATH}
    restart: "no"

  map:
    image: ghcr.io/autowarefoundation/openadkit:localization-mapping
    container_name: autoware-map
    network_mode: host
    init: true
    ipc: host
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    depends_on:
      map-init:
        condition: service_completed_successfully
    volumes:
      - ${MAP_PATH}:/autoware_map:ro
    command: >
      ros2 launch autoware_launch tier4_map_component.launch.xml
      lanelet2_map_file:=${LANELET2_MAP_FILE}
      map_path:=/autoware_map
      pointcloud_map_file:=${POINTCLOUD_MAP_FILE}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  planning:
    image: ghcr.io/autowarefoundation/openadkit:planning-control
    container_name: autoware-planning
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    depends_on:
      - map
    command: >
      ros2 launch autoware_launch tier4_planning_component.launch.xml
      component_wise_launch:=true
      enable_all_modules_auto_mode:=${ENABLE_ALL_MODULES_AUTO_MODE}
      is_simulation:=${IS_SIMULATION_MODE}
      module_preset:=${PLANNING_MODULE_PRESET}
      pointcloud_container_name:=${POINTCLOUD_CONTAINER_NAME}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  vehicle:
    image: ghcr.io/autowarefoundation/openadkit:vehicle-system
    container_name: autoware-vehicle
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    depends_on:
      - map
    command: >
      ros2 launch tier4_vehicle_launch vehicle.launch.xml
      launch_vehicle_interface:=${LAUNCH_VEHICLE_INTERFACE}
      raw_vehicle_cmd_converter_param_path:=/opt/autoware/share/autoware_launch/config/vehicle/raw_vehicle_cmd_converter/raw_vehicle_cmd_converter.param.yaml
      sensor_model:=${SENSOR_MODEL}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_id:=${VEHICLE_ID}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  system:
    image: ghcr.io/autowarefoundation/openadkit:vehicle-system
    container_name: autoware-system
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    volumes:
      - ./config/mrm_handler.param.yaml:/opt/autoware/share/autoware_launch/config/system/mrm_handler/mrm_handler.param.yaml:ro
    depends_on:
      - map
    command: >
      ros2 launch autoware_launch tier4_system_component.launch.xml
      launch_system_monitor:=${LAUNCH_SYSTEM_MONITOR}
      launch_dummy_diag_publisher:=${LAUNCH_DUMMY_DIAG_PUBLISHER}
      sensor_model:=${SENSOR_MODEL}
      system_run_mode:=${SYSTEM_RUN_MODE}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  control:
    image: ghcr.io/autowarefoundation/openadkit:planning-control
    container_name: autoware-control
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    depends_on:
      - map
      - planning
      - system
    command: >
      ros2 launch autoware_launch tier4_control_component.launch.xml
      check_external_emergency_heartbeat:=${CHECK_EXTERNAL_EMERGENCY_HEARTBEAT}
      component_wise_launch:=true
      lateral_controller_mode:=${LATERAL_CONTROLLER_MODE}
      longitudinal_controller_mode:=${LONGITUDINAL_CONTROLLER_MODE}
      module_preset:=${CONTROL_MODULE_PRESET}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_id:=${VEHICLE_ID}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  simulator:
    image: ${SIMULATOR_IMAGE}
    container_name: autoware-simulator
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    depends_on:
      map:
        condition: service_started
      system:
        condition: service_started
      vehicle:
        condition: service_started
    command: >
      ros2 launch autoware_launch tier4_simulator_component.launch.xml
      initial_engage_state:=${INITIAL_ENGAGE_STATE}
      launch_dummy_doors:=${LAUNCH_DUMMY_DOORS}
      launch_dummy_perception:=${LAUNCH_DUMMY_PERCEPTION}
      launch_dummy_vehicle:=${LAUNCH_DUMMY_VEHICLE}
      launch_scenario_simulator_v2_adapter:=${LAUNCH_SCENARIO_SIMULATOR_V2_ADAPTER}
      localization_sim_mode:=${LOCALIZATION_SIM_MODE}
      perception/enable_detection_failure:=${PERCEPTION_ENABLE_DETECTION_FAILURE}
      perception/enable_object_recognition:=${PERCEPTION_ENABLE_OBJECT_RECOGNITION}
      perception/enable_traffic_light:=${PERCEPTION_ENABLE_TRAFFIC_LIGHT}
      perception/use_base_link_z:=${PERCEPTION_USE_BASE_LINK_Z}
      raw_vehicle_cmd_converter_param_path:=/opt/autoware/share/autoware_launch/config/vehicle/raw_vehicle_cmd_converter/raw_vehicle_cmd_converter.param.yaml
      scenario_simulation:=${SCENARIO_SIMULATION}
      sensing/visible_range:=${SENSING_VISIBLE_RANGE}
      use_sim_time:=${USE_SIM_TIME}
      use_pointcloud_container:=${USE_POINTCLOUD_CONTAINER}
      vehicle_info_param_file:=/opt/autoware/share/${VEHICLE_MODEL}_description/config/vehicle_info.param.yaml
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  api:
    image: ghcr.io/autowarefoundation/openadkit:api
    container_name: autoware-api
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    volumes:
      - ./config/default_adapi.param.yaml:/opt/autoware/share/autoware_default_adapi_universe/config/default_adapi.param.yaml:ro
    depends_on:
      - map
    command: >
      ros2 launch autoware_launch tier4_autoware_api_component.launch.xml
      component_wise_launch:=true
      scenario_simulation:=${SCENARIO_SIMULATION}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  scenario_simulator:
    image: ${SCENARIO_SIMULATOR_IMAGE}
    container_name: autoware-scenario-simulator
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    volumes:
      - ${OUTPUT_HOST_PATH}:${OUTPUT_DIRECTORY}
      - ${SCENARIO_HOST_DIR}:/scenarios:ro
      - ${MAP_PATH}:/autoware_map:ro
    depends_on:
      - api
      - control
      - map
      - planning
      - simulator
      - system
      - vehicle
    command:
      - bash
      - -lc
      - |
        set -e
        ready_timeout="${SCENARIO_READY_TIMEOUT:-300}"
        case "$$ready_timeout" in
          ''|*[!0-9]*)
            echo "ERROR: SCENARIO_READY_TIMEOUT must be a non-negative integer." >&2
            exit 1
            ;;
        esac
        deadline=$$(( $$(date +%s) + $$ready_timeout ))

        wait_for_topic() {
          name="$$1"
          echo "Waiting for ROS topic $$name..."
          until timeout 5 ros2 topic list 2>/dev/null | grep -Fxq "$$name"; do
            if [ "$$(date +%s)" -ge "$$deadline" ]; then
              echo "ERROR: Timed out waiting for ROS topic $$name." >&2
              exit 1
            fi
            sleep 2
          done
        }

        wait_for_service() {
          name="$$1"
          echo "Waiting for ROS service $$name..."
          until timeout 5 ros2 service list 2>/dev/null | grep -Fxq "$$name"; do
            if [ "$$(date +%s)" -ge "$$deadline" ]; then
              echo "ERROR: Timed out waiting for ROS service $$name." >&2
              exit 1
            fi
            sleep 2
          done
        }

        wait_for_topic /map/pointcloud_map
        wait_for_topic /api/autoware/get/engage
        wait_for_service /api/autoware/set/engage
        wait_for_service /api/operation_mode/change_to_autonomous

        set -- "${SCENARIO}"
        if [ -z "$1" ]; then
          set -- "$(ros2 pkg prefix --share scenario_test_runner)/scenario/sample.yaml"
        fi
        exec ros2 launch scenario_test_runner scenario_test_runner.launch.py \
          architecture_type:=${ARCHITECTURE_TYPE} \
          global_frame_rate:=${GLOBAL_FRAME_RATE} \
          global_timeout:=${GLOBAL_TIMEOUT} \
          initialize_duration:=${INITIALIZE_DURATION} \
          launch_autoware:=${LAUNCH_AUTOWARE} \
          launch_rviz:=${LAUNCH_RVIZ} \
          launch_visualization:=${LAUNCH_VISUALIZATION} \
          output_directory:=${OUTPUT_DIRECTORY} \
          record:=${RECORD} \
          scenario:="$1" \
          sensor_model:=${SENSOR_MODEL} \
          use_custom_centerline:=${USE_CUSTOM_CENTERLINE} \
          use_sim_time:=${USE_SIM_TIME} \
          vehicle_model:=${VEHICLE_MODEL}
    restart: "no"

  visualizer:
    image: ghcr.io/autowarefoundation/openadkit:visualizer
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    ports:
      - 6080:6080
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - RVIZ_CONFIG=${RVIZ_CONFIG}
      - USE_SIM_TIME=${USE_SIM_TIME}
    restart: on-failure
