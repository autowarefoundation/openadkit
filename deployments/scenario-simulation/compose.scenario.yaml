# Scenario-host services for scenario simulation: the scenario runner and the
# visualizer, which split-host runs on this host rather than the edge.
#
# Shared by the single-host compose.yaml (which adds
# pid/depends_on and WAIT_FOR_POINTCLOUD_MAP back) and the `--role scenario`
# view (this file plus compose.zenoh.yaml). Autoware edges and pid: service:map
# live in the single-host compose.yaml, not here: the role view has no Autoware
# services and no map.
include:
  - ../shared/services/visualizer.yaml

services:
  scenario-simulator:
    image: ${SCENARIO_SIMULATOR_IMAGE:?pinned in openadkit.json externalImages}
    container_name: autoware-scenario-simulator
    network_mode: host
    init: true
    ipc: host
    # Writes results to ${OUTPUT_HOST_PATH}; run as the host user so they are
    # not root-owned. The CLI injects the ids; HOME must be writable for ROS logs.
    user: ${OPENADKIT_UID:-1000}:${OPENADKIT_GID:-1000}
    # The Jazzy image ships /home/ubuntu as 0750 (tier4/scenario_simulator_v2#1856),
    # so its entrypoint cannot source the workspace for other UIDs. Joining the
    # image's ubuntu group (gid 1000) grants traversal only: the process and its
    # outputs stay on the host user. Harmless once the image ships 0755.
    group_add:
      - "1000"
    env_file:
      - ../shared/runtime.env
    environment:
      - HOME=/tmp
      # Passed as runtime environment data (not interpolated into the command
      # program) so shell metacharacters in a value cannot alter the script.
      - ROS_DISTRO=${ROS_DISTRO:-humble}
      - SCENARIO_READY_TIMEOUT=${SCENARIO_READY_TIMEOUT:-600}
      - SCENARIO=${SCENARIO}
      - ARCHITECTURE_TYPE=${ARCHITECTURE_TYPE}
      - GLOBAL_FRAME_RATE=${GLOBAL_FRAME_RATE}
      - GLOBAL_REAL_TIME_FACTOR=${GLOBAL_REAL_TIME_FACTOR:-1.0}
      - GLOBAL_TIMEOUT=${GLOBAL_TIMEOUT}
      - INITIALIZE_DURATION=${INITIALIZE_DURATION}
      - LAUNCH_AUTOWARE=${LAUNCH_AUTOWARE}
      - LAUNCH_RVIZ=${LAUNCH_RVIZ}
      - LAUNCH_VISUALIZATION=${LAUNCH_VISUALIZATION}
      - OUTPUT_DIRECTORY=${OUTPUT_DIRECTORY}
      - SCENARIO_SIMULATOR_PORT=${SCENARIO_SIMULATOR_PORT}
      - RECORD=${RECORD}
      - SENSOR_MODEL=${SENSOR_MODEL}
      - USE_CUSTOM_CENTERLINE=${USE_CUSTOM_CENTERLINE}
      - USE_SIM_TIME=${USE_SIM_TIME}
      - VEHICLE_MODEL=${VEHICLE_MODEL}
    volumes:
      - ../shared/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      - ../shared/checks/scenario_result.py:/openadkit/checks/scenario_result.py:ro
      - ${OUTPUT_HOST_PATH}:${OUTPUT_DIRECTORY}
      - ${SCENARIO_HOST_PATH}:/scenarios:ro
      - ${MAP_PATH}:/autoware_map:ro
    command:
      - bash
      - -lc
      - |
        set -e
        ready_timeout="$$SCENARIO_READY_TIMEOUT"
        case "$$ready_timeout" in
          ''|*[!0-9]*)
            echo "ERROR: SCENARIO_READY_TIMEOUT must be a non-negative integer." >&2
            exit 1
            ;;
        esac
        deadline=$$(( $$(date +%s) + $$ready_timeout ))

        wait_for_topic() {
          name="$$1"
          echo "Waiting for ROS topic $$name..."
          until timeout 5 ros2 topic list 2>/dev/null | grep -Fxq "$$name"; do
            if [ "$$(date +%s)" -ge "$$deadline" ]; then
              echo "ERROR: Timed out waiting for ROS topic $$name." >&2
              exit 1
            fi
            sleep 2
          done
        }

        wait_for_service() {
          name="$$1"
          echo "Waiting for ROS service $$name..."
          until timeout 5 ros2 service list 2>/dev/null | grep -Fxq "$$name"; do
            if [ "$$(date +%s)" -ge "$$deadline" ]; then
              echo "ERROR: Timed out waiting for ROS service $$name." >&2
              exit 1
            fi
            sleep 2
          done
        }

        if [ "$${WAIT_FOR_POINTCLOUD_MAP:-}" = 1 ]; then
          wait_for_topic /map/pointcloud_map
        fi
        # The interfaces scenario_test_runner engages Autoware through.
        wait_for_service /api/external/set/engage
        wait_for_service /api/operation_mode/change_to_autonomous

        set -- "$$SCENARIO"
        if [ -z "$$1" ]; then
          set -- "$$(ros2 pkg prefix --share scenario_test_runner)/scenario/sample.yaml"
        fi
        # The runner exits 0 whatever the scenarios did; their JUnit results decide.
        started=$$(date +%s)
        ros2 launch scenario_test_runner scenario_test_runner.launch.py \
          architecture_type:="$$ARCHITECTURE_TYPE" \
          global_frame_rate:="$$GLOBAL_FRAME_RATE" \
          global_real_time_factor:="$$GLOBAL_REAL_TIME_FACTOR" \
          global_timeout:="$$GLOBAL_TIMEOUT" \
          initialize_duration:="$$INITIALIZE_DURATION" \
          launch_autoware:="$$LAUNCH_AUTOWARE" \
          launch_rviz:="$$LAUNCH_RVIZ" \
          launch_visualization:="$$LAUNCH_VISUALIZATION" \
          output_directory:="$$OUTPUT_DIRECTORY" \
          port:="$$SCENARIO_SIMULATOR_PORT" \
          record:="$$RECORD" \
          scenario:="$$1" \
          sensor_model:="$$SENSOR_MODEL" \
          use_custom_centerline:="$$USE_CUSTOM_CENTERLINE" \
          use_sim_time:="$$USE_SIM_TIME" \
          vehicle_model:="$$VEHICLE_MODEL"
        exec python3 /openadkit/checks/scenario_result.py "$$OUTPUT_DIRECTORY" "$$started"
    restart: "no"
