# Scenario simulation: relax operation-mode availability timeout to reduce false MRM triggers.
---
/**:
  ros__parameters:
    update_rate: 10
    timeout_operation_mode_availability: 2.5
    timeout_call_mrm_behavior: 0.01
    timeout_cancel_mrm_behavior: 0.01
    use_emergency_holding: false
    timeout_emergency_recovery: 5.0
    use_parking_after_stopped: false
    use_pull_over: false
    use_comfortable_stop: true

    turning_hazard_on:
      emergency: true
