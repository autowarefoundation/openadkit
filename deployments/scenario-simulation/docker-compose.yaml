# Scenario simulation — extends the deployment base with the dummy simulator,
# the scenario_simulator runner, and the param-file mounts the stack needs.
include:
  - ../base/docker-compose.yaml

services:
  # Overrides on base services (merged onto the base definitions).
  system:
    volumes:
      - ./config/mrm_handler.param.yaml:/opt/autoware/autoware_launch/share/autoware_launch/config/system/mrm_handler/mrm_handler.param.yaml:ro

  api:
    volumes:
      - ./config/default_adapi.param.yaml:/opt/autoware/autoware_default_adapi_universe/share/autoware_default_adapi_universe/config/default_adapi.param.yaml:ro

  simulator:
    image: ${SIMULATOR_IMAGE:-ghcr.io/autowarefoundation/openadkit:simulator}
    container_name: autoware-simulator
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ../base/runtime.env
    volumes:
      - ../base/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    depends_on:
      map:
        condition: service_started
      system:
        condition: service_started
      vehicle:
        condition: service_started
    command: >
      ros2 launch autoware_launch tier4_simulator_component.launch.xml
      initial_engage_state:=${INITIAL_ENGAGE_STATE}
      launch_dummy_doors:=${LAUNCH_DUMMY_DOORS}
      launch_dummy_perception:=${LAUNCH_DUMMY_PERCEPTION}
      launch_dummy_vehicle:=${LAUNCH_DUMMY_VEHICLE}
      launch_scenario_simulator_v2_adapter:=${LAUNCH_SCENARIO_SIMULATOR_V2_ADAPTER}
      localization_sim_mode:=${LOCALIZATION_SIM_MODE}
      perception/enable_detection_failure:=${PERCEPTION_ENABLE_DETECTION_FAILURE}
      perception/enable_object_recognition:=${PERCEPTION_ENABLE_OBJECT_RECOGNITION}
      perception/enable_traffic_light:=${PERCEPTION_ENABLE_TRAFFIC_LIGHT}
      perception/use_base_link_z:=${PERCEPTION_USE_BASE_LINK_Z}
      raw_vehicle_cmd_converter_param_path:=/opt/autoware/autoware_launch/share/autoware_launch/config/vehicle/raw_vehicle_cmd_converter/raw_vehicle_cmd_converter.param.yaml
      scenario_simulation:=${SCENARIO_SIMULATION}
      sensing/visible_range:=${SENSING_VISIBLE_RANGE}
      use_sim_time:=${USE_SIM_TIME}
      use_pointcloud_container:=${USE_POINTCLOUD_CONTAINER}
      vehicle_info_param_file:=/opt/autoware/${VEHICLE_MODEL}_description/share/${VEHICLE_MODEL}_description/config/vehicle_info.param.yaml
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure

  # Scenario-only service.
  scenario_simulator:
    image: ${SCENARIO_SIMULATOR_IMAGE:-ghcr.io/tier4/scenario_simulator_v2:humble-25.0.20-runtime@sha256:80dc759586c0aa55b5c49b120635b9bda8d52ae4fe3ad96478dd0f5a5bfec5ad}
    container_name: autoware-scenario-simulator
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ../base/runtime.env
    environment:
      # Passed as runtime environment data (not interpolated into the command
      # program) so shell metacharacters in a value cannot alter the script.
      - ROS_DISTRO=${ROS_DISTRO:-humble}
      - SCENARIO_READY_TIMEOUT=${SCENARIO_READY_TIMEOUT:-300}
      - SCENARIO=${SCENARIO}
      - ARCHITECTURE_TYPE=${ARCHITECTURE_TYPE}
      - GLOBAL_FRAME_RATE=${GLOBAL_FRAME_RATE}
      - GLOBAL_TIMEOUT=${GLOBAL_TIMEOUT}
      - INITIALIZE_DURATION=${INITIALIZE_DURATION}
      - LAUNCH_AUTOWARE=${LAUNCH_AUTOWARE}
      - LAUNCH_RVIZ=${LAUNCH_RVIZ}
      - LAUNCH_VISUALIZATION=${LAUNCH_VISUALIZATION}
      - OUTPUT_DIRECTORY=${OUTPUT_DIRECTORY}
      - SCENARIO_SIMULATOR_PORT=${SCENARIO_SIMULATOR_PORT}
      - RECORD=${RECORD}
      - SENSOR_MODEL=${SENSOR_MODEL}
      - USE_CUSTOM_CENTERLINE=${USE_CUSTOM_CENTERLINE}
      - USE_SIM_TIME=${USE_SIM_TIME}
      - VEHICLE_MODEL=${VEHICLE_MODEL}
    volumes:
      - ../base/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      - ${OUTPUT_HOST_PATH}:${OUTPUT_DIRECTORY}
      - ${SCENARIO_HOST_DIR}:/scenarios:ro
      - ${MAP_PATH}:/autoware_map:ro
    depends_on:
      - api
      - control
      - map
      - planning
      - simulator
      - system
      - vehicle
    command:
      - bash
      - -lc
      - |
        set -e
        ready_timeout="$$SCENARIO_READY_TIMEOUT"
        case "$$ready_timeout" in
          ''|*[!0-9]*)
            echo "ERROR: SCENARIO_READY_TIMEOUT must be a non-negative integer." >&2
            exit 1
            ;;
        esac
        deadline=$$(( $$(date +%s) + $$ready_timeout ))

        wait_for_topic() {
          name="$$1"
          echo "Waiting for ROS topic $$name..."
          until timeout 5 ros2 topic list 2>/dev/null | grep -Fxq "$$name"; do
            if [ "$$(date +%s)" -ge "$$deadline" ]; then
              echo "ERROR: Timed out waiting for ROS topic $$name." >&2
              exit 1
            fi
            sleep 2
          done
        }

        wait_for_service() {
          name="$$1"
          echo "Waiting for ROS service $$name..."
          until timeout 5 ros2 service list 2>/dev/null | grep -Fxq "$$name"; do
            if [ "$$(date +%s)" -ge "$$deadline" ]; then
              echo "ERROR: Timed out waiting for ROS service $$name." >&2
              exit 1
            fi
            sleep 2
          done
        }

        wait_for_topic /map/pointcloud_map
        wait_for_topic /api/autoware/get/engage
        wait_for_service /api/autoware/set/engage
        wait_for_service /api/operation_mode/change_to_autonomous

        set -- "$$SCENARIO"
        if [ -z "$1" ]; then
          set -- "$(ros2 pkg prefix --share scenario_test_runner)/scenario/sample.yaml"
        fi
        exec ros2 launch scenario_test_runner scenario_test_runner.launch.py \
          architecture_type:="$$ARCHITECTURE_TYPE" \
          global_frame_rate:="$$GLOBAL_FRAME_RATE" \
          global_timeout:="$$GLOBAL_TIMEOUT" \
          initialize_duration:="$$INITIALIZE_DURATION" \
          launch_autoware:="$$LAUNCH_AUTOWARE" \
          launch_rviz:="$$LAUNCH_RVIZ" \
          launch_visualization:="$$LAUNCH_VISUALIZATION" \
          output_directory:="$$OUTPUT_DIRECTORY" \
          port:="$$SCENARIO_SIMULATOR_PORT" \
          record:="$$RECORD" \
          scenario:="$1" \
          sensor_model:="$$SENSOR_MODEL" \
          use_custom_centerline:="$$USE_CUSTOM_CENTERLINE" \
          use_sim_time:="$$USE_SIM_TIME" \
          vehicle_model:="$$VEHICLE_MODEL"
    restart: "no"
