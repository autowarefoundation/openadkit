# Autoware-side services for scenario simulation.
#
# Shared by the single-host entry point (docker-compose.yaml) and the
# `--node autoware` view (this file plus deployments/shared/compose.zenoh.yaml,
# attached by the CLI). The scenario runner lives in services.scenario.yaml.
include:
  - ../shared/services/map-check.yaml
  - ../shared/services/map.yaml
  - ../shared/services/planning.yaml
  - ../shared/services/vehicle.yaml
  - ../shared/services/system.yaml
  - ../shared/services/control.yaml
  - ../shared/services/simulator.yaml
  - ../shared/services/perception-simulation.yaml
  - ../shared/services/api.yaml
  - ../shared/services/visualizer.yaml

services:
  map:
    depends_on:
      map-check:
        condition: service_completed_successfully

  planning:
    depends_on:
      - map

  vehicle:
    depends_on:
      - map

  system:
    depends_on:
      - map

  control:
    depends_on:
      - map
      - planning
      - system

  # Scenario Simulator V2 adapter. Stays on the Autoware host in split mode:
  # only the TIER IV runner and its simple sensor simulator move to the scenario
  # host.
  simulator:
    depends_on:
      map:
        condition: service_started
      system:
        condition: service_started
      vehicle:
        condition: service_started

  perception-simulation:
    depends_on:
      - map

  api:
    depends_on:
      - map

  visualizer:
    depends_on:
      - map

  # Scenario Simulator V2 25.0.20 subscribes /api/fail_safe/mrm_state as
  # volatile, and its node ignores launch remaps, while the ADAPI publishes it
  # transient-local and only on change. Autoware keeps running across the
  # scenarios of a workflow, so a scenario without an MRM transition never
  # receives NORMAL and cannot succeed. Relay the 10 Hz source to the ADAPI
  # topic until Scenario Simulator V2 subscribes transient-local.
  mrm-state-relay:
    image: ${SIMULATOR_IMAGE:-ghcr.io/autowarefoundation/openadkit:simulator}
    container_name: autoware-mrm-state-relay
    network_mode: host
    init: true
    ipc: host
    env_file:
      - ../shared/runtime.env
    volumes:
      - ../shared/cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      - ${OPENADKIT_CONFIG_SHARED:?set by the openadkit CLI}:/openadkit/config/shared:ro
      - ${OPENADKIT_CONFIG_BASE:?set by the openadkit CLI}:/openadkit/config/base:ro
      - ${OPENADKIT_CONFIG_DEPLOYMENT:?set by the openadkit CLI}:/openadkit/config/deployment:ro
      - ${OPENADKIT_OVERLAY_WS:?set by the openadkit CLI}:/openadkit/overlay_ws:ro
    command: >
      ros2 run topic_tools relay /system/fail_safe/mrm_state /api/fail_safe/mrm_state
      --ros-args -p use_sim_time:=${USE_SIM_TIME}
    depends_on:
      - system
    restart: on-failure
