# Map — serves the Lanelet2 and pointcloud map from the host MAP_PATH.
#
# The Autoware services join this container's PID namespace (pid: service:map)
# so their PIDs are unique. ROS 2 launch names its internal node
# launch_ros_<PID>: in separate namespaces every `ros2 launch` gets the same PID,
# duplicated_node_checker reports the repeated /launch_ros_<PID> as an error,
# and the diagnostics graph then makes autonomous mode unavailable. Map holds
# the namespace because it loads its files once and then only publishes, so it
# is the service least likely to crash: when it exits, every joined container
# is killed and restarts with it.
services:
  map:
    image: ${LOCALIZATION_MAPPING_IMAGE:-ghcr.io/autowarefoundation/openadkit:localization-mapping}
    container_name: autoware-map
    network_mode: host
    init: true
    ipc: host
    env_file:
      - ../runtime.env
    volumes:
      - type: bind
        source: ${MAP_PATH}
        target: /autoware_map
        read_only: true
        bind:
          create_host_path: false
      - ../cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      - ../launch/component.launch.py:/openadkit/launch/component.launch.py:ro
      # Integrator layer, applied by the image's entrypoint hook (components/shared/entrypoint).
      - ${OPENADKIT_CONFIG_SHARED:?set by the openadkit CLI}:/openadkit/config/shared:ro
      - ${OPENADKIT_CONFIG_BASE:?set by the openadkit CLI}:/openadkit/config/base:ro
      - ${OPENADKIT_CONFIG_DEPLOYMENT:?set by the openadkit CLI}:/openadkit/config/deployment:ro
      - ${OPENADKIT_OVERLAY_WS:?set by the openadkit CLI}:/openadkit/overlay_ws:ro
    command: >
      ros2 launch /openadkit/launch/component.launch.py component:=component_map
      lanelet2_map_file:=${LANELET2_MAP_FILE}
      map_path:=/autoware_map
      pointcloud_map_file:=${POINTCLOUD_MAP_FILE}
      use_sim_time:=${USE_SIM_TIME}
      vehicle_model:=${VEHICLE_MODEL}
    restart: on-failure
