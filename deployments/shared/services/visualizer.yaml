# Visualizer — RViz behind noVNC, over plain HTTP.
# `ports:` is ignored under `network_mode: host`. Websockify binds to loopback by
# default (`WEBSOCKIFY_BIND=127.0.0.1`); reach it remotely through an SSH tunnel.
# To expose noVNC itself, set WEBSOCKIFY_BIND=0.0.0.0 and front the port with an
# authenticated reverse proxy, or serve HTTPS with your own certificate:
# NOVNC_CERT and NOVNC_KEY name its files, mounted into this service.
services:
  visualizer:
    image: ${VISUALIZER_IMAGE:-ghcr.io/autowarefoundation/openadkit:visualizer}
    container_name: autoware-visualizer
    network_mode: host
    init: true
    ipc: host
    pid: service:map
    env_file:
      - ../runtime.env
    environment:
      - RVIZ_CONFIG=${RVIZ_CONFIG}
      - USE_SIM_TIME=${USE_SIM_TIME}
      - REMOTE_DISPLAY=${REMOTE_DISPLAY}
      - REMOTE_PASSWORD=${REMOTE_PASSWORD}
      - WEBSOCKIFY_BIND=${WEBSOCKIFY_BIND:-127.0.0.1}
      - RVIZ_GPU=${RVIZ_GPU:-auto}
      - NOVNC_CERT=${NOVNC_CERT:-}
      - NOVNC_KEY=${NOVNC_KEY:-}
      # REMOTE_DISPLAY=false opens RViz on the desktop's X server, reached
      # over the host network; its cookie comes from the session's XAUTHORITY.
      - DISPLAY=${DISPLAY:-}
      - XAUTHORITY=/tmp/.Xauthority
    volumes:
      - ${XAUTHORITY:-/dev/null}:/tmp/.Xauthority:ro
      - ../cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      # Integrator layer, applied by the image's entrypoint hook (components/shared/entrypoint).
      - ${OPENADKIT_CONFIG_SHARED:?set by the openadkit CLI}:/openadkit/config/shared:ro
      - ${OPENADKIT_CONFIG_BASE:?set by the openadkit CLI}:/openadkit/config/base:ro
      - ${OPENADKIT_CONFIG_DEPLOYMENT:?set by the openadkit CLI}:/openadkit/config/deployment:ro
      - ${OPENADKIT_OVERLAY_WS:?set by the openadkit CLI}:/openadkit/overlay_ws:ro
      - ${OPENADKIT_OVERLAY_WS_DEPLOYMENT:?set by the openadkit CLI}:/openadkit/overlay_ws_deployment:ro
    restart: on-failure
