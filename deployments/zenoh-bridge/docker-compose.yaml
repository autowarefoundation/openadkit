x-scenario-simulator-image: &scenario-simulator-image ghcr.io/tier4/scenario_simulator_v2:humble-25.0.20-runtime

# Three named networks match the architecture described in
# docs/deployment/zenoh-bridge/index.md:
#   - edge_net: edge-side (autoware, scenario_simulator, edge_zenoh_bridge)
#   - cloud_net: cloud-side (visualizer, cloud_zenoh_bridge, teleop)
#   - zenoh_net: dedicated bridge between the two zenoh routers, so DDS
#     multicast on edge_net cannot leak into cloud_net and vice versa.
networks:
  edge_net:
    driver: bridge
  cloud_net:
    driver: bridge
  zenoh_net:
    driver: bridge

services:
  autoware:
    image: ghcr.io/autowarefoundation/autoware:universe
    networks:
      - edge_net
    volumes:
      - ${MAP_PATH}:/autoware_map:ro
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
      ros2 launch autoware_launch planning_simulator.launch.xml
      map_path:=/autoware_map
      vehicle_model:=sample_vehicle
      sensor_model:=sample_sensor_kit
      scenario_simulation:=${SCENARIO_SIMULATION:-true}
      rviz:=false"
    depends_on:
      edge_zenoh_bridge:
        condition: service_started

  scenario_simulator:
    image: *scenario-simulator-image
    networks:
      - edge_net
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
    command:
      - bash
      - -lc
      - |
        set -e
        exec ros2 launch scenario_test_runner scenario_test_runner.launch.py \
          architecture_type:=awf/universe/20250130 \
          global_frame_rate:=30 \
          global_timeout:=180 \
          initialize_duration:=90 \
          launch_autoware:=false \
          launch_rviz:=false \
          launch_visualization:=false \
          output_directory:=/autoware/scenario-sim/output \
          record:=false \
          scenario:="$(ros2 pkg prefix --share scenario_test_runner)/scenario/sample.yaml" \
          sensor_model:=sample_sensor_kit \
          use_custom_centerline:=true \
          use_sim_time:=false \
          vehicle_model:=sample_vehicle
    depends_on:
      autoware:
        condition: service_started
      edge_zenoh_bridge:
        condition: service_started

  edge_zenoh_bridge:
    image: eclipse/zenoh-bridge-ros2dds:latest
    # Bridges edge_net (ROS 2 DDS) and zenoh_net (tunneled TCP). DNS alias
    # `cloud_zenoh_bridge` resolves via zenoh_net regardless of CLOUD_IP.
    networks:
      edge_net:
        aliases:
          - edge_zenoh_bridge
      zenoh_net:
        aliases:
          - edge_zenoh_bridge
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=0
    volumes:
      - ./config:/config
    command: >
      -l tcp/0.0.0.0:7447
      -e tcp/${CLOUD_IP:-cloud_zenoh_bridge}:7448
      -c /config/zenoh-bridge-ros2dds.json5

  visualizer:
    image: ghcr.io/autowarefoundation/openadkit:visualizer
    networks:
      - cloud_net
    # Port-mapped so the host browser can reach noVNC. The visualizer's
    # websockify is bound to loopback inside the container, so cloud_net
    # traffic that reaches port 6080 inside the container is served locally
    # and only the host's 6081 port is exposed externally.
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
      - REMOTE_PASSWORD=${REMOTE_PASSWORD:?Set REMOTE_PASSWORD in .env before starting the visualizer}
      - USE_SIM_TIME=true
    ports:
      - "127.0.0.1:6081:6080"
    depends_on:
      cloud_zenoh_bridge:
        condition: service_started

  cloud_zenoh_bridge:
    image: eclipse/zenoh-bridge-ros2dds:latest
    # Bridges cloud_net and zenoh_net. The 7448 listener is exposed to the
    # host (and through CLOUD_IP to remote edge machines) via the bridge
    # port mapping.
    networks:
      cloud_net:
        aliases:
          - cloud_zenoh_bridge
      zenoh_net:
        aliases:
          - cloud_zenoh_bridge
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=1
    ports:
      - "7448:7448"
    volumes:
      - ./config:/config
    command: >
      -l tcp/0.0.0.0:7448
      -c /config/zenoh-bridge-ros2dds.json5

  teleop:
    image: ghcr.io/evshary/autoware_manual_control:feat-ci-image-release
    networks:
      - cloud_net
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
    volumes:
      - ./teleop/teleop_config.yaml:/autoware_manual_control_ws/src/autoware_manual_control/teleop_config.yaml
    command: sleep infinity
    depends_on:
      - cloud_zenoh_bridge
