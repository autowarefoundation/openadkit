x-scenario-simulator-image: &scenario-simulator-image ghcr.io/tier4/scenario_simulator_v2:humble-25.0.20-runtime

# Three named networks match the architecture described in
# docs/deployment/zenoh-bridge/index.md:
#   - edge_net: edge-side (autoware, scenario_simulator, edge_zenoh_bridge)
#   - cloud_net: cloud-side (visualizer, cloud_zenoh_bridge, teleop)
#   - zenoh_net: dedicated bridge between the two zenoh routers, so DDS
#     multicast on edge_net cannot leak into cloud_net and vice versa.
networks:
  edge_net:
    driver: bridge
  cloud_net:
    driver: bridge
  zenoh_net:
    driver: bridge

services:
  autoware:
    # Pinned to a reviewed digest for reproducible source starts; the tag stays
    # visible and can be re-resolved to bump this deliberately.
    image: ghcr.io/autowarefoundation/autoware:universe@sha256:df96858b83f11c1d30aba1522108093ac09e8587ef3f85b8278c44ee37305175
    networks:
      - edge_net
    volumes:
      - ${MAP_PATH}:/autoware_map:ro
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DISTRO=${ROS_DISTRO:-humble}
      - ROS_DOMAIN_ID=0
    command: >
      bash -c "source /opt/ros/${ROS_DISTRO:-humble}/setup.bash &&
      ros2 launch autoware_launch planning_simulator.launch.xml
      map_path:=/autoware_map
      vehicle_model:=sample_vehicle
      sensor_model:=sample_sensor_kit
      scenario_simulation:=${SCENARIO_SIMULATION:-true}
      rviz:=false"
    depends_on:
      edge_zenoh_ready:
        condition: service_completed_successfully

  scenario_simulator:
    # Scenario output (output_directory below) is written to the container
    # filesystem only and is disposable by design: record:=false, so no rosbag
    # is retained. Bind a host volume here if you need per-run artifacts kept.
    image: *scenario-simulator-image
    networks:
      - edge_net
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
    command:
      - bash
      - -lc
      - |
        set -e
        exec ros2 launch scenario_test_runner scenario_test_runner.launch.py \
          architecture_type:=awf/universe/20250130 \
          global_frame_rate:=30 \
          global_timeout:=180 \
          initialize_duration:=90 \
          launch_autoware:=false \
          launch_rviz:=false \
          launch_visualization:=false \
          output_directory:=/autoware/scenario-sim/output \
          record:=false \
          scenario:="$(ros2 pkg prefix --share scenario_test_runner)/scenario/sample.yaml" \
          sensor_model:=sample_sensor_kit \
          use_custom_centerline:=true \
          use_sim_time:=false \
          vehicle_model:=sample_vehicle
    depends_on:
      autoware:
        condition: service_started
      edge_zenoh_ready:
        condition: service_completed_successfully

  edge_zenoh_bridge:
    image: eclipse/zenoh-bridge-ros2dds:latest@sha256:5aca6798ae112e390a97788450fd37360ddd72ac092032a25acf9fac17b2d9af
    # Bridges edge_net (ROS 2 DDS) and zenoh_net (tunneled TCP). DNS alias
    # `cloud_zenoh_bridge` resolves via zenoh_net regardless of CLOUD_IP.
    networks:
      edge_net:
        aliases:
          - edge_zenoh_bridge
      zenoh_net:
        aliases:
          - edge_zenoh_bridge
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=0
    volumes:
      - ./config:/config:ro
    # Long-running bridge process: restart if it dies so the tunnel recovers
    # instead of leaving the container exited while the project looks healthy.
    restart: unless-stopped
    command: >
      -l tcp/0.0.0.0:7447
      -e tcp/${CLOUD_IP:-cloud_zenoh_bridge}:7448
      -c /config/zenoh-bridge-ros2dds.json5

  edge_zenoh_ready:
    image: busybox:1.36.1
    networks:
      - zenoh_net
    environment:
      - CLOUD_IP=${CLOUD_IP:-cloud_zenoh_bridge}
      - ZENOH_READY_TIMEOUT=${ZENOH_READY_TIMEOUT:-120}
    depends_on:
      edge_zenoh_bridge:
        condition: service_started
    command:
      - sh
      - -ec
      - |
        deadline=$$(($$(date +%s) + ZENOH_READY_TIMEOUT))
        until nc -z -w 1 edge_zenoh_bridge 7447 && nc -z -w 1 "$$CLOUD_IP" 7448; do
          [ "$$(date +%s)" -lt "$$deadline" ] || { echo "Zenoh edge tunnel readiness timed out" >&2; exit 1; }
          sleep 2
        done
    restart: "no"

  visualizer:
    image: ghcr.io/autowarefoundation/openadkit:visualizer
    networks:
      - cloud_net
    # Under bridge networking, Docker forwards 127.0.0.1:6081 on the host to
    # the container's bridge IP :6080. websockify must bind 0.0.0.0 inside the
    # container so the forwarded traffic can reach it; the host-side
    # 127.0.0.1 prefix keeps external access loopback-only. The VNC server
    # is always loopback-only (vncserver -localhost in the entrypoint).
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
      - REMOTE_PASSWORD=${REMOTE_PASSWORD:?Set REMOTE_PASSWORD in .env before starting the visualizer}
      # The edge scenario and Autoware use wall time; /clock is not routed.
      - USE_SIM_TIME=false
      - WEBSOCKIFY_BIND=0.0.0.0
    ports:
      - "127.0.0.1:6081:6080"
    depends_on:
      cloud_zenoh_ready:
        condition: service_completed_successfully

  cloud_zenoh_bind_guard:
    image: busybox:1.36.1
    environment:
      - ZENOH_ROUTER_BIND_IP=${ZENOH_ROUTER_BIND_IP:-127.0.0.1}
    command:
      - sh
      - -ec
      - |
        case "$$ZENOH_ROUTER_BIND_IP" in
          0.0.0.0|::|[[]::[]]|::ffff:0.0.0.0)
            echo "Refusing wildcard Zenoh router bind: $$ZENOH_ROUTER_BIND_IP" >&2
            exit 1
            ;;
        esac
    restart: "no"

  cloud_zenoh_bridge:
    image: eclipse/zenoh-bridge-ros2dds:latest@sha256:5aca6798ae112e390a97788450fd37360ddd72ac092032a25acf9fac17b2d9af
    # Bridges cloud_net and zenoh_net. The 7448 listener is exposed to the
    # host via the bridge port mapping. Remote use must bind an exact
    # VPN/private-interface address because this endpoint has no transport
    # authentication or encryption.
    networks:
      cloud_net:
        aliases:
          - cloud_zenoh_bridge
      zenoh_net:
        aliases:
          - cloud_zenoh_bridge
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=1
    depends_on:
      cloud_zenoh_bind_guard:
        condition: service_completed_successfully
    ports:
      - "${ZENOH_ROUTER_BIND_IP:-127.0.0.1}:7448:7448"
    volumes:
      - ./config:/config:ro
    # Long-running bridge process: restart if it dies so the tunnel recovers
    # instead of leaving the container exited while the project looks healthy.
    restart: unless-stopped
    command: >
      -l tcp/0.0.0.0:7448
      -c /config/zenoh-bridge-ros2dds.json5

  cloud_zenoh_ready:
    image: busybox:1.36.1
    networks:
      - zenoh_net
    environment:
      - ZENOH_READY_TIMEOUT=${ZENOH_READY_TIMEOUT:-120}
    depends_on:
      cloud_zenoh_bridge:
        condition: service_started
    command:
      - sh
      - -ec
      - |
        deadline=$$(($$(date +%s) + ZENOH_READY_TIMEOUT))
        until nc -z -w 1 cloud_zenoh_bridge 7448; do
          [ "$$(date +%s)" -lt "$$deadline" ] || { echo "Zenoh cloud listener readiness timed out" >&2; exit 1; }
          sleep 2
        done
    restart: "no"

  teleop:
    image: ghcr.io/evshary/autoware_manual_control:latest@sha256:3d2c2c4cfeb27386e1079ac8ab13f3b7517a449b8e5cd74d6ad187a829ddffb0
    networks:
      - cloud_net
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=1
    volumes:
      - ./teleop/teleop_config.yaml:/autoware_manual_control_ws/teleop_config.yaml:ro
    command: sleep infinity
    depends_on:
      cloud_zenoh_ready:
        condition: service_completed_successfully
