name: awf-oak

image:
  hostname: awf-oak-plan-sim
  selinux_booleans:
    domain_can_mmap_files: true
  image_size: 20 GiB
  partitions:
    boot:
      size: 300 MiB

content:
  rpms:
    - podman
  container_images:
    - source: ghcr.io/autowarefoundation/autoware
      tag: universe-0.45.1-amd64
      name: localhost/autoware:latest
    - source: ghcr.io/tier4/scenario_simulator_v2
      tag: humble-25.0.20-runtime
      name: localhost/scenario_simulator_v2:runtime
  make_dirs:
    - path: /var/log/awf
      mode: 0755
      exist_ok: true
      parents: true
    - path: /opt/tier4/kashiwanoha_map
      mode: 0755
      exist_ok: true
      parents: true
    - path: /usr/local/libexec
      mode: 0755
      exist_ok: true
      parents: true
  add_files:
    # systemd unit that extracts the map from the pinned simulator image
    - source_path: ../components/systemd/awf-oak-map.service
      path: /etc/systemd/system/awf-oak-map.service
    - source_path: ../components/scripts/awf-oak-extract-map.sh
      path: /usr/local/libexec/awf-oak-extract-map.sh
    # awf oak shared environment (single source of truth for ROS_DOMAIN_ID, ...)
    - source_path: ../components/container-files/awf-oak.env
      path: /etc/containers/systemd/awf-oak.env
    # awf oak pod
    - source_path: ../components/container-files/awf-oak.pod
      path: /etc/containers/systemd/awf-oak.pod
    # awf oak planning service
    - source_path: ../components/container-files/awf-oak-planning.container
      path: /etc/containers/systemd/awf-oak-planning.container
    # awf oak simulator service
    - source_path: ../components/container-files/awf-oak-simulator.container
      path: /etc/containers/systemd/awf-oak-simulator.container
  systemd:
    enabled_services:
      - awf-oak-map.service

auth:
  root_password: $6$xoLqEUz0cGGJRx01$H3H/bFm0myJPULNMtbSsOFd/2BnHqHkMD92Sfxd.EKM9hXTWSmELG8cf205l6dktomuTcgKGGtGDgtvHVXSWU.
