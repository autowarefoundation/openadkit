# VisionPilot headless CPU smoke config (overrides the image's default).
# NOTE: the parser only treats a leading '#' as a comment and does NOT strip
# inline/trailing comments, so keep bool/string values bare (no trailing text).

source.mode         = video

engine.provider     = cpu
engine.device_id    = 0
engine.cache_dir    = /tmp/visionpilot_cache
engine.workspace_gb = 1.0

model.precision     = fp32

speed_limit         = 33.3
Lf                  = 2.67

visualization_on    = false
webrtc_on           = false
webrtc_port         = 8080
