containers_read_only: false
disable_ipv6: false

# btrfs is the only viable persistent container store on the X5H's BSP
# kernel (no CONFIG_XFS_FS, no CONFIG_F2FS_FS, ext4 has no security
# xattrs), so btrfs-progs is not optional; gdisk is needed alongside it.
# Both packages were moved out of the AutoSD 10 / CentOS Stream 10 repos
# upstream and now live in EPEL 10 (verified present at
# https://dl.fedoraproject.org/pub/epel/10/Everything/aarch64/Packages/{b/btrfs-progs-6.12-3.el10_0,g/gdisk-1.0.10-2.el10_0}.aarch64.rpm).
#
# baseurl is a literal "aarch64", not "$arch". $variable substitution
# through --define-file values does actually work here (verified by
# running the real mpp/aib-osbuild-mpp preprocessor with `arch` supplied
# via -D, the same way aib/osbuild.py drives it: the resulting
# extra_repos entry does come out with "$arch" expanded to "aarch64").
# The literal is used anyway because this platform is aarch64-only (the
# X5H board) and this workflow has no other-arch leg, so a hardcoded
# value is simpler and does not depend on a mechanism this file has no
# other use for.
#
# gpgcheck: false is deliberate, not a shortcut: aib's repo schema
# (_SUPPORTED_REPO_KEYS in mpp/aib-osbuild-mpp) has no per-repo gpgkey
# field at all, only a per-repo gpgcheck boolean -- GPG trust is otherwise
# a single global key list (distro_gpg_keys, currently the CentOS
# Stream 10 and Red Hat 10 keys concatenated) shared by every repo.
# Disabling gpgcheck for this one repo (which is exactly what dnf's own
# gpgcheck=0 does for a .repo file) avoids a GPG failure without touching
# that global list or affecting verification of any other repo's
# packages. The alternative -- appending EPEL's own key to
# distro_gpg_keys so gpgcheck could stay on -- was considered and
# rejected for this iteration: it requires overriding a scalar the
# distro file already sets (replacing, not merging) and embedding a
# large PEM block by hand, which risks more breakage in a single edit
# than this fork-only CI validation build's threat model justifies. The
# fetch itself is HTTPS from the official Fedora mirror.
#
# No explicit priority: btrfs-progs/gdisk are unique to EPEL (not carried
# by any AutoSD/CentOS repo), so there is no same-named package for a
# priority to arbitrate, and dnf priority excludes same-named packages
# from worse-priority repos outright rather than just de-preferring them.
# Setting one here (e.g. matching local_repo_prio's 15) would rank this
# repo *above* the "automotive" CentOS SIG repo, which carries no
# explicit priority of its own (defaults to 99) -- an unintended
# relationship for no actual benefit. Leaving it unset defaults to 99,
# same tier as "automotive".
extra_repos:
  - id: epel10
    baseurl: https://dl.fedoraproject.org/pub/epel/10/Everything/aarch64/
    gpgcheck: false

# The image ships an enabled boot-efi.mount unit (computed-vars.ipp.yml
# copies it to /usr/lib/systemd/system/boot-efi.mount and adds it to
# image_enabled_services) that requires /dev/disk/by-label/ESP. On both
# gate paths -- the bare ext4 export QEMU boots directly via -kernel, and
# the tar staged as the board's NFS root -- there is no ESP partition, so
# that device unit times out, local-fs.target fails, and AutoSD's
# emergency.service ("Emergency Shell Override - Reboot") reboots instead
# of dropping to a shell. Forever. Neutralizing fstab (done in
# inject-test-images.sh / stage-nfs-rootfs.sh) does not touch this: the
# unit is not driven by fstab at all.
#
# use_efipart: false is the fix, not use_efipart_mount directly.
# computed-vars.ipp.yml's use_efipart is only computed from use_ukiboot
# "if not already in locals()" -- the same override mechanism extra_repos
# above relies on (--define-file values land in the mpp preprocessor's
# overrides dict, which always wins the final {**vars, **overrides} merge
# every mpp-if/mpp-eval reads via get_vars(), regardless of what a
# same-named key in vars gets recomputed to independently). Setting
# use_efipart here means that recompute is skipped and our value wins.
# use_efipart_mount, by contrast, has no such guard -- it is an
# unconditional `mpp-eval: use_efipart` every time computed-vars.ipp.yml
# is processed, so it correctly follows use_efipart down to false without
# needing to be set itself; setting it directly would just be recomputed
# over.
#
# Confirmed this only affects disk-image assembly, never rootfs content:
# every reference to the efi partition/device (build.ipp.yml's
# base_partitions, content.ipp.yml's disk_yaml partition table,
# image.ipp.yml's org.osbuild.mkfs.fat stage and the image pipeline's
# mount-and-copy device map) lives inside the disk-image-building `image`
# pipeline and is independently gated on its own `mpp-if: use_efipart`.
# That pipeline produces a disk.img artifact neither export path
# consumes: this workflow's `aib build --tar` never requests a disk
# output, the QEMU gate boots the extracted ext4 directly via -kernel
# (never through any bootloader the image would have shipped), and the
# board nets boot the BSP kernel over the existing path. use_ukiboot
# stays true (the default for --target qemu) and is unaffected --
# nothing that is use_ukiboot-gated also depends on use_efipart; the one
# other use_ukiboot-gated place that touches EFI-ish paths
# (content.ipp.yml's signing_info for aboot.img/ukibootN.efi) is
# secure-boot signing metadata, unrelated to the partition/device layer.
use_efipart: false

# Keep Quadlet a BOOT-TIME generator instead of an image-build-time one.
#
# What goes wrong without this, measured on the board (2026-08-18 Stage 1
# session): /etc/systemd/system-generators/ holds seventeen symlinks to
# /dev/null, and podman-system-generator is one of them. Every .container
# and .pod file aib/x5h-rootfs.aib.yml installs into /etc/containers/systemd
# therefore produces ZERO systemd units at runtime -- silently. No error, no
# journal line, no warning: `systemctl daemon-reload` succeeds, and
# `systemctl list-unit-files "awf-oak*"` simply comes up empty, because a
# generator masked to /dev/null is a generator systemd skips without
# comment. The session lost hours to it and had to install a volatile
# /run/systemd/system-generators/podman-system-generator symlink (which
# outranks /etc in systemd's generator search path) to get any unit at all.
# The same mask is why selfboot.md:232 reports that the fstab generator does
# not run either -- that is not a separate quirk, it is this one seen on a
# different generator.
#
# Where the mask comes from, and why it is this variable that removes it:
# the mask is not something AutoSD does arbitrarily. aib's
# include/computed-vars.ipp.yml appends podman-system-generator to
# image_masked_generators only under `mpp-if: pregenerate_quadlets`, and the
# same flag gates a second stage that runs /usr/bin/quadlet_preprocess in the
# build chroot to pre-generate the units into /usr/lib/systemd/system.
# pregenerate_quadlets defaults to `use_ostree` (include/defaults.ipp.yml),
# and `aib build` pins image_mode=bootc, so it is TRUE for this profile --
# which is exactly why the board came up with all seventeen masks. Setting it
# false here drops podman-system-generator from the masked list and drops the
# pre-generation stage, so the stock generator at
# /usr/lib/systemd/system-generators/podman-system-generator (present and
# executable on the board, a symlink to ../../../libexec/podman/quadlet) runs
# normally on the FIRST boot and on every daemon-reload after it.
#
# Why not keep pre-generation, which would also produce units on first boot:
# because it freezes the units at image-build time. /etc/containers/systemd
# would become decorative on a running board -- editing a .container there
# and reloading would change nothing, silently, which is the very failure
# this profile just paid for. Every operational procedure this branch
# documents (the bring-up sequence in x5h-rootfs.aib.yml, the board sessions
# that scp revised units to /etc/containers/systemd, the manifest's own claim
# that Quadlet "auto-enables at unit-generation time on every boot") assumes
# a generator that runs on the board. Losing runtime generation would also
# mean a unit fix could only be validated by a ~23 minute CI image build.
#
# Why not unmask it from the manifest with an add_symlinks entry pointing
# /etc/systemd/system-generators/podman-system-generator at
# /usr/libexec/podman/quadlet -- the obvious-looking fix, and the one the
# board report proposed. It does not merely fail to help, it BREAKS THE
# BUILD. aib's add_symlinks becomes an org.osbuild.ln stage in the `rootfs`
# pipeline, while the mask is created later, in the `ostree-tree` pipeline,
# by org.osbuild.systemd's masked_generators handling -- and that stage does
# a bare os.symlink("/dev/null", target) with no unlink-first and no
# force flag. Our symlink would already occupy the path, so the masking stage
# raises FileExistsError and the image build aborts. Verified against the
# upstream stage source and reproduced locally. An add_files shim at the same
# path collides identically, for the same reason.
#
# Nor a tmpfiles.d `L` line: generators run before systemd-tmpfiles-setup, so
# the symlink would first exist one boot too late -- correct only from the
# second boot onward, which is a worse trap than the bug.
#
# The cost of turning pre-generation off is a few hundred milliseconds of
# generator run per boot. Nothing else in this profile depends on it: the
# other sixteen masked generators are untouched (they come from aib's
# unconditional image_masked_generators default), and bootc-systemd-generator
# in particular stays masked because it is gated on use_bootc, not on this
# flag.
pregenerate_quadlets: false
