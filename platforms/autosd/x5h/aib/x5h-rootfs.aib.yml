name: x5h-rootfs

image:
  hostname: autosd-x5h
  image_size: 6 GiB

content:
  rpms:
    - podman
    - btrfs-progs
    - e2fsprogs
    - gdisk
    - curl
    - iproute
    - procps-ng
    - iptables-nft
    # The base AutoSD image ships no SSH server at all (only crypto-policies
    # fragments mention openssh), so without this the sshd drop-in, the baked
    # authorized_keys and the "enable sshd.service" preset below all describe
    # a service that cannot exist. Board-verified 2026-08-07: no /usr/sbin/sshd
    # and no sshd.service unit in the built rootfs.
    - openssh-server
    # rpmsg-eth-smoke.sh's only end-to-end assertion is an ICMP round trip to
    # the CR52 side (172.16.52.2), and `ping` lives in iputils -- `iproute`
    # above provides `ip`, not `ping`. Without this the smoke test can only
    # report reason=no_ping, so the board gate would prove the tap is
    # configured and never that IP actually round-trips over RPMsg.
    #
    # busybox is NOT a substitute even though a busybox OCI image is already
    # staged on the board by stage-nfs-rootfs.sh: busybox prints
    # "N packets transmitted, N packets received", while the smoke script's
    # summary parser requires ", N received" (iputils' wording). Busybox would
    # therefore produce a false reason=ping_loss -- precisely the misleading
    # failure that parser was written to avoid.
    - iputils
    # Same class of problem as `iputils` above, and it already bit us:
    # x5h-stack-smoke.sh's decisive `stack` check -- the one that proves the
    # CR52 is the source of /control/trajectory_follower/control_cmd, i.e.
    # the one M7 turns on -- used to shell out to `tcpdump -ni tap0`. With
    # tcpdump absent the capture yielded zero packets and the smoke reported
    # reason=control_cmd_not_from_cr52 on a perfectly healthy stack,
    # indistinguishable from a genuinely dead link. That check no longer
    # needs tcpdump (it echoes the topic on domain 2 instead), but the
    # package is installed anyway, because the board has no `dnf` and no
    # `rpm-ostree`: a tool that is absent mid-session cannot be installed,
    # only worked around or misread, and tap0 is a link whose failures
    # (silent oversize drops at MTU 462, RTPS fragments that never
    # reassemble) are diagnosed by looking at frames rather than at
    # counters. Note a board
    # flashed from an image built BEFORE this entry existed will not have
    # tcpdump; check with `command -v tcpdump` before relying on it, rather
    # than concluding from an empty capture that the link is dead.
    - tcpdump
  # add_files (org.osbuild.copy) does not create parent directories, and
  # nothing else in the pipeline creates /etc/containers/containers.conf.d
  # (init_rootfs_dirs_stage creates /etc itself, but not this subtree).
  # aib's own add_files glob path handles this automatically via
  # _ensure_parent_directory, but that helper is never reached for an
  # explicit source_path -> path pair like ours, so the mkdir has to be
  # requested explicitly. make_dirs is emitted as its own org.osbuild.mkdir
  # stage strictly before the org.osbuild.copy stage that add_files feeds
  # (files/simple.mpp.yml's rootfs pipeline: simple_mkdir at stage index 4,
  # simple_copy at stage index 6 -- osbuild runs a pipeline's stages in the
  # order the manifest lists them), so this lands ahead of the copy that
  # needs it.
  make_dirs:
    - path: /etc/containers/containers.conf.d
      parents: true
      exist_ok: true
    - path: /etc/ssh/authorized_keys.d
      parents: true
      exist_ok: true
    - path: /etc/ssh/sshd_config.d
      parents: true
      exist_ok: true
    - path: /etc/NetworkManager/conf.d
      parents: true
      exist_ok: true
    - path: /etc/systemd/system-preset
      parents: true
      exist_ok: true
    - path: /etc/modprobe.d
      parents: true
      exist_ok: true
    - path: /etc/udev/rules.d
      parents: true
      exist_ok: true
    - path: /etc/tmpfiles.d
      parents: true
      exist_ok: true
    - path: /var/log/awf
      parents: true
      exist_ok: true
    - path: /etc/systemd/system.conf.d
      parents: true
      exist_ok: true
    - path: /etc/modules-load.d
      parents: true
      exist_ok: true
    - path: /etc/x5h
      parents: true
      exist_ok: true
    - path: /etc/motd.d
      parents: true
      exist_ok: true
  # NOT in make_dirs, deliberately, and do not "fix" these back:
  #
  #   /usr/libexec, /usr/sbin -- the two install targets below. aib rejects
  #     nothing about them, they simply do not need creating: both already
  #     exist in the built rootfs (verified on the board, both dated from the
  #     image build) because the filesystem package owns them. This manifest
  #     declares no /usr directory for that reason.
  #
  #   /etc/containers/systemd -- same reason, and it needs stating because
  #     this manifest used to create it by accident. The retired
  #     /etc/containers/systemd/launch entry carried parents: true, so the
  #     Quadlet directory came into being as that entry's parent; flattening
  #     the asset layout (see the add_files block) retired it. The directory
  #     is package-owned: `rpm -qf /etc/containers/systemd` on the board
  #     answers containers-common-6.0-2.el10.noarch, and it is present in
  #     the built rootfs dated from the image build, not from any add_files
  #     stage of ours. add_files does not create parents for an explicit
  #     source_path -> path pair, so if that ever stops being true every
  #     component entry below fails at once, loudly, in the copy stage.
  #
  #   /usr/local/libexec, /usr/local/sbin -- REJECTED by aib outright:
  #     "Path '/usr/local/libexec' is not allowed for make_dirs. Files and
  #     directories must be under one of: /etc/, /var/, /usr/, but not under
  #     /usr/local/". The exclusion is not arbitrary: this rootfs is
  #     ostree-structured and ships /usr/local as a symlink to
  #     ../var/usrlocal (see selfboot.md, "A trap when staging files into
  #     the image"), so an image-build-time mkdir there would write through
  #     into a /var that is empty until first boot. The build aborts at the
  #     first offending make_dirs, so the matching add_files entries were
  #     never even reached -- they would have failed the same way.
  #
  #   /var/lib/awf, /var/lib/awf/scenario-sim and
  #     /var/lib/awf/scenario-sim/map -- the scenario working directory
  #     awf-oak-autoware and awf-oak-simulator both bind-mount, and the map
  #     directory inside it. /var IS a permitted make_dirs root, so unlike
  #     the two cases above these would not be rejected; they are declared
  #     in /etc/tmpfiles.d/awf-oak-x5h.conf (installed below) anyway,
  #     because /var on this ostree-structured rootfs is empty until first
  #     boot and an image-build-time mkdir under it writes into a
  #     filesystem that is then replaced. See that file for the full
  #     argument and for why `d` and not `D` (a `D` line would delete the
  #     staged 36 MB point cloud on every boot).
  #
  #   /opt/tier4/kashiwanoha_map -- gone entirely, not merely relocated. The
  #     kashiwanoha map and its extractor unit were retired with the
  #     componentized image set: the MRM scenario ships its own matched map,
  #     whose absolute in-container paths are
  #     /autoware/scenario-sim/map/{lanelet2_map.osm,pointcloud_map.pcd}.
  #     /opt was rejected by aib for the same reason /usr/local is (a
  #     symlink, here to var/opt), which is recorded because the next
  #     profile to reach for /opt will hit the same wall.
  #
  # Note this diverges from platforms/autosd/planning-simulator, which has
  # make_dirs for /opt/tier4/kashiwanoha_map and /usr/local/libexec plus
  # add_files into /usr/local/libexec. That profile has the same latent
  # defect and has evidently never been through an aib build; the divergence
  # here is deliberate and correct, not drift to be reconciled.
  add_files:
    # add_files only permits /etc and /usr destinations (rehearsal finding).
    - source_path: ../config/50-x5h.conf
      path: /etc/containers/containers.conf.d/50-x5h.conf
    # Self-boot / shared-tailnet hardening (see selfboot.md): key-only SSH
    # so the dev root password stays a serial-console-only credential.
    - source_path: ../config/50-x5h-sshd.conf
      path: /etc/ssh/sshd_config.d/50-x5h.conf
    - source_path: ../config/x5h-authorized-keys
      path: /etc/ssh/authorized_keys.d/root
    - source_path: ../config/50-x5h-tsn5-unmanaged.conf
      path: /etc/NetworkManager/conf.d/50-x5h-tsn5-unmanaged.conf
    # May collide with a resolv.conf symlink in the base image; if the copy
    # stage fails CI, drop this entry and stage the file post-dd instead.
    - source_path: ../config/x5h-resolv.conf
      path: /etc/resolv.conf
    - source_path: ../config/x5h-rpmsg-diag.conf
      path: /etc/modprobe.d/x5h-rpmsg-diag.conf
    # Without of_id, uio_pdrv_genirq loads but binds nothing -- see uio.md.
    - source_path: ../config/x5h-uio.conf
      path: /etc/modprobe.d/x5h-uio.conf
    # Binding the UIO devices names them in sysfs only; these turn the names
    # into /dev paths a runtime can open (uio.md, npu-bringup.md).
    - source_path: ../config/51-x5h-uio.rules
      path: /etc/udev/rules.d/51-x5h-uio.rules
    - source_path: ../config/52-x5h-cmem.rules
      path: /etc/udev/rules.d/52-x5h-cmem.rules
    - source_path: ../config/80-x5h.preset
      path: /etc/systemd/system-preset/80-x5h.preset
    # --- role machinery (selfboot.md, "Roles") -----------------------------
    - source_path: ../scripts/x5h-role
      path: /usr/sbin/x5h-role
    - source_path: ../scripts/x5h-role-banner.sh
      path: /usr/sbin/x5h-role-banner.sh
    - source_path: ../config/x5h-role-banner.service
      path: /etc/systemd/system/x5h-role-banner.service
    # --- cr52 role: previously hand-installed per rpmsg-dualboot.md --------
    - source_path: ../scripts/cr52-rproc-up.sh
      path: /usr/sbin/cr52-rproc-up.sh
    - source_path: ../config/cr52-remoteproc.service
      path: /etc/systemd/system/cr52-remoteproc.service
    - source_path: ../config/x5h-rpmsg-modules.conf
      path: /etc/modules-load.d/x5h-rpmsg.conf
    - source_path: ../config/60-nftables.conf
      path: /etc/containers/containers.conf.d/60-nftables.conf
    # --- npu role ----------------------------------------------------------
    - source_path: ../scripts/x5h-npu-up.sh
      path: /usr/sbin/x5h-npu-up.sh
    - source_path: ../config/x5h-npu.service
      path: /etc/systemd/system/x5h-npu.service
    - source_path: ../config/var-opt-npu.mount
      path: /etc/systemd/system/var-opt-npu.mount
    - source_path: ../scripts/npu-contract-smoke.sh
      path: /usr/sbin/npu-contract-smoke.sh
    - source_path: ../scripts/ort-rootfs.containerfile
      path: /usr/sbin/ort-rootfs.containerfile
    - source_path: ../scripts/ort-rootfs.containerignore
      path: /usr/sbin/ort-rootfs.containerignore
    # --- role-independent: container store, watchdog, manifest -------------
    - source_path: ../config/var-lib-containers.mount
      path: /etc/systemd/system/var-lib-containers.mount
    - source_path: ../config/10-watchdog.conf
      path: /etc/systemd/system.conf.d/10-watchdog.conf
    - source_path: ../scripts/x5h-manifest.sh
      path: /usr/sbin/x5h-manifest.sh
    # Component stack (issue #120 M7). Quadlet reads /etc/containers/systemd.
    #
    # The bring-up sequence below only works because aib/vars.yml keeps
    # `pregenerate_quadlets: false`. Under aib's default (true, because
    # `aib build` pins image_mode=bootc and pregenerate_quadlets follows
    # use_ostree) the files installed below still become units -- aib runs
    # Quadlet in the build chroot and writes them into /usr/lib/systemd/system
    # -- but they are FROZEN there at build time, and the runtime generator
    # is masked to /dev/null. /etc/containers/systemd then stops being live:
    # editing a .container on the board and running `systemctl daemon-reload`
    # changes nothing, silently, and the only route to a changed unit is a
    # ~23 minute CI build plus a reflash. See the long note on
    # `pregenerate_quadlets` in aib/vars.yml for the mechanism, for why the
    # fix lives there and not in this file (an add_symlinks unmask at that
    # same path aborts the build; a tmpfiles.d `L` line lands one boot too
    # late), and for why this does NOT also unmask the fstab generator that
    # selfboot.md works around separately.
    #
    # Four of the five `.container` units below carry `[Install] WantedBy=
    # default.target`, which Quadlet auto-enables at unit-generation time on
    # every boot regardless of what 80-x5h.preset says -- there is no preset
    # knob that keeps a Quadlet-generated unit present but dormant. The
    # fifth, awf-oak-simulator.container, has no `[Install]` section at all
    # (deliberate: starting a scenario on every reboot would be wrong), so
    # Quadlet never auto-enables it -- it only ever runs on demand, from the
    # smoke script's `drive` mode. All five units set `Pull=never`.
    #
    # Consequence: a freshly built and flashed image, booted before any
    # container image has been staged onto it, WILL come up with as many as
    # four failed units -- the auto-enabled awf-oak-{autoware,bridge,relay,
    # restamp}. This is expected on that specific boot, not a regression,
    # and the human-ruled fix is to document the sequence below rather than
    # to make those units succeed -- adding start conditions or dropping
    # `[Install]` from any unit would change behavior the unit files
    # (reviewed and frozen) already define.
    #
    # `Pull=never` is not an exception to that ruling: it does not stop a
    # single one of those units from failing, and the count above is
    # unchanged. It only changes the error text -- and with the two
    # Autoware images now referenced by their real ghcr.io names (see
    # ../components/images.txt), it matters more than it did: a store miss
    # against a real registry reference would otherwise start a 5 GB or
    # 7 GB pull from the board rather than failing fast. Without it a
    # `localhost/*` reference that is not in the local store instead sends
    # podman to a registry literally named `localhost` -- three HTTPS
    # retries and a `dial tcp [::1]:443: connection refused`, which reads as
    # a network fault rather than as an unstaged image. Observed on the
    # board 2026-08-18 for awf-oak-bridge, which is still a `localhost/`
    # reference because it is built on the board.
    # Required bring-up order:
    #   1. build and flash this image;
    #   2. stage the two Autoware container images onto the board:
    #      scripts/stage-container-images.sh --stage;
    #   3. build the bridge image on the board (components/bridge/Dockerfile)
    #      -- it has no registry ref, so step 2 cannot stage it;
    #   4. stage the scenario map, 39 MB that is deliberately not committed
    #      and not in either image:
    #      scripts/stage-scenario-map.sh --stage;
    #   5. start the units (systemctl restart --all, or just reboot).
    # Once steps 2-4 have run, the units recover on their own restart policy
    # (or on the reboot in step 5) with no further manifest change needed.
    # The board's documented steady state -- `systemctl is-system-running` =
    # `degraded` with `ukiboot-set-success.service` as the only benign
    # failure -- describes a board that has already been through this
    # sequence; it does not describe the very first boot after flashing.
    #
    # Entries below are ordered alphabetically by target path (ignoring the
    # common /etc/containers/systemd/ prefix) so a new entry has exactly one
    # place to go: where its path sorts.
    - source_path: ../components/awf-oak-autoware.container
      path: /etc/containers/systemd/awf-oak-autoware.container
    - source_path: ../components/awf-oak-bridge.container
      path: /etc/containers/systemd/awf-oak-bridge.container
    - source_path: ../components/awf-oak-relay.container
      path: /etc/containers/systemd/awf-oak-relay.container
    - source_path: ../components/awf-oak-restamp.container
      path: /etc/containers/systemd/awf-oak-restamp.container
    - source_path: ../components/awf-oak-simulator.container
      path: /etc/containers/systemd/awf-oak-simulator.container
    - source_path: ../components/awf-oak-x5h.env
      path: /etc/containers/systemd/awf-oak-x5h.env
    - source_path: ../components/bridge/bridge-config.yaml
      path: /etc/containers/systemd/bridge-config.yaml
    # EVERY mounted asset lands FLAT in /etc/containers/systemd/<basename>,
    # whatever subdirectory the repository keeps it in: launch/, nodes/ and
    # scenario/ group these files for human readers and have no meaning on
    # the board. The rule is stated in ../components/awf-oak-x5h.env and the
    # units' Volume= lines are written against it. Its practical consequence
    # here is that no asset subdirectory needs creating, so the
    # /etc/containers/systemd/launch make_dirs entry that the old
    # launch/control.launch.xml target required is gone; adding a mounted
    # asset now means adding exactly one add_files entry, in the one place
    # its target path sorts.
    - source_path: ../components/launch/control.launch.xml
      path: /etc/containers/systemd/control.launch.xml
    - source_path: ../components/nodes/control_restamp.py
      path: /etc/containers/systemd/control_restamp.py
    - source_path: ../components/cyclonedds-x5h.xml
      path: /etc/containers/systemd/cyclonedds-x5h.xml
    - source_path: ../components/scenario/mrm-scenario.yaml
      path: /etc/containers/systemd/mrm-scenario.yaml
    - source_path: ../components/nodes/traj_relay.py
      path: /etc/containers/systemd/traj_relay.py
    # /var/lib/awf/scenario-sim{,/map} -- the scenario working directory
    # awf-oak-autoware and awf-oak-simulator mount, and the directory the
    # map is staged into -- are created at boot by systemd-tmpfiles rather
    # than at image-build time, because /var is empty until first boot. See
    # config/awf-oak-x5h-tmpfiles.conf for the full reasoning and the
    # ordering argument. Target name drops the source's "-tmpfiles" infix:
    # everything in /etc/tmpfiles.d is a tmpfiles config already.
    - source_path: ../config/awf-oak-x5h-tmpfiles.conf
      path: /etc/tmpfiles.d/awf-oak-x5h.conf
    # rpmsg-eth: only the unit file and its ifup helper are installed by
    # this manifest. The daemon binary itself (ExecStart=/usr/local/bin/
    # rpmsg-eth) is a statically-linked binary built on a host with an
    # aarch64 cross toolchain from platforms/autosd/x5h/rpmsg-eth/rpmsg-eth.c
    # and is deliberately NOT checked into the repo or copied by this
    # manifest -- it is staged onto the board separately, per the manual
    # install procedure documented in rpmsg-dualboot.md.
    #
    # The cr52-remoteproc trio (cr52-rproc-up.sh, cr52-remoteproc.service,
    # x5h-rpmsg-modules.conf -- see the "cr52 role" block above) was
    # previously hand-installed per that same doc; it is now installed by
    # this manifest instead, because its script ships in the image. The
    # rpmsg-eth daemon binary above is the only piece of this chain that
    # remains hand-staged, and it is staged by stage-board.sh, not by the
    # manual procedure rpmsg-dualboot.md describes.
    #
    # 80-x5h.preset below does NOT enable rpmsg-eth.service, but that does
    # not keep the unit out of a normal boot: awf-oak-bridge.container
    # carries Requires=rpmsg-eth.service and [Install] WantedBy=
    # default.target, so Quadlet auto-enables the bridge and the bridge
    # pulls the link up at boot whatever the preset says. The preset
    # omission only matters on boots where nothing else wants the link.
    # What keeps an unstaged binary benign is the unit's own
    # ConditionPathExists=/usr/local/bin/rpmsg-eth: without it, ExecStart
    # fails at once and Restart=on-failure + RestartSec=1 +
    # StartLimitIntervalSec=0 retry forever at roughly 1 Hz -- an endless
    # restart loop, not the single permanently-failed unit this comment
    # used to claim. A condition that is not met is not a failure, so
    # systemd logs one line naming the missing path, skips the unit, and
    # reports the start job as successful, satisfying the bridge's
    # Requires= cleanly. This is also why rpmsg-eth.service is NOT one of
    # the up-to-four failed units described above: it is skipped, not
    # failed, and it was never failed before either (it looped). The same
    # mechanism now guards the map: awf-oak-autoware and awf-oak-simulator
    # carry ConditionPathExists= on the two staged map files, so a board
    # whose map has not been staged skips those units with a journal line
    # naming the missing path instead of hanging in INITIALIZING.
    - source_path: ../config/rpmsg-eth.service
      path: /etc/systemd/system/rpmsg-eth.service
    - source_path: ../scripts/rpmsg-eth-ifup.sh
      path: /usr/sbin/rpmsg-eth-ifup.sh
    # The board smoke, installed BY THE IMAGE rather than copied onto the
    # board by hand. component-stack.md calls this manifest the source of
    # truth for every file on the board and says the mapping installs the
    # smoke script; until this entry existed that sentence was simply
    # false, and the gap is the one that actually bites: a hand-copied
    # checker in /var/tmp goes stale the moment the repository moves, and
    # then grades a board against a contract that no longer exists. It
    # sits in /usr/sbin beside rpmsg-eth-ifup.sh -- an operator-run,
    # root-only tool -- not in /etc/containers/systemd, which is for
    # things the units mount.
    - source_path: ../scripts/x5h-stack-smoke.sh
      path: /usr/sbin/x5h-stack-smoke.sh
    # Same directory as the smoke, and that is a requirement rather than
    # tidiness: `drive` locates this file as $(dirname "$0")/x5h-stop-
    # metrics.awk, so the pair has to be installed together or the metric
    # fails as mrm_no_stop_metrics on a board that looks fully staged.
    - source_path: ../scripts/x5h-stop-metrics.awk
      path: /usr/sbin/x5h-stop-metrics.awk

auth:
  # root password "autosd" — dev/bench image only, never a board deliverable.
  root_password: '$6$G8EEOdazon1o20yt$T22wsSokbA6eqYp86lCfEOSxNErCZkUjFNJfigB.PF4ijgJTzbrDA4GNHKNufhBc1vyiLm6Be7Elb16olXv590'
