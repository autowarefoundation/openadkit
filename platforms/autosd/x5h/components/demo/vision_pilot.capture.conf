# VisionPilot on the X5H NPU, for a demo RECORDING run. Not for the demo.
#
# Stage this over /etc/containers/systemd/vision_pilot.conf in place of
# vision_pilot.conf for one recording session, then put the original back.
# x5h-vp.container mounts that path read-only into the container, so nothing
# else changes and no Quadlet is edited.
#
# It differs from vision_pilot.conf in two lines, and only those two:
#   visualization_on = true   VisionPilot composes its production HUD.
#   record_dir                the FrameRecorder sink writes one lossless PNG
#                             per rendered frame into this directory.
#
# **The board image has to be built from a ref that carries the sink.** An
# empty record_dir has sat in vision_pilot.conf for a while, but the ref the
# image is built from, feat/x5h-carla-npu, has no frame_recorder.cpp in it, so
# the key is read by nothing. Setting it on that image records silently
# nothing. Merge feat/frame-recorder-sink into the build ref first.
#
# **Both lines cost time**, which is why this is a separate file. Composing and
# writing the HUD is work VisionPilot does not do during a measured run, so a
# recording run is not a gate run and its wall time is not gate D5's number.
#
# **Disk.** One PNG per rendered frame at level 1 compression, roughly 0.5 to
# 1 MB each, at the input rate. The cut in make_demo_reel.py asks for about
# 80 s before the fault and 55 s after it, so budget about 1.5 GB and check the
# free space first with `stat -f /opt/npu`, never with `df`: ext4's reserved
# block count on this filesystem makes df report 0 available while hundreds of
# megabytes are free to root.
source.mode              = ros2
engine.provider          = renesas
engine.device_id         = 0
engine.artifacts_dir     = /npu/perf/merged/v7_frozen_s3cal_artifacts
engine.arc_prog_path     = /npu/hostapp/binary
engine.require_npu_nodes = 1
model.merged             = true
model.merged_path        = /npu/perf/merged/v7_frozen_s3cal_artifacts/v7_frozen.onnx
model.contract           = /npu/v7-contract.json
model.precision          = fp32
speed_limit              = 4.0
L                        = 2.860
visualization_on         = true
# /npu is /opt/npu on the board, mounted writable by x5h-vp.container.
record_dir               = /npu/video/hud
radar.enabled            = false
