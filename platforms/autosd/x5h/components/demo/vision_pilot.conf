# VisionPilot on the X5H NPU for the CES 2027 demo. Mounted over
# /usr/share/visionpilot/config/vision_pilot.conf by x5h-vp.container.
source.mode              = ros2
engine.provider          = renesas
engine.device_id         = 0
# The artifact set is not relocatable: nnx/manifest.json records the path it
# was compiled at, and x5h-vp.container binds /opt/npu at /npu so that path
# resolves. Check with: grep -o '"/npu[^"]*' <set>/nnx/manifest.json | head -1
engine.artifacts_dir     = /npu/perf/merged/v7_frozen_s3cal_artifacts
# Board-verified 2026-09-15 against board 1: the brief's
# /npu/ort/nnac_portable_env/binary does not exist on the board.
# /opt/npu/hostapp/binary is the real directory (arc_prog_npun,
# arc_prog_npun_rtt, arc_prog_npus, arc_prog_npus_rtt, host_app).
engine.arc_prog_path     = /npu/hostapp/binary
engine.require_npu_nodes = 1
model.merged             = true
# Board-verified 2026-09-15: the brief's /npu/perf/merged/v7_frozen.onnx does
# not exist. The 147.3 MB model lives on the workstation at
# x5h-work/npu/merged/v7_frozen_s3cal_artifacts/v7_frozen.onnx and still has to
# be staged to this path on the board (Task 5); the board's copy of the
# artifact set currently holds only compiler intermediates.
model.merged_path        = /npu/perf/merged/v7_frozen_s3cal_artifacts/v7_frozen.onnx
model.contract           = /npu/v7-contract.json
model.precision          = fp32
speed_limit              = 4.0
L                        = 2.860
visualization_on         = false
record_dir               =
radar.enabled            = false
