# Hardware watchdog: Renesas WDT, 60 s fixed timeout (SETTIMEOUT unsupported).
# Pet at half the timeout so a hung PID 1 expires the watchdog and resets the SoC.
# Fires ONLY if PID 1 stops petting; an oops that leaves systemd alive is
# invisible here, which is why oops=panic is in the kernel command line.
[Manager]
RuntimeWatchdogSec=30
RebootWatchdogSec=60
