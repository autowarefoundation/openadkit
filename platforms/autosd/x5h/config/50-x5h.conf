# Shipped to /etc/containers/containers.conf.d/50-x5h.conf.
#
# READ 60-nftables.conf FIRST. This file no longer decides the driver on this
# image: 60-nftables.conf ships in the same directory, sorts later, and sets
# firewall_driver = "nftables", which is what netavark actually resolves. What
# survives here is the reasoning, and one live use.
#
# The reasoning is about a kernel WITHOUT CONFIG_NF_TABLES, which on this
# branch means the vendor BSP kernel and the retired BSP-mimic gate kernel, not
# the rebuilt 6.1.102-autosd kernel every self-boot role runs. The live use is
# the NFS rescue root, which both kernels share: a BSP-kernel boot there needs
# "none" put back, by a later-sorting drop-in, per the instruction at the end of
# 60-nftables.conf. This value is kept rather than deleted so that instruction
# has a documented origin instead of being folklore.
#
# firewall_driver = "none": on such a kernel, the only value netavark on this
# image both accepts and can run. Two independent reasons, confirmed rather
# than assumed (see README Troubleshooting for the source check against
# containers/netavark's own repo):
#   - This image resolves netavark 2.0.0 (CentOS Stream 10's AppStream repo
#     also carries 1.16.0/1.17.2, which still had an "iptables" backend, but
#     2.0.0 dropped it -- upstream's src/firewall/mod.rs at each tag confirms
#     it). "iptables" is not a config-naming mismatch to work around; it is a
#     value this netavark release does not recognize at all, and it fails
#     the same way on the board as it did in the QEMU gate.
#   - Its "nftables" backend would need CONFIG_NF_TABLES, which the BSP
#     kernel does not have; "firewalld" needs a running dbus/firewalld
#     daemon this image does not configure. "none" is what remains, and the
#     QEMU gate empirically confirmed it works: podman0 bridge up, veth in
#     forwarding, direct-container-IP curl succeeding (GATE5_NONE_OK).
[network]
firewall_driver = "none"
