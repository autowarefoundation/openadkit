# Shipped in the base image and installed by aib/x5h-rootfs.aib.yml.
# It overrides 50-x5h.conf's firewall_driver="none" setting, which remains
# correct for the BSP kernel (no CONFIG_NF_TABLES there). This file sorts
# after 50-x5h.conf, so its value always wins and nftables is enabled
# unconditionally. The BSP kernel cannot run it (no CONFIG_NF_TABLES);
# this requires compatible kernel deployments.
[network]
firewall_driver = "nftables"
