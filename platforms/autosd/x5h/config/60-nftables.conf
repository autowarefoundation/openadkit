# Shipped in the base image: aib/x5h-rootfs.aib.yml installs this to
# /etc/containers/containers.conf.d/60-nftables.conf, unconditionally, on every
# image built from this branch. (scripts/inject-test-images.sh also installs it
# into the QEMU gate's ext4 export. That is now a redundant overwrite of a file
# the tar already carries, kept so a replay against an older tar still gets it.)
#
# It sorts after 50-x5h.conf, so its value always wins and the nftables driver
# is what netavark actually resolves. 50-x5h.conf's firewall_driver="none" is
# therefore not the effective setting anywhere on this image; read its header
# for why "none" was once the only workable value, and this one for why it no
# longer is.
#
# That is correct for every self-booting deployment, because the AutoSD rootfs
# only ever runs the rebuilt 6.1.102-autosd kernel, which has CONFIG_NF_TABLES.
# uboot/x5h-env.tmpl boots the cr52 and npu roles from root=PARTUUID=...5e02
# with Image-autosd; the yocto role boots a different root (...5e12) with the
# vendor kernel, so the vendor kernel never sees this file.
#
# THE ONE PLACE THAT IS NOT TRUE is the NFS rescue root. Both kernels share it
# by design, and scripts/stage-nfs-rootfs.sh extracts the same aib tar that
# scripts/make-ufs-rootfs.sh does, so the rescue root receives this drop-in too
# and a BSP-kernel rescue boot resolves a driver its kernel cannot run (the BSP
# kernel has no CONFIG_NF_TABLES). Symptom: netavark rejects its ruleset and
# container networking is dead, with nothing pointing at this file.
#
# TO BOOT THE BSP KERNEL ON A STAGED NFS ROOT, put the value back with a
# later-sorting drop-in rather than deleting this one:
#
#   printf '[network]\nfirewall_driver = "none"\n' \
#     > <staged-nfs-root>/etc/containers/containers.conf.d/70-bsp-firewall.conf
#
# `rm -f .../60-nftables.conf` is NOT equivalent and is the recipe this repo
# used to print: the next stage-nfs-rootfs.sh re-extracts the file from the tar,
# so the removal is silently undone the next time the root is re-staged. A
# 70-*.conf survives that, because it sorts after whatever the tar restores.
# Remove it again before booting the rebuilt kernel on that root.
[network]
firewall_driver = "nftables"
