# Staged ONLY alongside the rebuilt 6.1.102-autosd kernel (QEMU gate: by
# inject-test-images.sh; board: by stage-rebuilt-kernel.sh) — never shipped
# in the base image, where 50-x5h.conf's firewall_driver="none" remains
# correct for the BSP kernel (no CONFIG_NF_TABLES there). This file sorts
# after 50-x5h.conf, so its value wins when present: enabling nftables is
# structurally tied to deploying the kernel that can run it.
[network]
firewall_driver = "nftables"
