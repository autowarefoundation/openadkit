# CycloneDDS asks for a 1 MiB socket receive buffer and quietly takes less.
# At the kernel's rmem_max of 212992 it got 416 KiB, and VisionPilot's socket,
# which takes the 2.7 MB decoded camera frame from the image_transport
# republisher over loopback, dropped datagrams: 0.4-0.7 s planning gaps tripped
# the CR52's 0.5 s heartbeat staleness (board 2, 2026-10-13). At 8 MiB the
# same drives had no drops and no gaps.
net.core.rmem_max = 8388608
