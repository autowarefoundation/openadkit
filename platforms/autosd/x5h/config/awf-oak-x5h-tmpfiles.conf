# systemd-tmpfiles config for the Open AD Kit component stack (issue #120 M7).
# Installed by aib/x5h-rootfs.aib.yml to /etc/tmpfiles.d/awf-oak-x5h.conf.
#
# Why this file exists instead of a make_dirs entry: automotive-image-builder
# only permits make_dirs (and add_files) under /etc/, /usr/ or /var/, and
# rejects the build outright otherwise -- "Path '...' is not allowed for
# make_dirs". /opt is not a permitted root, and on this ostree-structured
# rootfs it is in fact a symlink to var/opt (board-verified), so creating it
# at image-build time would write into a /var that is empty until first boot
# anyway. /etc/tmpfiles.d IS permitted, so the directory is declared here and
# created at boot instead.
#
# The mount path is deliberately unchanged: all nine awf-oak-*.container units
# mount /opt/tier4/kashiwanoha_map and components/awf-oak-x5h-extract-map.sh
# writes it. Only the mechanism that creates it moved.
#
# Ordering is safe without any extra After= on the consuming units.
# systemd-tmpfiles-setup.service is Before=sysinit.target (board-verified),
# and every normal service unit -- the extractor one-shot and all nine Quadlet
# units included -- gets an implicit After=sysinit.target basic.target from
# DefaultDependencies=yes. So this directory exists before default.target
# pulls in anything that mounts it.
#
# /opt/tier4 is listed explicitly rather than relying on parent
# auto-creation: awf-oak-x5h-extract-map.sh does `mktemp -d` in /opt/tier4
# (alongside the map dir, so the atomic rename onto it stays on one
# filesystem) and also puts kashiwanoha_map.old there, so the parent must be
# a directory we have declared the mode of, not an incidental byproduct.
#
# Type d, not D: D would empty the directory on boot, which would throw away
# an already-extracted map and make awf-oak-x5h-extract-map.service re-run its
# multi-gigabyte container extraction on every reboot.
#
# 0755 root:root -- root writes it (the extractor is a system one-shot) and
# the nine component units mount it read-only (:ro,z), so nothing else needs
# write access.
#Type Path                          Mode UID  GID  Age Argument
d /opt/tier4                        0755 root root -   -
d /opt/tier4/kashiwanoha_map        0755 root root -   -
