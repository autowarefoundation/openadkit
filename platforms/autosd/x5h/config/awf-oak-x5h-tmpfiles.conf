# systemd-tmpfiles config for the Open AD Kit X5H stack (issue #120 M7).
# Installed by aib/x5h-rootfs.aib.yml to /etc/tmpfiles.d/awf-oak-x5h.conf.
#
# What it creates: the scenario working directory that awf-oak-autoware and
# awf-oak-simulator both bind-mount at /autoware/scenario-sim, plus the
# map/ subdirectory inside it.
#
# Why a tmpfiles.d file and not make_dirs: automotive-image-builder permits
# make_dirs under /etc/, /usr/ and /var/, so /var/lib/awf WOULD be legal
# there. It is declared here anyway for two reasons. First, /var on this
# ostree-structured rootfs is empty until first boot, so an image-build-time
# mkdir under /var is a directory created into a filesystem that is then
# replaced -- the same trap that caught /opt/tier4 (a symlink to var/opt) and
# /usr/local (a symlink to ../var/usrlocal), and the reason those two are
# rejected outright rather than merely unhelpful.
#
# This is NOT the only place the stack's runtime directories come from, and
# the difference is worth knowing when a mount source turns up missing:
# /var/log/awf -- where the junit verdict is written, and so the directory
# most likely to be the one being looked for -- is created by a make_dirs
# entry in aib/x5h-rootfs.aib.yml instead. That is legal (it is under /var)
# and it predates this file. It is not moved here, because moving it would
# change when the directory appears (image build time versus first boot) for
# no benefit. Two places, and this note is the pointer between them.
#
# This file previously declared /opt/tier4 and /opt/tier4/kashiwanoha_map for
# the retired map extractor. Both are gone: the MRM scenario ships its own
# matched map (its RoadNetwork entries hard-code
# /autoware/scenario-sim/map/lanelet2_map.osm and .../pointcloud_map.pcd),
# nothing on this profile consumes the kashiwanoha map any more, and
# awf-oak-x5h-extract-map.service has been removed with it.
#
# The map FILES are deliberately not shipped in the image and not committed:
# lanelet2_map.osm is 3.2 MB and pointcloud_map.pcd is 36 MB. They are staged
# into /var/lib/awf/scenario-sim/map on the board separately. This file only
# guarantees the directory exists, so a stack started before the map is
# staged fails on a missing map rather than on a missing mount source --
# podman would otherwise CREATE the source directory itself and hide the
# difference.
#
# A directory is a weaker guarantee than the retired
# awf-oak-x5h-extract-map.service was, though, because an EMPTY map
# directory still lets Autoware start green and hang in INITIALIZING for
# ever. awf-oak-autoware.container and awf-oak-simulator.container therefore
# also carry ConditionPathExists= on the two map files themselves. This file
# and those conditions are two halves of one guard and neither is sufficient
# alone: without the directory the mount source is invented by podman,
# without the conditions the empty directory is silent.
#
# Ordering needs no extra After= on the consuming units.
# systemd-tmpfiles-setup.service is Before=sysinit.target (board-verified),
# and every normal service unit -- all five Quadlet units included -- gets an
# implicit After=sysinit.target basic.target from DefaultDependencies=yes. So
# these directories exist before default.target pulls in anything that mounts
# them.
#
# Type d, not D: D would empty the directory on boot, which would throw away
# a staged 36 MB point cloud on every reboot.
#
# 0755 root:root -- root writes it (staging is a root operation) and the two
# units that mount it run as root inside the container.
#Type Path                          Mode UID  GID  Age Argument
d /var/lib/awf                      0755 root root -   -
d /var/lib/awf/scenario-sim         0755 root root -   -
d /var/lib/awf/scenario-sim/map     0755 root root -   -
