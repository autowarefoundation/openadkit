# The X5H boards have no working RTC, and the bench LAN has one time source:
# rog-amd (192.168.0.1). Step only in the first three updates after boot,
# never while the vehicle drives: the restamp node and DDS stamps use this
# clock.
server 192.168.0.1 iburst
makestep 1.0 3
driftfile /var/lib/chrony/drift
