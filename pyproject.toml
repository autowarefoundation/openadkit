# Lint settings for the CLI and the CI scripts (run by .github/workflows/lint.yaml).

[tool.ruff]
target-version = "py310"
src = ["cli", ".github/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# Long lines are left to review; the code keeps messages and commands on one line.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["cli", ".github/scripts"]
exclude = ["^\\.github/scripts/tests/"]
mypy_path = ["cli", ".github/scripts"]
explicit_package_bases = true
ignore_missing_imports = true
